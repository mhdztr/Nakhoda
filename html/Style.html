<style>
/**
 * html/Style.html — Design System Nakhoda
 * Sesuai DESIGN.md: Achromatic Ledger, Oranye Keselamatan (#D9480F), Kontrol 3-Tier
 */

:root {
  /* ── 1. Palet Warna (Light Mode) ── */
  --ground:            #F4F5F6;
  --surface:           #FFFFFF;
  --raised:            #ECEEF0;
  --active:            #E7E9EC;
  --border:            #E3E5E8;
  --rule:              #EEF0F2;
  --control:           #CDD1D6;
  --text:              #0F1214;
  --muted:             #5B626A;
  --faint:             #66707A;
  --primary:           #15181B;
  --primary-hover:     #25292D;

  /* Warna Data Utama (Oranye Keselamatan) */
  --accent:            #D9480F;
  --accent-ink:        #B53A06;
  --chart-2:           #7B838B;

  /* Warna Semantik Perubahan & Status */
  --positive:          #247B50;
  --negative:          #C4242A;
  --warning:           #6B4B00;
  --focus:             #0F1214;

  /* Status Pills (Background & Ink) */
  --pill-positive-bg:  #DCFAE5;
  --pill-positive-ink: #04250E;
  --pill-negative-bg:  #FFEDEA;
  --pill-negative-ink: #831C1E;
  --pill-warning-bg:   #FFF6D6;
  --pill-warning-ink:  #6B4B00;
  --pill-neutral-bg:   #ECEEF0;
  --pill-neutral-ink:  #3D4348;

  /* ── 2. Skala Geometri Kontrol 3-Tier (Aturan Keras AGENTS.md) ── */
  --ctl-h-lg:          40px;
  --ctl-px-lg:         14px;
  --ctl-fs-lg:         14px;

  --ctl-h-md:          32px;
  --ctl-px-md:         12px;
  --ctl-fs-md:         13px;

  --ctl-h-sm:          26px;
  --ctl-px-sm:         10px;
  --ctl-fs-sm:         12px;

  /* Radius & Elevasi */
  --radius-card:       8px;
  --radius-control:    6px;
  --radius-chip:       4px;
  --radius-pill:       9999px;

  /* Jarak & Gutter */
  --gap:               12px;
  --pad:               24px;
  --card-pad:          20px;
  --sidebar-w:         240px;

  /* Tipografi */
  --font-main:         'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono:         'Geist Mono', monospace;

  /* Durasi Transisi Taktikal */
  --dur-press:         90ms;
  --dur-ui:            160ms;
  --dur-sheet:         240ms;
  --ease-out:          cubic-bezier(0.2, 0, 0, 1);
}

/* ── Reset Dasar ── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-main);
  background-color: var(--ground);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── Angka Tabular (Tabular Figures) ── */
.tnum,
.tabular-nums,
table td,
.kpi-value,
.badge-count {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* ── Shell: Open Plane Architecture ── */
#app-shell {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

#app-sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background-color: var(--ground);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

#app-main {
  flex: 1;
  min-width: 0;
  padding: 32px var(--pad);
  max-width: 1440px;
}

/* ── Header Sidebar & Panji November ── */
.brand-box {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 18px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.brand-flag {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}

.brand-text h1 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
}

.brand-text p {
  font-size: 11px;
  color: var(--muted);
}

/* ── Navigasi Sidebar ── */
.nav-group-title {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  padding: 16px 8px 6px 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 32px;
  padding: 0 10px;
  border-radius: var(--radius-control);
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  transition: background-color var(--dur-ui) var(--ease-out), color var(--dur-ui) var(--ease-out);
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}

.nav-item:hover {
  background-color: var(--raised);
  color: var(--text);
}

.nav-item.active {
  background-color: var(--active);
  color: var(--text);
  font-weight: 500;
}

.nav-item svg {
  width: 16px;
  height: 16px;
  stroke-width: 1.5;
  stroke: currentColor;
  fill: none;
  flex-shrink: 0;
}

.nav-badge {
  margin-left: auto;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: var(--radius-chip);
  background-color: var(--pill-negative-bg);
  color: var(--pill-negative-ink);
  font-weight: 500;
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ── User Avatar Inisial ── */
.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-pill);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 500;
  background-color: var(--raised);
  color: var(--text);
  flex-shrink: 0;
}

.user-info {
  min-width: 0;
  flex: 1;
}

.user-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-role {
  font-size: 11px;
  color: var(--muted);
}

/* ── Baris Judul Layar & Temuan Data ── */
.screen-header {
  margin-bottom: 24px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.screen-title-wrap h2 {
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}

.screen-finding {
  font-size: 14px;
  color: var(--muted);
}

.screen-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── Kontainer Kontrol 3-Tier ── */
.ctl-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ctl-fill {
  width: 100%;
}

/* Tier LG (40px) */
.ctl-lg button,
.ctl-lg input,
.ctl-lg select,
button.btn-lg,
input.input-lg,
select.select-lg {
  height: var(--ctl-h-lg);
  padding: 0 var(--ctl-px-lg);
  font-size: var(--ctl-fs-lg);
  border-radius: var(--radius-control);
}

/* Tier MD (32px) */
.ctl-md button,
.ctl-md input,
.ctl-md select,
button.btn-md,
input.input-md,
select.select-md {
  height: var(--ctl-h-md);
  padding: 0 var(--ctl-px-md);
  font-size: var(--ctl-fs-md);
  border-radius: var(--radius-control);
}

/* Tier SM (26px) */
.ctl-sm button,
button.btn-sm {
  height: var(--ctl-h-sm);
  padding: 0 var(--ctl-px-sm);
  font-size: var(--ctl-fs-sm);
  border-radius: var(--radius-control);
}

/* ── Gaya Tombol (Buttons) ── */
button {
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 500;
  border: 1px solid transparent;
  cursor: pointer;
  background: transparent;
  color: var(--text);
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-ui) var(--ease-out);
}

button:active {
  transform: scale(0.98);
}

.btn-primary {
  background-color: var(--primary);
  color: #FFFFFF;
  border-color: var(--primary);
}

.btn-primary:hover {
  background-color: var(--primary-hover);
}

.btn-secondary {
  background-color: var(--surface);
  color: var(--text);
  border-color: var(--control);
}

.btn-secondary:hover {
  background-color: var(--raised);
}

.btn-danger {
  background-color: transparent;
  color: var(--negative);
  border-color: var(--control);
}

.btn-danger:hover {
  background-color: var(--pill-negative-bg);
  border-color: var(--negative);
}

.btn-danger-solid {
  background-color: var(--negative);
  color: #FFFFFF;
  border-color: var(--negative);
}

/* ── Gaya Input Form ── */
input[type="text"],
input[type="password"],
input[type="number"],
input[type="date"],
select,
textarea {
  font-family: inherit;
  background-color: var(--surface);
  color: var(--text);
  border: 1px solid var(--control);
  outline: none;
  transition: border-color var(--dur-ui) var(--ease-out);
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--focus);
}

input::placeholder,
textarea::placeholder {
  color: var(--faint);
}

/* ── Kartu Permukaan Datar (Cards) ── */
.card {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--card-pad);
  margin-bottom: 24px;
}

.card-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.card-title {
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
}

/* ── Strip KPI Satu Kontainer ── */
.kpi-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  margin-bottom: 24px;
  overflow: hidden;
}

.kpi-col {
  padding: 18px 20px;
  border-right: 1px solid var(--border);
}

.kpi-col:last-child {
  border-right: none;
}

.kpi-label {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.kpi-value {
  font-size: 24px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.1;
}

.kpi-value-lead {
  font-size: 30px;
  font-weight: 500;
}

.kpi-delta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

/* ── Tabel Tanpa Zebra ── */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  background-color: var(--surface);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}

thead th {
  height: 36px;
  padding: 0 14px;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  background-color: var(--surface);
  white-space: nowrap;
}

tbody tr {
  height: 44px;
  border-bottom: 1px solid var(--rule);
  transition: background-color var(--dur-ui) var(--ease-out);
}

tbody tr:last-child {
  border-bottom: none;
}

tbody tr:hover {
  background-color: var(--raised);
}

tbody tr.selected {
  background-color: var(--active);
}

td {
  padding: 0 14px;
  color: var(--text);
  vertical-align: middle;
}

td.text-right,
th.text-right {
  text-align: right;
}

/* ── Pills Status ── */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 8px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  flex-shrink: 0;
}

.pill-dot {
  width: 6px;
  height: 6px;
  border-radius: var(--radius-pill);
  background-color: currentColor;
}

.pill-positive {
  background-color: var(--pill-positive-bg);
  color: var(--pill-positive-ink);
}

.pill-negative {
  background-color: var(--pill-negative-bg);
  color: var(--pill-negative-ink);
}

.pill-warning {
  background-color: var(--pill-warning-bg);
  color: var(--pill-warning-ink);
}

.pill-neutral {
  background-color: var(--pill-neutral-bg);
  color: var(--pill-neutral-ink);
}

/* ── Dialog Modal Datar ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(15, 18, 20, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}

.modal-dialog {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  width: 100%;
  max-width: 560px;
  padding: 24px;
  box-shadow: 0 8px 24px rgba(15, 18, 20, 0.12);
}

.modal-hd {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
}

.modal-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 24px;
}

/* ── Lembar Samping (Slide-over Sheet) ── */
.sheet-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 480px;
  max-width: 100vw;
  height: 100vh;
  background-color: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 999;
  box-shadow: -4px 0 24px rgba(15, 18, 20, 0.08);
  display: flex;
  flex-direction: column;
}

.sheet-hd {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

/* ── Toaster Toast ── */
#toaster {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-control);
  padding: 12px 16px;
  font-size: 13px;
  box-shadow: 0 4px 16px rgba(15, 18, 20, 0.10);
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 260px;
  max-width: 400px;
}

.toast-positive { border-left: 3px solid var(--positive); }
.toast-negative { border-left: 3px solid var(--negative); }
.toast-warning  { border-left: 3px solid var(--warning); }

/* ── Utilitas ── */
.hidden { display: none !important; }
</style>
