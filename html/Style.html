<style>
/**
 * html/Style.html — Sistem Desain Nakhoda (Achromatic Ledger)
 * Sesuai DESIGN.md, PRD.md, dan AGENTS.md:
 * - Palet Akromatik Hangat + Oranye Keselamatan Laut (#D9480F)
 * - Skala Geometri Kontrol 3-Tier Tunggal (LG: 40px, MD: 32px, SM: 26px)
 * - Kapitalisasi Kalimat (Tanpa text-transform: uppercase)
 * - Angka Tabular Wajib (tabular-nums)
 */

:root {
  /* ── 1. Token Permukaan & Tinta (Achromatic Ledger — Light Mode) ── */
  --ground:            #F4F5F6;
  --surface:           #FFFFFF;
  --raised:            #ECEEF0;
  --active:            #E7E9EC;
  --border:            #E3E5E8;
  --rule:              #EEF0F2;
  --control:           #CDD1D6;

  --text:              #0F1214;
  --ink-secondary:     #2C3137;
  --muted:             #5B626A;
  --faint:             #66707A;

  --primary:           #15181B;
  --primary-hover:     #25292D;

  /* ── 2. Warna Data Utama (Oranye Keselamatan Laut / International Safety Orange) ── */
  --accent:            #D9480F;
  --accent-ink:        #B53A06;
  --accent-soft:       #FFF0EB;
  --chart-2:           #7B838B;

  /* ── 3. Warna Semantik Perubahan & Status ── */
  --positive:          #247B50;
  --negative:          #C4242A;
  --warning:           #6B4B00;
  --focus:             #0F1214;

  /* Status Pills (Background & Ink) */
  --pill-positive-bg:  #DCFAE5;
  --pill-positive-ink: #04250E;
  --pill-negative-bg:  #FFEDEA;
  --pill-negative-ink: #831C1E;
  --pill-warning-bg:   #FFF6D6;
  --pill-warning-ink:  #6B4B00;
  --pill-neutral-bg:   #ECEEF0;
  --pill-neutral-ink:  #3D4348;

  /* ── 4. Skala Geometri Kontrol 3-Tier (Aturan Keras AGENTS.md) ── */
  --ctl-h-lg: 40px;
  --ctl-px-lg: 14px;
  --ctl-fs-lg: 14px;

  --ctl-h-md: 32px;
  --ctl-px-md: 12px;
  --ctl-fs-md: 13px;

  --ctl-h-sm: 26px;
  --ctl-px-sm: 10px;
  --ctl-fs-sm: 12px;

  /* ── 5. Radius, Jarak, & Tipografi ── */
  --radius-card:       8px;
  --radius-control:    6px;
  --radius-chip:       4px;
  --radius-pill:       9999px;

  --gap:               12px;
  --pad:               24px;
  --card-pad:          20px;
  --sidebar-w:         240px;

  --font-main:         'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono:         'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  --dur-press:         90ms;
  --dur-ui:            160ms;
  --dur-sheet:         220ms;
  --ease-out:          cubic-bezier(0.22, 1, 0.36, 1);
}

/* ── Reset Dasar ── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
  font-family: var(--font-main);
  background-color: var(--ground);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── Angka Tabular Wajib (DESIGN.md §3.3) ── */
.tnum,
.tabular-nums,
.mono,
table td,
table th,
.kpi-value,
.kpi-value-lead,
.kpi-delta,
.sijil-cell,
.nav-badge,
.badge-count,
input[type="number"] {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

.mono {
  font-family: var(--font-mono);
  font-size: 12px;
}

.hidden {
  display: none !important;
}

/* ── Arsitektur Bidang Terbuka (Open-Plane Shell — DESIGN.md §4.1) ── */
#app-shell {
  display: flex;
  min-height: 100vh;
  width: 100%;
  background-color: var(--ground);
}

#app-sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background-color: var(--ground);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 50;
}

#app-main {
  flex: 1;
  min-width: 0;
  padding: 28px var(--pad) 48px var(--pad);
  max-width: 1440px;
}

#mobile-topbar {
  display: none;
  height: 48px;
  padding: 0 16px;
  background-color: var(--ground);
  border-bottom: 1px solid var(--border);
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 45;
}

#sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 18, 20, 0.32);
  z-index: 48;
}

/* ── Puncak Sidebar & Identitas Resmi Ditjen PSDKP ── */
.brand-box {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 0 4px 16px 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}

.brand-crest {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 1px;
}

.brand-crest-img {
  width: 32px;
  height: 37px;
  object-fit: contain;
  display: block;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.brand-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.brand-text h1 {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin: 0;
}

.brand-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: var(--radius-chip);
  background-color: var(--pill-neutral-bg);
  color: var(--muted);
  letter-spacing: 0.02em;
}

.brand-acronym-desc {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.35;
  margin: 0;
  font-weight: 400;
}

/* ── Navigasi Sidebar (Sentence Case, Tanpa Huruf Kapital Berjarak) ── */
.nav-group-title {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  padding: 14px 10px 6px 10px;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.nav-item,
button.nav-item,
#app-sidebar .nav-item {
  display: flex;
  align-items: center;
  justify-content: flex-start !important;
  text-align: left !important;
  gap: 10px;
  height: var(--ctl-h-md);
  padding: 0 10px;
  border-radius: var(--radius-control);
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  width: 100%;
  position: relative;
  transition: background-color var(--dur-ui) var(--ease-out), color var(--dur-ui) var(--ease-out), border-color var(--dur-ui) var(--ease-out), box-shadow var(--dur-ui) var(--ease-out);
}

.nav-item span {
  text-align: left !important;
}

.nav-item:hover:not(.active) {
  background-color: rgba(255, 255, 255, 0.75);
  color: var(--text);
  border-color: rgba(227, 229, 232, 0.8);
}

.nav-item.active,
#app-sidebar .nav-item.active {
  background-color: #FFFFFF !important;
  color: var(--text) !important;
  font-weight: 600 !important;
  border: 1px solid var(--border) !important;
  box-shadow: 0 1px 3px rgba(15, 18, 20, 0.08), 0 1px 2px rgba(15, 18, 20, 0.04) !important;
}

.nav-item.active::before,
#app-sidebar .nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 5px;
  width: 3.5px;
  background-color: var(--accent);
  border-radius: 0 2px 2px 0;
}

.nav-item svg {
  width: 16px;
  height: 16px;
  stroke-width: 1.5;
  stroke: currentColor;
  fill: none;
  flex-shrink: 0;
  transition: stroke var(--dur-ui) var(--ease-out);
}

.nav-item.active svg,
#app-sidebar .nav-item.active svg {
  stroke: var(--accent) !important;
  stroke-width: 2 !important;
}

.nav-badge {
  margin-left: auto;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: var(--radius-chip);
  background-color: var(--pill-negative-bg);
  color: var(--pill-negative-ink);
  font-weight: 500;
}

.nav-item.active .nav-badge {
  background-color: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 600;
}
  color: var(--pill-negative-ink);
  font-weight: 500;
}

/* ── Dasar Sidebar (Profil Staf & Keluar) ── */
.sidebar-footer {
  margin-top: auto;
  padding: 14px 8px 0 8px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-avatar,
.avatar-sm {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  background-color: var(--raised);
  color: var(--text);
  flex-shrink: 0;
}

.avatar-lg {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  background-color: var(--raised);
  color: var(--text);
  flex-shrink: 0;
}

.user-info {
  min-width: 0;
  flex: 1;
}

.user-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-role {
  font-size: 11px;
  color: var(--muted);
}

/* ── View Containers & Baris Judul Layar (DESIGN.md §5.1) ── */
.app-view,
.view-panel {
  display: flex;
  flex-direction: column;
  gap: 20px;
  animation: viewFadeIn 140ms var(--ease-out);
}

@keyframes viewFadeIn {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-header,
.screen-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}

.page-title-group,
.screen-title-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.page-title,
.screen-title-wrap h2,
.page-header h1 {
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.page-subtitle,
.screen-finding {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.45;
  max-width: 72ch;
}

.page-actions,
.screen-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  flex-wrap: wrap;
}

/* ── Sistem Geometri Kontrol 3-Tier Tunggal (LG: 40px, MD: 32px, SM: 26px) ── */
button,
.btn {
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 500;
  border: 1px solid transparent;
  border-radius: var(--radius-control);
  cursor: pointer;
  background: transparent;
  color: var(--text);
  white-space: nowrap;
  text-decoration: none;
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-ui) var(--ease-out), border-color var(--dur-ui) var(--ease-out);
}

button:active,
.btn:active {
  transform: scale(0.98);
}

button:focus-visible,
.btn:focus-visible,
.nav-item:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent) !important;
  outline-offset: 2px !important;
}

button:disabled,
.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

button svg,
.btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  stroke-width: 1.6;
  fill: none;
  flex-shrink: 0;
}

/* Tier LG: 40px */
.ctl-lg button,
.ctl-lg input,
.ctl-lg select,
.btn-lg,
.btn-control-lg,
.btn-primary-lg,
.btn-secondary-lg,
.btn-danger-lg,
.input-lg,
.select-lg,
.form-control-lg,
.input-control-lg {
  height: var(--ctl-h-lg);
  padding: 0 var(--ctl-px-lg);
  font-size: var(--ctl-fs-lg);
  border-radius: var(--radius-control);
}

/* Tier MD: 32px */
.ctl-md button,
.ctl-md input,
.ctl-md select,
.btn-md,
.btn-control-md,
.btn-primary-md,
.btn-secondary-md,
.btn-danger-md,
.input-md,
.select-md,
.form-control-md,
.input-control-md {
  height: var(--ctl-h-md);
  padding: 0 var(--ctl-px-md);
  font-size: var(--ctl-fs-md);
  border-radius: var(--radius-control);
}

/* Tier SM: 26px */
.ctl-sm button,
.ctl-sm input,
.ctl-sm select,
.btn-sm,
.btn-control-sm,
.btn-primary-sm,
.btn-secondary-sm,
.btn-danger-sm,
.input-sm,
.select-sm,
.form-control-sm,
.input-control-sm {
  height: var(--ctl-h-sm);
  padding: 0 var(--ctl-px-sm);
  font-size: var(--ctl-fs-sm);
  border-radius: var(--radius-control);
}

/* Varian Warna Tombol */
.btn-primary,
.btn-primary-lg,
.btn-primary-md,
.btn-primary-sm {
  background-color: var(--primary);
  color: #FFFFFF;
  border-color: var(--primary);
}

.btn-primary:hover,
.btn-primary-lg:hover,
.btn-primary-md:hover,
.btn-primary-sm:hover {
  background-color: var(--primary-hover);
  border-color: var(--primary-hover);
}

.btn-secondary,
.btn-secondary-lg,
.btn-secondary-md,
.btn-secondary-sm {
  background-color: var(--surface);
  color: var(--text);
  border-color: var(--control);
}

.btn-secondary:hover,
.btn-secondary-lg:hover,
.btn-secondary-md:hover,
.btn-secondary-sm:hover {
  background-color: var(--raised);
}

.btn-danger,
.btn-danger-lg,
.btn-danger-md,
.btn-danger-sm {
  background-color: var(--surface);
  color: var(--negative);
  border-color: var(--control);
}

.btn-danger:hover,
.btn-danger-lg:hover,
.btn-danger-md:hover,
.btn-danger-sm:hover {
  background-color: var(--pill-negative-bg);
  border-color: var(--negative);
}

.btn-danger-solid {
  background-color: var(--negative);
  color: #FFFFFF;
  border-color: var(--negative);
}

.ctl-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ctl-fill {
  width: 100%;
}

/* ── Input, Select, Textarea & Form Group ── */
input[type="text"],
input[type="password"],
input[type="email"],
input[type="number"],
input[type="date"],
input[type="search"],
select,
textarea {
  font-family: inherit;
  background-color: var(--surface);
  color: var(--text);
  border: 1px solid var(--control);
  border-radius: var(--radius-control);
  outline: none;
  transition: border-color var(--dur-ui) var(--ease-out), box-shadow var(--dur-ui) var(--ease-out);
}

textarea.form-control-md,
textarea.form-control-lg,
textarea {
  height: auto;
  min-height: 76px;
  padding: 8px 12px;
  font-size: 13px;
  line-height: 1.45;
  width: 100%;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--focus);
  box-shadow: 0 0 0 2px rgba(15, 18, 20, 0.08);
}

input::placeholder,
textarea::placeholder {
  color: var(--faint);
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.form-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-secondary);
}

.form-hint {
  font-size: 11px;
  color: var(--muted);
}

.form-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.form-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

/* ── Strip KPI Satu Kontainer (DESIGN.md §5.3) ── */
.kpi-container {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  overflow: hidden;
}

.kpi-col {
  padding: 18px 20px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 4px;
  min-height: 94px;
  min-width: 0;
}

.kpi-col:last-child {
  border-right: none;
}

.kpi-label {
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  margin-bottom: 8px;
}

.kpi-value {
  font-size: 24px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.15;
  letter-spacing: -0.02em;
}

.kpi-value-lead {
  font-size: 30px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.1;
  letter-spacing: -0.025em;
}

.kpi-delta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.delta-up { color: var(--positive); font-weight: 500; }
.delta-down { color: var(--negative); font-weight: 500; }
.delta-warn { color: var(--warning); font-weight: 500; }

/* ── Kartu Permukaan Datar & Tata Letak Grid (DESIGN.md §4.3 & §5.4) ── */
.card {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--card-pad);
}

.card-flush {
  padding: 0;
  overflow: hidden;
}

.card-header,
.card-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.card-flush > .card-header,
.card-flush > .card-hd {
  padding: 16px 20px;
  margin-bottom: 0;
  border-bottom: 1px solid var(--border);
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}

.card-subtitle {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.grid-2col {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--gap);
}

.grid-2fr-1fr {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: var(--gap);
}

/* ── Bilah Tab Garis Bawah & Bilah Saring (DESIGN.md §5.2) ── */
.tab-strip {
  display: flex;
  align-items: center;
  gap: 20px;
  border-bottom: 1px solid var(--border);
  padding: 0 4px;
}

.tab-btn,
.tab-item {
  height: 36px;
  padding: 0 4px;
  font-size: 13px;
  font-weight: 400;
  color: var(--muted);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
}

.tab-btn:hover,
.tab-item:hover {
  color: var(--text);
}

.tab-btn.active,
.tab-item.active {
  color: var(--text);
  font-weight: 600;
  border-bottom-color: var(--accent);
}

.filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 12px 16px;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1;
}

/* ── Bilah Proporsi Horizontal (Proportional Track Bars — DESIGN.md §7.2 & §8.0) ── */
.track-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.track-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.track-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
}

.track-label {
  color: var(--text);
  font-weight: 500;
}

.track-numbers {
  font-size: 12px;
  color: var(--muted);
}

.track-numbers strong {
  color: var(--text);
  font-weight: 600;
}

.track-bar {
  width: 100%;
  height: 8px;
  background-color: var(--raised);
  border-radius: var(--radius-chip);
  overflow: hidden;
  position: relative;
}

.track-fill {
  height: 100%;
  background-color: var(--accent);
