<style>
/**
 * html/Style.html — Sistem Desain Nakhoda (Achromatic Ledger)
 * Sesuai DESIGN.md, PRD.md, dan AGENTS.md:
 * - Palet Akromatik Hangat + Oranye Keselamatan Laut (#D9480F)
 * - Skala Geometri Kontrol 3-Tier Tunggal (LG: 40px, MD: 32px, SM: 26px)
 * - Kapitalisasi Kalimat (Tanpa text-transform: uppercase)
 * - Angka Tabular Wajib (tabular-nums)
 */

:root {
  /* ── 1. Token Permukaan & Tinta (Maritime Operational Ledger — Cool Slate Paper) ── */
  --ground:            #F2F4F7;
  --surface:           #FFFFFF;
  --raised:            #E9EDF2;
  --active:            #E1E6EC;
  --border:            rgba(15, 23, 32, 0.09);
  --rule:              rgba(15, 23, 32, 0.055);
  --control:           #C8D0D8;

  --text:              #0F1720;
  --ink-secondary:     #28323D;
  --muted:             #53606E;
  --faint:             #677482;

  --primary:           #0F1720;
  --primary-hover:     #222C38;

  /* ── 2. Warna Data Utama (Oranye Keselamatan Laut / International Safety Orange) ── */
  --accent:            #D9480F;
  --accent-ink:        #B53A06;
  --accent-soft:       #FFF0EB;
  --chart-2:           #7B838B;

  /* ── 3. Warna Semantik Perubahan & Status ── */
  --positive:          #247B50;
  --negative:          #C4242A;
  --warning:           #6B4B00;
  --focus:             #0F1214;

  /* Status Pills (Background & Ink) */
  --pill-positive-bg:  #DCFAE5;
  --pill-positive-ink: #04250E;
  --pill-negative-bg:  #FFEDEA;
  --pill-negative-ink: #831C1E;
  --pill-warning-bg:   #FFF6D6;
  --pill-warning-ink:  #6B4B00;
  --pill-neutral-bg:   #ECEEF0;
  --pill-neutral-ink:  #3D4348;

  /* ── 4. Skala Geometri Kontrol 3-Tier (Aturan Keras AGENTS.md) ── */
  --ctl-h-lg: 40px;
  --ctl-px-lg: 14px;
  --ctl-fs-lg: 14px;

  --ctl-h-md: 32px;
  --ctl-px-md: 12px;
  --ctl-fs-md: 13px;

  --ctl-h-sm: 26px;
  --ctl-px-sm: 10px;
  --ctl-fs-sm: 12px;

  /* ── 5. Radius, Jarak, & Tipografi ── */
  --radius-card:       8px;
  --radius-control:    6px;
  --radius-chip:       4px;
  --radius-pill:       9999px;

  --gap:               12px;
  --pad:               24px;
  --card-pad:          20px;
  --sidebar-w:         240px;

  --font-main:         'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono:         'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  --dur-press:         90ms;
  --dur-ui:            160ms;
  --dur-sheet:         220ms;
  --ease-out:          cubic-bezier(0.22, 1, 0.36, 1);
}

/* ── Reset Dasar ── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
  font-family: var(--font-main);
  background-color: var(--ground);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── Angka Tabular Wajib (DESIGN.md §3.3) ── */
.tnum,
.tabular-nums,
.mono,
table td,
table th,
.kpi-value,
.kpi-value-lead,
.kpi-delta,
.sijil-cell,
.nav-badge,
.badge-count,
input[type="number"] {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

.mono {
  font-family: var(--font-mono);
  font-size: 12px;
}

.hidden {
  display: none !important;
}

/* ── Arsitektur Bidang Terbuka (Open-Plane Shell — DESIGN.md §4.1) ── */
#app-shell {
  display: flex;
  min-height: 100vh;
  width: 100%;
  background-color: var(--ground);
}

#app-sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background-color: var(--ground);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 50;
}

#app-main {
  flex: 1;
  min-width: 0;
  padding: 24px var(--pad) 48px var(--pad);
  max-width: 1440px;
}

#mobile-topbar {
  display: none;
  height: 48px;
  padding: 0 16px;
  background-color: var(--ground);
  border-bottom: 1px solid var(--border);
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 45;
}

#sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 18, 20, 0.32);
  z-index: 48;
}

/* ── Puncak Sidebar & Identitas Resmi Ditjen PSDKP ── */
.brand-box {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 0 4px 16px 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}

.brand-crest {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 2px;
}

.brand-crest-img {
  width: 32px;
  height: 37px;
  object-fit: contain;
  display: block;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.brand-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-text h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin: 0;
}

.brand-badge {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: var(--radius-chip);
  border: 1px solid var(--border);
  background-color: transparent;
  color: var(--muted);
  letter-spacing: 0.01em;
  line-height: 1.3;
}

.brand-acronym-desc {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.35;
  margin: 0;
  font-weight: 400;
}

/* ── Navigasi Sidebar (Sentence Case, Skala 4px, Tanpa Strip Kiri) ── */
.nav-group-title {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  padding: 20px 8px 8px 8px;
  letter-spacing: 0;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nav-item,
button.nav-item,
#app-sidebar .nav-item {
  display: flex;
  align-items: center;
  justify-content: flex-start !important;
  text-align: left !important;
  gap: 8px;
  height: var(--ctl-h-md);
  padding: 0 8px;
  border-radius: var(--radius-chip);
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 400;
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  width: 100%;
  position: relative;
  transition: background-color var(--dur-ui) var(--ease-out), color var(--dur-ui) var(--ease-out), border-color var(--dur-ui) var(--ease-out);
}

.nav-item span {
  text-align: left !important;
}

.nav-item:hover:not(.active) {
  background-color: var(--surface);
  color: var(--text);
  border-color: var(--border);
}

.nav-item.active,
#app-sidebar .nav-item.active {
  background-color: var(--surface) !important;
  color: var(--text) !important;
  font-weight: 500 !important;
  border: 1px solid var(--border) !important;
}

.nav-item svg {
  width: 16px;
  height: 16px;
  stroke-width: 1.5;
  stroke: currentColor;
  fill: none;
  flex-shrink: 0;
  transition: stroke var(--dur-ui) var(--ease-out);
}

.nav-item.active svg,
#app-sidebar .nav-item.active svg {
  stroke: var(--text) !important;
  stroke-width: 1.5 !important;
}

.nav-badge {
  margin-left: auto;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: var(--radius-chip);
  background-color: var(--raised);
  color: var(--ink-secondary);
  font-weight: 500;
  border: none;
}

.nav-item.active .nav-badge {
  background-color: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 500;
}

/* ── Dasar Sidebar: Identitas Pengguna & Keluar Tanpa Kotak Bertumpuk ── */
.sidebar-footer {
  margin-top: auto;
  padding: 12px 0 0 0;
  border-top: 1px solid var(--border);
  width: 100%;
  box-sizing: border-box;
}

.sidebar-account-box {
  background-color: transparent;
  border: none;
  border-radius: var(--radius-chip);
  padding: 8px 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  box-sizing: border-box;
}

.sidebar-account-box .user-avatar {
  width: var(--ctl-h-sm);
  height: var(--ctl-h-sm);
  border-radius: var(--radius-chip);
  border: 1px solid var(--border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
  font-family: var(--font-mono);
  background-color: var(--surface);
  color: var(--text);
  flex-shrink: 0;
  box-sizing: border-box;
}

.sidebar-account-box .user-info {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sidebar-account-box .user-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
}

.sidebar-account-box .user-role {
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.sidebar-account-box .btn-icon-box,
.sidebar-account-box .btn-logout-box {
  width: var(--ctl-h-sm);
  height: var(--ctl-h-sm);
  min-width: var(--ctl-h-sm);
  border-radius: var(--radius-chip);
  border: 1px solid var(--border);
  background-color: var(--ground);
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
  flex-shrink: 0;
  box-sizing: border-box;
  transition: background-color var(--dur-ui) var(--ease-out),
              border-color var(--dur-ui) var(--ease-out),
              color var(--dur-ui) var(--ease-out),
              transform 90ms var(--ease-out);
}

.sidebar-account-box .btn-icon-box:hover {
  background-color: var(--surface);
  border-color: var(--control);
  color: var(--text);
}

.sidebar-account-box .btn-logout-box:hover {
  background-color: var(--pill-negative-bg);
  border-color: #FD886C;
  color: var(--negative);
}

.sidebar-account-box .btn-icon-box:active,
.sidebar-account-box .btn-logout-box:active {
  transform: scale(0.95);
}

.sidebar-account-box .btn-icon-box svg,
.sidebar-account-box .btn-logout-box svg {
  width: 14px;
  height: 14px;
  stroke-width: 1.6;
  stroke: currentColor;
  fill: none;
}

.user-avatar,
.avatar-sm,
.avatar {
  width: var(--ctl-h-sm);
  height: var(--ctl-h-sm);
  border-radius: var(--radius-chip);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-main);
  line-height: 1;
  background-color: var(--raised);
  color: var(--text);
  flex-shrink: 0;
}

.avatar-lg {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-chip);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  background-color: var(--raised);
  color: var(--text);
  flex-shrink: 0;
}

.user-info {
  min-width: 0;
  flex: 1;
}

.user-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-role {
  font-size: 11px;
  color: var(--muted);
}

/* ── View Containers & Baris Judul Layar (DESIGN.md §5.1) ── */
.app-view,
.view-panel {
  display: flex;
  flex-direction: column;
  gap: 24px;
  animation: viewFadeIn 160ms var(--ease-out);
}

@keyframes viewFadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-header,
.screen-header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  min-height: 56px;
  padding: 0 0 16px 0;
  margin-bottom: 0;
  border-bottom: 1px solid var(--border);
}

.page-title-group,
.screen-title-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.page-title,
.screen-title-wrap h2,
.page-header h1 {
  font-size: 24px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1.2;
  margin: 0;
}

.page-subtitle,
.screen-finding {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.45;
  max-width: 72ch;
}

.page-sync-time {
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  margin-right: 4px;
  white-space: nowrap;
}

.page-actions,
.screen-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 1;
  min-width: 0;
  max-width: 100%;
  flex-wrap: wrap;
}

/* ── Sistem Geometri Kontrol 3-Tier Tunggal (LG: 40px, MD: 32px, SM: 26px) ── */
button,
.btn {
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 500;
  border: 1px solid transparent;
  border-radius: var(--radius-control);
  cursor: pointer;
  background: transparent;
  color: var(--text);
  white-space: nowrap;
  text-decoration: none;
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-ui) var(--ease-out), border-color var(--dur-ui) var(--ease-out);
}

button:active,
.btn:active {
  transform: scale(0.98);
}

button:focus-visible,
.btn:focus-visible,
.nav-item:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent) !important;
  outline-offset: 2px !important;
}

button:disabled,
.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

button svg,
.btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  stroke-width: 1.6;
  fill: none;
  flex-shrink: 0;
}

/* Tier LG: 40px */
.ctl-lg button,
.ctl-lg input,
.ctl-lg select,
.btn-lg,
.btn-control-lg,
.btn-primary-lg,
.btn-secondary-lg,
.btn-danger-lg,
.btn-negative-lg,
.input-lg,
.select-lg,
.form-control-lg,
.input-control-lg {
  height: var(--ctl-h-lg);
  padding: 0 var(--ctl-px-lg);
  font-size: var(--ctl-fs-lg);
  border-radius: var(--radius-control);
}

/* Tier MD: 32px */
.ctl-md button,
.ctl-md input,
.ctl-md select,
.btn-md,
.btn-control-md,
.btn-primary-md,
.btn-secondary-md,
.btn-danger-md,
.btn-negative-md,
.input-md,
.select-md,
.form-control-md,
.input-control-md {
  height: var(--ctl-h-md);
  padding: 0 var(--ctl-px-md);
  font-size: var(--ctl-fs-md);
  border-radius: var(--radius-control);
}

/* Tier SM: 26px */
.ctl-sm button,
.ctl-sm input,
.ctl-sm select,
.btn-sm,
.btn-control-sm,
.btn-primary-sm,
.btn-secondary-sm,
.btn-danger-sm,
.btn-negative-sm,
.input-sm,
.select-sm,
.form-control-sm,
.input-control-sm {
  height: var(--ctl-h-sm);
  padding: 0 var(--ctl-px-sm);
  font-size: var(--ctl-fs-sm);
  border-radius: var(--radius-control);
}

/* Varian Warna Tombol */
.btn-primary,
.btn-primary-lg,
.btn-primary-md,
.btn-primary-sm {
  background-color: var(--primary);
  color: #FFFFFF;
  border-color: var(--primary);
}

.btn-primary:hover,
.btn-primary-lg:hover,
.btn-primary-md:hover,
.btn-primary-sm:hover {
  background-color: var(--primary-hover);
  border-color: var(--primary-hover);
}

.btn-secondary,
.btn-secondary-lg,
.btn-secondary-md,
.btn-secondary-sm {
  background-color: var(--surface);
  color: var(--text);
  border-color: var(--control);
}

.btn-secondary:hover,
.btn-secondary-lg:hover,
.btn-secondary-md:hover,
.btn-secondary-sm:hover {
  background-color: var(--raised);
}

.btn-danger,
.btn-danger-lg,
.btn-danger-md,
.btn-danger-sm,
.btn-negative,
.btn-negative-lg,
.btn-negative-md,
.btn-negative-sm {
  background-color: var(--surface);
  color: var(--negative);
  border-color: var(--control);
}

.btn-danger:hover,
.btn-danger-lg:hover,
.btn-danger-md:hover,
.btn-danger-sm:hover,
.btn-negative:hover,
.btn-negative-lg:hover,
.btn-negative-md:hover,
.btn-negative-sm:hover {
  background-color: var(--pill-negative-bg);
  border-color: var(--negative);
}

.btn-danger-solid {
  background-color: var(--negative);
  color: #FFFFFF;
  border-color: var(--negative);
}

.btn-tertiary {
  background-color: transparent;
  color: var(--muted);
  border-color: transparent;
}

.btn-tertiary:hover {
  background-color: var(--raised);
  color: var(--text);
}

.ctl-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ctl-fill {
  width: 100%;
}

/* ── Input, Select, Textarea & Form Group ── */
input[type="text"],
input[type="password"],
input[type="email"],
input[type="number"],
input[type="date"],
input[type="search"],
select,
textarea {
  font-family: inherit;
  background-color: var(--surface);
  color: var(--text);
  border: 1px solid var(--control);
  border-radius: var(--radius-control);
  outline: none;
  transition: border-color var(--dur-ui) var(--ease-out), box-shadow var(--dur-ui) var(--ease-out);
}

textarea.form-control-md,
textarea.form-control-lg,
textarea {
  height: auto;
  min-height: 76px;
  padding: 8px 12px;
  font-size: 13px;
  line-height: 1.45;
  width: 100%;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--focus);
  box-shadow: 0 0 0 2px rgba(15, 18, 20, 0.08);
}

input::placeholder,
textarea::placeholder {
  color: var(--faint);
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.form-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-secondary);
}

.form-hint {
  font-size: 11px;
  color: var(--muted);
}

.form-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.form-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

/* ── Strip KPI Asimetris (Lead Metric + Supporting Readouts) ── */
.kpi-container {
  display: grid;
  grid-template-columns: minmax(220px, 1.35fr) repeat(3, minmax(0, 1fr));
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  overflow: hidden;
}

.kpi-col {
  padding: 20px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 4px;
  min-height: 96px;
  min-width: 0;
}

.kpi-col:first-child {
  background-color: rgba(15, 23, 32, 0.014);
  box-shadow: inset 3px 0 0 var(--accent);
}

.kpi-col:last-child {
  border-right: none;
}

.kpi-label {
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  margin-bottom: 8px;
}

.kpi-value {
  font-size: 24px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.15;
  letter-spacing: -0.02em;
}

.kpi-value-lead {
  font-size: 30px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.1;
  letter-spacing: -0.025em;
}

.kpi-delta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.delta-up { color: var(--positive); font-weight: 500; }
.delta-down { color: var(--negative); font-weight: 500; }
.delta-warn { color: var(--warning); font-weight: 500; }

/* ── Kartu Permukaan Datar & Tata Letak Grid (DESIGN.md §4.3 & §5.4) ── */
.card {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--card-pad);
  min-width: 0;
  max-width: 100%;
}

.card-flush {
  padding: 0;
  overflow: hidden;
}

.card-header,
.card-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 12px;
  margin-bottom: 16px;
}

.card-flush > .card-header,
.card-flush > .card-hd {
  padding: 16px 20px;
  margin-bottom: 0;
  border-bottom: 1px solid var(--border);
}

.card-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -0.01em;
  min-width: 0;
}

.card-subtitle {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.grid-2col {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--gap);
}

.grid-2fr-1fr {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: var(--gap);
}

.grid-2col > *,
.grid-2fr-1fr > * {
  min-width: 0;
}

/* ── Bilah Tab Garis Bawah & Bilah Saring (DESIGN.md §5.2) ── */
.tab-strip {
  display: flex;
  align-items: center;
  gap: 20px;
  border-bottom: 1px solid var(--border);
  padding: 0 4px;
  overflow-x: auto;
}

.tab-btn,
.tab-item {
  height: var(--ctl-h-md);
  padding: 0 4px;
  font-size: 13px;
  font-weight: 400;
  color: var(--muted);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
}

.tab-btn:hover,
.tab-item:hover {
  color: var(--text);
}

.tab-btn.active,
.tab-item.active {
  color: var(--text);
  font-weight: 600;
  border-bottom-color: var(--accent);
}

.filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 12px 16px;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1;
}

/* ── Bilah Proporsi Horizontal (Proportional Track Bars — DESIGN.md §7.2 & §8.0) ── */
.track-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.track-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.track-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
}

.track-label {
  color: var(--text);
  font-weight: 500;
}

.track-numbers {
  font-size: 12px;
  color: var(--muted);
}

.track-numbers strong {
  color: var(--text);
  font-weight: 600;
}

.track-bar {
  width: 100%;
  height: 6px;
  background-color: var(--raised);
  border-radius: var(--radius-chip);
  overflow: hidden;
  position: relative;
}

.track-fill {
  height: 100%;
  background-color: var(--accent);
  border-radius: var(--radius-chip);
  transition: width 220ms var(--ease-out);
}

/* ── Tabel Data Tanpa Zebra (DESIGN.md §5.5) ── */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  background-color: var(--surface);
}

.card-flush .table-wrap {
  border: none;
  border-radius: 0;
}

table,
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}

thead th,
.table thead th {
  height: 36px;
  padding: 0 14px;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  background-color: var(--surface);
  white-space: nowrap;
}

tbody tr,
.table tbody tr {
  height: 44px;
  border-bottom: 1px solid var(--rule);
  transition: background-color var(--dur-ui) var(--ease-out);
}

tbody tr:last-child,
.table tbody tr:last-child {
  border-bottom: none;
}

tbody tr:hover,
.table tbody tr:hover {
  background-color: var(--raised);
}

tbody tr.clickable,
.table tbody tr.clickable {
  cursor: pointer;
}

tbody tr.clickable:focus-visible,
.table tbody tr.clickable:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  background-color: var(--raised);
}

tbody tr.selected,
.table tbody tr.selected {
  background-color: var(--active);
}

td,
.table td {
  padding: 8px 14px;
  color: var(--text);
  vertical-align: middle;
}

.text-right,
td.text-right,
th.text-right {
  text-align: right;
}

.text-center,
td.text-center,
th.text-center {
  text-align: center;
}

.cell-primary {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}

.cell-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

/* ── Elemen Tanda Tangan: Matriks 2D Papan Sijil (DESIGN.md §2.3 & §8.1) ── */
.sijil-matrix th,
.sijil-matrix td {
  padding: 6px 8px;
}

.sijil-group-row td {
  background-color: var(--ground);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-secondary);
  height: 32px;
  padding: 0 14px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.sijil-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 36px;
  height: 28px;
  padding: 0 6px;
  border-radius: var(--radius-chip);
  font-size: 12px;
  border: 1px solid var(--rule);
}

.sijil-cell-ok {
  background-color: var(--surface);
  color: var(--ink-secondary);
  font-weight: 400;
}

.sijil-cell-plus {
  background-color: var(--pill-positive-bg);
  color: var(--pill-positive-ink);
  border-color: transparent;
  font-weight: 500;
}

.sijil-cell-warn {
  background-color: var(--pill-negative-bg);
  color: var(--negative);
  border-color: transparent;
  font-weight: 500;
}

.sijil-cell-crit {
  background-color: var(--negative);
  color: #FFFFFF;
  border-color: var(--negative);
  font-weight: 600;
}

.sijil-cell-na {
  background-color: transparent;
  color: var(--control);
  border-color: transparent;
}

/* ── Tag Status Ledger (Tanpa Pill Bulat & Tanpa Dot) ── */
.pill,
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 7px;
  border-radius: var(--radius-chip);
  border: 1px solid transparent;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  flex-shrink: 0;
}

.pill-dot {
  display: none;
}

.status-plain {
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
}

.pill-positive,
.badge-positive,
.badge-success {
  background-color: rgba(36, 123, 80, 0.08);
  border-color: rgba(36, 123, 80, 0.20);
  color: #15633E;
}

.pill-negative,
.badge-negative,
.badge-danger {
  background-color: rgba(196, 36, 42, 0.08);
  border-color: rgba(196, 36, 42, 0.22);
  color: #9E1C20;
}

.pill-warning,
.badge-warning {
  background-color: rgba(180, 120, 0, 0.09);
  border-color: rgba(180, 120, 0, 0.22);
  color: #7A5100;
}

.pill-neutral,
.badge-neutral,
.badge-muted {
  background-color: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-chip);
  color: var(--muted);
}

.badge-accent {
  background-color: var(--accent-soft);
  color: var(--accent-ink);
}

/* ── Dialog Modal Datar (DESIGN.md §6.4) ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(15, 18, 20, 0.36);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}

.modal-overlay.active {
  display: flex;
}

.modal-box,
.modal-dialog {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalEnter 160ms var(--ease-out);
}

.modal-box-lg {
  max-width: 680px;
}

@keyframes modalEnter {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}

.modal-header,
.modal-hd {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

.modal-close {
  width: var(--ctl-h-sm);
  height: var(--ctl-h-sm);
  padding: 0;
  border-radius: var(--radius-control);
  color: var(--muted);
  background: transparent;
  border: none;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}

.modal-close:hover {
  background-color: var(--raised);
  color: var(--text);
}

.modal-box > form,
.modal-dialog > form {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.modal-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.modal-header,
.modal-footer,
.modal-actions {
  flex-shrink: 0;
}

.modal-footer,
.modal-actions {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background-color: var(--ground);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

/* ── Lembar Samping (Slide-Over Sheet 480px — DESIGN.md §6.3) ── */
.sheet-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(15, 18, 20, 0.28);
  display: none;
  z-index: 950;
}

.sheet-overlay.active {
  display: block;
}

.sheet-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 480px;
  max-width: 100vw;
  height: 100vh;
  background-color: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 960;
  display: flex;
  flex-direction: column;
  animation: sheetSlideIn var(--dur-sheet) var(--ease-out);
}

@keyframes sheetSlideIn {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}

.sheet-header,
.sheet-hd {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.sheet-footer,
.sheet-ft {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background-color: var(--ground);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

/* ── Area Unggah Multi-Evidence (DESIGN.md §5.8) ── */
.dropzone-box {
  border: 1px dashed var(--control);
  border-radius: var(--radius-control);
  background-color: var(--ground);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color var(--dur-ui) var(--ease-out), background-color var(--dur-ui) var(--ease-out);
}

.dropzone-box:hover {
  border-color: var(--accent);
  background-color: var(--accent-soft);
}

/* ── Searchable Combobox & Dropzone Surat Tugas Sijil (DESIGN.md §3.3 & §8.1) ── */
.combobox-wrap {
  position: relative;
  width: 100%;
  box-sizing: border-box;
}

.combobox-wrap input {
  width: 100%;
  box-sizing: border-box;
  display: block;
}

.combobox-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  max-height: 290px;
  overflow-y: auto;
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-chip);
  box-shadow: 0 4px 16px rgba(15, 18, 20, 0.12);
  z-index: 100;
}

.combobox-item-sticky {
  position: sticky;
  bottom: 0;
  background-color: var(--ground);
  border-top: 1px solid var(--border);
  box-shadow: 0 -2px 8px rgba(15, 18, 20, 0.05);
  z-index: 2;
}

.combobox-item {
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  cursor: pointer;
  border-bottom: 1px solid var(--rule);
  transition: background-color var(--dur-ui) var(--ease-out);
}

.combobox-item:last-child {
  border-bottom: none;
}

.combobox-item:hover,
.combobox-item.active {
  background-color: var(--raised);
}

.selected-crew-box {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-chip);
  background-color: var(--ground);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.upload-dropzone {
  border: 1px dashed var(--control);
  border-radius: var(--radius-chip);
  background-color: var(--ground);
  padding: 12px 14px;
  text-align: center;
  cursor: pointer;
  transition: border-color var(--dur-ui) var(--ease-out), background-color var(--dur-ui) var(--ease-out);
}

.upload-dropzone:hover {
  border-color: var(--accent);
  background-color: #FFFFFF;
}

.dropzone-prompt {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.dropzone-selected {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.file-icon-badge {
  padding: 2px 6px;
  border-radius: 2px;
  background-color: var(--raised);
  border: 1px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--accent-ink);
}

.sijil-crew-card {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-chip);
  background-color: var(--surface);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.sijil-crew-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.sijil-crew-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* ── Garis Waktu Horizontal Kegiatan (DESIGN.md §8.2) ── */
.timeline-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.timeline-item {
  display: grid;
  grid-template-columns: 240px 1fr 110px;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-control);
  background-color: var(--surface);
}

.timeline-track {
  height: 10px;
  background-color: var(--raised);
  border-radius: var(--radius-chip);
  position: relative;
  overflow: hidden;
}

.timeline-bar {
  position: absolute;
  top: 0;
  bottom: 0;
  background-color: var(--accent);
  border-radius: var(--radius-chip);
  min-width: 8%;
}

/* ── Lembar Pratinjau Cetak A4 (DESIGN.md §8.3) ── */
.print-paper {
  background-color: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  max-width: 860px;
  margin: 0 auto;
  padding: 40px 48px;
  color: #0F1214;
}

/* ── Toaster Notification ── */
#toaster {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-control);
  padding: 12px 16px;
  font-size: 13px;
  color: var(--text);
  box-shadow: 0 1px 2px rgba(15, 18, 20, 0.05);
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 260px;
  max-width: 400px;
}

.toast-icon {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  flex-shrink: 0;
}

.toast-msg {
  flex: 1;
  line-height: 1.4;
}

.toast-success, .toast-positive { border-color: var(--positive); }
.toast-error, .toast-negative   { border-color: var(--negative); }
.toast-warning                  { border-color: var(--warning); }
.toast-info                     { border-color: var(--control); }

/* ── Responsif Mobile (<= 768px — DESIGN.md §4.4) ── */
@media (max-width: 960px) {
  .kpi-container {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .kpi-col:nth-child(2) {
    border-right: none;
  }
  .kpi-col:nth-child(1),
  .kpi-col:nth-child(2) {
    border-bottom: 1px solid var(--border);
  }
  .grid-2col,
  .grid-2fr-1fr {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 768px) {
  #app-shell {
    flex-direction: column;
  }
  #mobile-topbar {
    display: flex;
  }
  #app-sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
    transition: transform var(--dur-sheet) var(--ease-out);
  }
  #app-sidebar.mobile-open {
    transform: translateX(0);
  }
  #sidebar-backdrop.mobile-open {
    display: block;
  }
  #app-main {
    padding: 16px 16px 40px 16px;
  }
  .page-header,
  .screen-header {
    min-height: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 0 0 14px 0;
  }
  .page-title,
  .screen-title-wrap h2,
  .page-header h1 {
    font-size: 20px;
  }
  .form-grid-2,
  .form-grid-3 {
    grid-template-columns: 1fr;
  }
  .timeline-item {
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .lap-kpi-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  }
  #lembar-cetak-dinas {
    padding: 20px 14px !important;
  }
  .onboard-steps {
    grid-template-columns: 1fr !important;
  }
  .card-header > div {
    flex-wrap: wrap;
    min-width: 0;
  }
  /* Sticky nama kapal di Papan Sijil 2D saat scroll horizontal di layar sempit */
  .sijil-matrix th:first-child,
  .sijil-matrix td:first-child {
    position: sticky;
    left: 0;
    z-index: 2;
    background-color: var(--surface);
    border-right: 1px solid var(--border);
    min-width: 150px !important;
  }
  /* Daftar tabel standar beralih ke kartu dua-baris pada ponsel (DESIGN.md §12) */
  .table-mobile-cards thead {
    display: none;
  }
  .table-mobile-cards,
  .table-mobile-cards tbody,
  .table-mobile-cards tr,
  .table-mobile-cards td {
    display: block;
    width: 100%;
  }
  .table-mobile-cards tbody tr {
    height: auto;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .table-mobile-cards td.td-mobile-check {
    position: absolute;
    top: 12px;
    right: 14px;
    width: auto !important;
    padding: 0;
  }
  .table-mobile-cards td {
    padding: 4px 0;
    border: none;
    text-align: left !important;
    white-space: normal !important;
  }
  .table-mobile-cards td[data-label]::before {
    content: attr(data-label) ": ";
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
}

.skeleton-bar {
  height: 12px;
  border-radius: var(--radius-chip);
  background-color: var(--raised);
  display: inline-block;
}

.modal-box-sm {
  max-width: 440px;
}

.modal-box-md {
  max-width: 480px;
}

.modal-box-wide {
  max-width: 640px;
}

.timeline-bar-done {
  background-color: var(--chart-2);
}

.timeline-bar-active {
  background-color: var(--accent-soft);
  border-left: 3px solid var(--accent);
}

.timeline-bar-upcoming {
  background-color: transparent;
  border: 1px dashed var(--control);
}

/* ── Spotlight Interactive Onboarding Tour (Ledger Taste) ── */
.tour-layer {
  position: fixed;
  inset: 0;
  z-index: 9000;
}
