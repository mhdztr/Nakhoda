<script>
/**
 * html/Script_Ringkasan.html
 * Controller Dasbor Ringkasan Eksekutif Nakhoda (Achromatic Ledger).
 */
var RingkasanView = (function () {
  'use strict';

  var _data = null;
  var _eventsBound = false;

  var KATEGORI_LABELS = {
    'PNS': 'Pegawai negeri sipil (PNS)',
    'P3K': 'PPPK (P3K)',
    'P3K_PARUH_WAKTU': 'PPPK paruh waktu',
    'PJLP': 'PJLP / pegawai non-ASN'
  };

  function dismissOnboard() {
    if (typeof NakhodaTour !== 'undefined') NakhodaTour.stop(true);
  }

  function openOnboard() {
    if (typeof NakhodaTour !== 'undefined') NakhodaTour.start(0);
  }

  function init() {
    _bindEvents();
    loadData();
  }

  function _bindEvents() {
    if (_eventsBound) return;
    _eventsBound = true;

    var btnRefresh = document.getElementById('btn-ringkasan-refresh');
    if (btnRefresh) {
      btnRefresh.onclick = function () {
        loadData();
      };
    }

    var btnLap = document.getElementById('btn-ringkasan-ke-laporan');
    if (btnLap) {
      btnLap.onclick = function () {
        Router.navigate('laporan');
      };
    }

    var btnOnbDismiss = document.getElementById('btn-ringkasan-onboard-dismiss');
    if (btnOnbDismiss) {
      btnOnbDismiss.onclick = dismissOnboard;
    }
    var btnOnbOpen = document.getElementById('btn-ringkasan-onboard-open');
    if (btnOnbOpen) {
      btnOnbOpen.onclick = openOnboard;
    }
  }

  function openKapalSijil(kapalId) {
    Router.navigate('sijil', { openKapalId: kapalId || '' });
  }

  function loadData() {
    var token = AuthApp.getToken();
    if (!token) return;

    var btnRefresh = document.getElementById('btn-ringkasan-refresh');
    if (btnRefresh) {
      btnRefresh.disabled = true;
      btnRefresh.classList.add('loading');
    }

    var tbSijilSkel = document.getElementById('tbody-ringkasan-sijil');
    var tbSertSkel = document.getElementById('tbody-ringkasan-sertifikat');
    var tbJabSkel = document.getElementById('tbody-ringkasan-jabatan');
    if (tbSijilSkel && !_data) tbSijilSkel.innerHTML = ShellUI.skeletonRows(6, 4);
    if (tbSertSkel && !_data) tbSertSkel.innerHTML = ShellUI.skeletonRows(4, 3);
    if (tbJabSkel && !_data) tbJabSkel.innerHTML = ShellUI.skeletonRows(5, 4);

    rpc('ringkasan_get', token, {})
      .then(function (data) {
        if (btnRefresh) {
          btnRefresh.disabled = false;
          btnRefresh.classList.remove('loading');
        }
        if (!data) {
          Toast.error('Data ringkasan tidak ditemukan.');
          return;
        }
        _data = data;
        _render();
      })
      .catch(function (err) {
        if (btnRefresh) {
          btnRefresh.disabled = false;
          btnRefresh.classList.remove('loading');
        }
        var msg = (err && err.message) ? err.message : 'Gagal memuat ringkasan eksekutif.';
        Toast.error(msg);
        if (!_data) {
          var retryHtml = '<tr><td colspan="6"><div class="empty-state-box"><div class="empty-state-title">Gagal memuat data ringkasan</div><div class="empty-state-desc">' + Format.escape(msg) + '</div><button type="button" class="btn btn-secondary-sm" onclick="RingkasanView.loadData()">Coba lagi</button></div></td></tr>';
          var tbs = document.getElementById('tbody-ringkasan-sijil');
          if (tbs) tbs.innerHTML = retryHtml;
        }
      });
  }

  function _render() {
    if (!_data) return;

    // 1. Kalimat Temuan Berbasis Data Langsung di Subtitle (DESIGN.md §1.2 & §5.1)
    var findingEl = document.getElementById('ringkasan-finding-sub');
    if (findingEl) {
      findingEl.textContent = _data.findingSubtitle || 'Data situasi pengawakan terpantau normal dan sesuai formasi.';
    }

    // 2. Strip KPI Satu Kontainer (DESIGN.md §5.3)
    var kpiTotalAkn = document.getElementById('kpi-total-akn');
    var kpiDeltaAkn = document.getElementById('kpi-delta-akn');
    if (kpiTotalAkn) kpiTotalAkn.textContent = Format.number(_data.kpi.totalAknKeseluruhan);
    if (kpiDeltaAkn) {
      var dVal = _data.kpi.deltaAkn || 0;
      var pPoa = _data.kpi.totalAknPoa || 0;
      var pKes = _data.kpi.totalAknKeseluruhan || 1;
      var pctPoa = ((pPoa / pKes) * 100).toFixed(1);
      kpiDeltaAkn.innerHTML =
        Format.deltaText(dVal, 'vs minggu lalu') +
        ' <span style="color:var(--muted);">· ' + Format.number(pPoa) + ' Dit. POA (' + pctPoa + '%)</span>';
    }

    var kpiAwakLengkap = document.getElementById('kpi-awak-lengkap');
    var kpiSubKompetensi = document.getElementById('kpi-sub-kompetensi');
    var nLengkapVal = _data.kpi.awakKompetensiLengkap !== undefined ? _data.kpi.awakKompetensiLengkap : (_data.kpi.awakLengkap || 0);
    var nTotalVal = _data.kpi.totalAwak || _data.kpi.totalAknKeseluruhan || 0;
    if (kpiAwakLengkap) {
      kpiAwakLengkap.textContent = Format.number(nLengkapVal) + ' / ' + Format.number(nTotalVal);
    }
    if (kpiSubKompetensi) {
      var pctK = _data.kpi.pctAwakLengkap !== undefined
        ? _data.kpi.pctAwakLengkap
        : (nTotalVal > 0 ? ((nLengkapVal / nTotalVal) * 100).toFixed(1) : '0.0');
      kpiSubKompetensi.innerHTML =
        '<span style="font-weight:600; color:var(--text);">' + pctK + '%</span>' +
        ' <span style="color:var(--muted);">memenuhi standar wajib STCW-F</span>';
    }

    var kpiSertifikatUrgent = document.getElementById('kpi-sertifikat-urgent');
    var kpiSubSertifikat = document.getElementById('kpi-sub-sertifikat');
    var nUrg = _data.kpi.sertifikatUrgentTotal !== undefined ? _data.kpi.sertifikatUrgentTotal : (_data.kpi.sertifikatUrgent || 0);
    var nExp = _data.kpi.sertifikatExpired !== undefined ? _data.kpi.sertifikatExpired : _data.kpi.expired;
    var nSeg = _data.kpi.sertifikatSegeraHabis !== undefined ? _data.kpi.sertifikatSegeraHabis : _data.kpi.segeraHabis;

    if ((nExp === undefined || nSeg === undefined) && Array.isArray(_data.antreanSertifikatUrgent)) {
      var expCalc = 0;
      var segCalc = 0;
      _data.antreanSertifikatUrgent.forEach(function (item) {
        var st = String(item.status || item.statusBerlaku || '').toUpperCase();
        if (st === 'KEDALUWARSA' || Number(item.sisaHari) < 0) expCalc++;
        else segCalc++;
      });
      if (nExp === undefined) nExp = expCalc;
      if (nSeg === undefined) nSeg = segCalc;
    }
    nExp = nExp || 0;
    nSeg = nSeg || 0;
    if (nUrg < nExp + nSeg) nUrg = nExp + nSeg;

    if (kpiSertifikatUrgent) {
      kpiSertifikatUrgent.textContent = Format.number(nUrg);
    }
    if (kpiSubSertifikat) {
      kpiSubSertifikat.innerHTML =
        '<span style="color:var(--negative); font-weight:500;">' + nExp + ' kedaluwarsa</span>' +
        ' <span style="color:var(--muted);">· ' + nSeg + ' &le; 90 hari</span>';
    }

    var kpiKapalLaik = document.getElementById('kpi-kapal-laik');
    var kpiSubKapal = document.getElementById('kpi-sub-kapal');
    if (kpiKapalLaik && _data.sijilSummary) {
      kpiKapalLaik.textContent = (_data.sijilSummary.laikOperasi || 0) + ' / ' + (_data.sijilSummary.totalKapal || 0);
    }
    if (kpiSubKapal && _data.sijilSummary) {
      var nKurang = _data.sijilSummary.kurangAwak || 0;
      var nKursi = _data.sijilSummary.totalKekuranganKursi !== undefined ? _data.sijilSummary.totalKekuranganKursi : nKurang;
      if (nKurang > 0) {
        kpiSubKapal.innerHTML =
          '<span style="color:var(--negative); font-weight:500;">' + nKurang + ' kapal kurang awak</span>' +
          ' <span style="color:var(--muted);">(' + nKursi + ' kursi kosong)</span>';
      } else {
        kpiSubKapal.innerHTML = '<span style="color:var(--positive); font-weight:500;">100% kapal siap laut</span>';
      }
    }

    // 3. Bilah Proporsi AKN (DESIGN.md §7.2 & §8.0)
    var lblPeriode = document.getElementById('label-ringkasan-akn-periode');
    if (lblPeriode) {
      var aknPer = (_data.aknMeta && _data.aknMeta.periode) || (_data.akn && _data.akn.periode) || _data.periode || '--';
      lblPeriode.textContent = 'Periode ' + aknPer;
    }

    var trackListEl = document.getElementById('ringkasan-track-list');
    if (trackListEl) {
      var categories = ['PNS', 'P3K', 'P3K_PARUH_WAKTU', 'PJLP'];
      var mat = _data.aknTerbaru || (_data.akn && _data.akn.matrix) || {};
      var trackHtml = '';

      categories.forEach(function (cat) {
        var poaNode = (mat.AKN_POA && mat.AKN_POA[cat]) ? mat.AKN_POA[cat] : (mat[cat] || {});
        var kesNode = (mat.AKN_KESELURUHAN && mat.AKN_KESELURUHAN[cat]) ? mat.AKN_KESELURUHAN[cat] : (mat[cat] || {});
        var valPoa = poaNode.jumlah !== undefined ? poaNode.jumlah : (poaNode.AKN_POA || 0);
        var valKes = kesNode.jumlah !== undefined ? kesNode.jumlah : (kesNode.AKN_KESELURUHAN || 0);
        var pct = valKes > 0 ? Math.round((valPoa / valKes) * 100) : 0;
        if (pct > 100) pct = 100;

        trackHtml +=
          '<div class="track-row">' +
            '<div class="track-head">' +
              '<span class="track-label">' + (KATEGORI_LABELS[cat] || cat) + '</span>' +
              '<span class="track-numbers mono tnum">' +
                '<strong>' + Format.number(valPoa) + '</strong> / ' + Format.number(valKes) + ' (' + pct + '%)' +
              '</span>' +
            '</div>' +
            '<div class="track-bar">' +
              '<div class="track-fill" style="width:' + pct + '%;"></div>' +
            '</div>' +
          '</div>';
      });

      trackListEl.innerHTML = trackHtml;
    }

    var rasioTotalEl = document.getElementById('ringkasan-total-rasio');
    if (rasioTotalEl) {
      var totPoa = _data.kpi.totalAknPoa || 0;
      var totKes = _data.kpi.totalAknKeseluruhan || 1;
      var totalPct = ((totPoa / totKes) * 100).toFixed(1);
      rasioTotalEl.textContent = 'Pusat ' + totalPct + '% (' + Format.number(totPoa) + ' personil)';
    }

    // 4. Antrean Tindak Lanjut Sertifikasi Table
    var tbodySertifikat = document.getElementById('tbody-ringkasan-sertifikat');
    if (tbodySertifikat) {
      var antrean = _data.antreanSertifikatUrgent || [];
      if (antrean.length === 0) {
        tbodySertifikat.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:24px; color:var(--muted);">Seluruh sertifikat kepelautan personil aktif dan berlaku.</td></tr>';
      } else {
        tbodySertifikat.innerHTML = antrean.map(function (s) {
          var nama = s.namaAwak || s.nama || 'Awak Kapal';
          var bg = Format.avatarBg(nama);
          var inis = Format.initials(nama);
          var namaPel = s.namaPelatihan || s.jenisSertifikat || 'Sertifikat STCW-F';
          var tgl = s.berlakuSampai || s.tanggalBerlaku || '';
          var st = s.status || s.statusBerlaku || 'SEGERA_HABIS';

          return (
            '<tr>' +
              '<td data-label="Personil">' +
                '<div style="display:flex; align-items:center; gap:8px;">' +
                  '<div class="avatar-sm" style="background-color:' + bg + ';">' + inis + '</div>' +
                  '<div style="min-width:0;">' +
                    '<div class="cell-primary">' + Format.escape(nama) + '</div>' +
                    '<div style="font-size:12px; color:var(--muted);">' + Format.escape(s.jabatan || s.namaKapal || '-') + '</div>' +
                  '</div>' +
                '</div>' +
              '</td>' +
              '<td data-label="Sertifikat">' +
                '<div class="cell-primary">' + Format.escape(namaPel) + '</div>' +
                '<div class="mono tnum" style="font-size:12px; color:var(--muted);">' + Format.escape(s.nomorSertifikat || s.sertifikatId || '-') + '</div>' +
              '</td>' +
              '<td data-label="Masa berlaku">' +
                '<div class="mono tnum" style="font-size:12px; color:var(--text);">' + Format.date(tgl) + '</div>' +
                '<div style="font-size:12px;">' +
                  (s.sisaHari < 0 ? '<span style="color:var(--negative); font-weight:500;">Lewat ' + Math.abs(s.sisaHari) + ' hari</span>' : '<span style="color:var(--warning); font-weight:500;">' + s.sisaHari + ' hari lagi</span>') +
                '</div>' +
              '</td>' +
              '<td data-label="Status" style="text-align:center;">' + Format.statusBadge(st === 'KEDALUWARSA' ? 'KEDALUWARSA' : 'SEGERA_HABIS') + '</td>' +
            '</tr>'
          );
        }).join('');
      }
    }

    // 5. Papan Sijil Ringkas Armada Table (Maksimal 5 baris prioritas + tautan See more ke Papan Sijil)
    var tbodySijil = document.getElementById('tbody-ringkasan-sijil');
    var sijilCountInfo = document.getElementById('ringkasan-sijil-count-info');
    if (tbodySijil) {
      var kapalList = _data.sijilKapalRingkas || [];
      var previewKapal = kapalList.slice(0, 5);
      var totalKapal = (_data.sijilSummary && _data.sijilSummary.totalKapal) ? _data.sijilSummary.totalKapal : kapalList.length;

      if (sijilCountInfo) {
        if (previewKapal.length === 0) {
          sijilCountInfo.textContent = '0 kapal pengawas';
        } else if (totalKapal > previewKapal.length) {
          sijilCountInfo.textContent = 'Menampilkan ' + Format.number(previewKapal.length) + ' dari ' + Format.number(totalKapal) + ' kapal pengawas';
        } else {
          sijilCountInfo.textContent = 'Menampilkan seluruh ' + Format.number(totalKapal) + ' kapal pengawas';
        }
      }

      if (previewKapal.length === 0) {
        tbodySijil.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:24px; color:var(--muted);">Data kapal armada belum tersedia.</td></tr>';
      } else {
        tbodySijil.innerHTML = previewKapal.map(function (k) {
          var klsLabel = String(k.kelasKapal || '').replace('_', ' ');
          var defisitHtml = (k.kekuranganKursi > 0)
            ? '<span class="delta-down mono">-' + k.kekuranganKursi + ' kursi</span>'
            : '<span style="color:var(--muted);" class="mono">0</span>';

          var kIdArg = Format.escape(k.kapalId || '');
          return (
            '<tr class="clickable" tabindex="0" role="button" onclick="RingkasanView.openKapalSijil(\'' + kIdArg + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();RingkasanView.openKapalSijil(\'' + kIdArg + '\');}">' +
              '<td data-label="Kapal pengawas">' +
                '<div class="cell-primary">' + Format.escape(k.namaKapal) + '</div>' +
                '<div class="cell-sub">' + Format.escape(k.pangkalanId) + '</div>' +
              '</td>' +
              '<td data-label="Kelas"><span class="badge badge-neutral">' + Format.escape(klsLabel) + '</span></td>' +
              '<td data-label="Kebutuhan" class="text-right mono tnum">' + (k.kebutuhanMinimum || 0) + '</td>' +
              '<td data-label="Terisi" class="text-right mono tnum"><strong>' + (k.jumlahAwakBertugas || 0) + '</strong></td>' +
              '<td data-label="Defisit" class="text-right">' + defisitHtml + '</td>' +
              '<td data-label="Kelaikan" class="text-center">' + Format.statusBadge(k.statusOperasi) + '</td>' +
            '</tr>'
          );
        }).join('');
      }
    }

    // 6. Agenda Kegiatan Terkini Container (Baris Ledger Berbatas Garis Tipis)
    var kegContainer = document.getElementById('ringkasan-kegiatan-container');
    if (kegContainer) {
      var kegiatan = _data.kegiatanTerbaru || [];
      if (kegiatan.length === 0) {
        kegContainer.innerHTML = '<div style="padding:20px 0; text-align:center; color:var(--muted); font-size:12px;">Belum ada agenda kegiatan pengawakan tercatat.</div>';
      } else {
        kegContainer.innerHTML = kegiatan.map(function (kg, idx) {
          var borderBottom = idx < kegiatan.length - 1 ? 'border-bottom:1px solid var(--rule);' : '';
          var jenisClean = String(kg.jenisKegiatan || '').indexOf('_') >= 0
            ? String(kg.jenisKegiatan).toLowerCase().replace(/_/g, ' ').replace(/^\w/, function (c) { return c.toUpperCase(); })
            : String(kg.jenisKegiatan || '');
          return (
            '<div style="padding:12px 0; ' + borderBottom + '">' +
              '<div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px; font-size:12px; color:var(--muted);">' +
                '<span class="mono tnum">' + Format.date(kg.tanggalMulai) + '</span>' +
                '<span style="color:var(--ink-secondary); font-weight:500;">' + Format.escape(jenisClean) + '</span>' +
              '</div>' +
              '<div style="font-size:13px; font-weight:500; color:var(--text); line-height:1.4;">' +
                Format.escape(kg.judulKegiatan) +
              '</div>' +
              '<div style="font-size:12px; color:var(--muted); margin-top:4px;">' +
                Format.escape(kg.wilayah) + ' · ' + Format.number(kg.jumlahPeserta) + ' peserta' +
              '</div>' +
            '</div>'
          );
        }).join('');
      }
    }

    // 7. Rekap Kekuatan per Jabatan Awak (Ringkasan Eksekutif)
    var tbodyJab = document.getElementById('tbody-ringkasan-jabatan');
    if (tbodyJab) {
      var jabs = _data.rekapJabatan || [];
      if (jabs.length === 0) {
        tbodyJab.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--muted);">Belum ada data kekuatan per jabatan.</td></tr>';
      } else {
        tbodyJab.innerHTML = jabs.map(function (j) {
          var jbtName = j.kelompokJabatan || j.jabatan || '-';
          var ideal = j.idealArmada !== undefined ? j.idealArmada : (j.kebutuhan || 0);
          var diff = j.selisih || 0;
          var diffHtml = diff < 0
            ? '<span class="delta-down mono">' + diff + '</span>'
            : (diff > 0 ? '<span class="delta-up mono">+' + diff + '</span>' : '<span class="mono" style="color:var(--muted);">0</span>');
          return '<tr>' +
            '<td data-label="Kelompok jabatan" class="cell-primary">' + Format.escape(jbtName) + '</td>' +
            '<td data-label="Dit. POA" class="text-right mono tnum" style="color:var(--accent-ink);">' + Format.number(j.poaPusat || 0) + '</td>' +
            '<td data-label="Eksisting aktif" class="text-right mono tnum" style="font-weight:500;">' + Format.number(j.eksisting || 0) + '</td>' +
            '<td data-label="Standar ideal" class="text-right mono tnum">' + (ideal > 0 ? Format.number(ideal) : '-') + '</td>' +
            '<td data-label="Selisih" class="text-right">' + diffHtml + '</td>' +
          '</tr>';
        }).join('');
      }
    }
  }

  return {
    init: init,
    loadData: loadData,
    openKapalSijil: openKapalSijil,
    dismissOnboard: dismissOnboard,
    openOnboard: openOnboard
  };
})();
</script>
