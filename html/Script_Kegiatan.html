<script>
/**
 * html/Script_Kegiatan.html
 * Controller Klien Sub-Modul B: Log Kegiatan & Multi-Evidence Pelatihan Personil
 * Nakhoda — Timja Pengawakan Dit. POA KKP RI (Achromatic Ledger)
 */
var KegiatanView = (function () {
  'use strict';

  var _items = [];
  var _stagedFiles = [];
  var _userRole = '';
  var _activeTab = 'daftar'; // 'daftar' | 'timeline'
  var _eventsBound = false;

  var JENIS_LABELS = {
    'PELATIHAN_TEKNIS': 'Pelatihan teknis',
    'SERTIFIKASI_LAUT': 'Sertifikasi laut (STCW-F)',
    'PENYEGARAN_TAKTIK': 'Penyegaran taktik',
    'PEMBINAAN_DISIPLIN': 'Pembinaan disiplin'
  };

  function init() {
    _bindEvents();
    load();
  }

  function _bindEvents() {
    if (_eventsBound) return;
    _eventsBound = true;

    // Tab switcher
    var tabDaftar = document.getElementById('tab-keg-daftar');
    var tabTimeline = document.getElementById('tab-keg-timeline');
    if (tabDaftar && tabTimeline) {
      tabDaftar.onclick = function () {
        _switchTab('daftar');
      };
      tabTimeline.onclick = function () {
        _switchTab('timeline');
      };
    }

    var btnRefresh = document.getElementById('btn-keg-refresh');
    if (btnRefresh) {
      btnRefresh.onclick = function () {
        load();
      };
    }

    var btnTambah = document.getElementById('btn-tambah-kegiatan');
    if (btnTambah) {
      btnTambah.onclick = function () {
        _openCreateModal();
      };
    }

    var filterJenis = document.getElementById('keg-filter-jenis');
    if (filterJenis) {
      filterJenis.onchange = function () {
        load();
      };
    }

    var btnSearch = document.getElementById('btn-keg-search');
    if (btnSearch) {
      btnSearch.onclick = function () {
        load();
      };
    }

    var searchInput = document.getElementById('keg-search-input');
    if (searchInput) {
      searchInput.onkeydown = function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          load();
        }
      };
    }

    var fileInput = document.getElementById('keg-file-input');
    if (fileInput) {
      fileInput.onchange = function (e) {
        _handleFileSelection(e.target.files);
      };
    }

    var formKeg = document.getElementById('form-kegiatan');
    if (formKeg) {
      formKeg.onsubmit = function (e) {
        e.preventDefault();
        _submitForm();
      };
    }

    var formAnulir = document.getElementById('form-keg-anulir');
    if (formAnulir) {
      formAnulir.onsubmit = function (e) {
        e.preventDefault();
        _submitAnulir();
      };
    }
  }

  function _switchTab(tab) {
    _activeTab = tab;
    var tabDaftar = document.getElementById('tab-keg-daftar');
    var tabTimeline = document.getElementById('tab-keg-timeline');
    var paneDaftar = document.getElementById('keg-pane-daftar');
    var paneTimeline = document.getElementById('keg-pane-timeline');

    if (tab === 'daftar') {
      if (tabDaftar) tabDaftar.classList.add('active');
      if (tabTimeline) tabTimeline.classList.remove('active');
      if (paneDaftar) paneDaftar.classList.remove('hidden');
      if (paneTimeline) paneTimeline.classList.add('hidden');
    } else {
      if (tabDaftar) tabDaftar.classList.remove('active');
      if (tabTimeline) tabTimeline.classList.add('active');
      if (paneDaftar) paneDaftar.classList.add('hidden');
      if (paneTimeline) paneTimeline.classList.remove('hidden');
      _renderTimeline();
    }
  }

  function load() {
    var token = AuthApp.getToken();
    if (!token) return;

    var btnRefresh = document.getElementById('btn-keg-refresh');
    if (btnRefresh) {
      btnRefresh.disabled = true;
      btnRefresh.classList.add('loading');
    }

    var jenis = (document.getElementById('keg-filter-jenis') || {}).value || '';
    var search = (document.getElementById('keg-search-input') || {}).value || '';

    rpc('keg_list', {
      token: token,
      jenis: jenis,
      search: search,
      limit: 50,
      offset: 0
    })
      .then(function (res) {
        if (btnRefresh) {
          btnRefresh.disabled = false;
          btnRefresh.classList.remove('loading');
        }
        if (!res) {
          Toast.error('Respon data log kegiatan kosong.');
          return;
        }

        _items = res.items || [];
        _userRole = res.userRole || '';

        // Kalimat Temuan Subtitle
        var subEl = document.getElementById('kegiatan-finding-sub');
        if (subEl) {
          subEl.textContent = res.findingSubtitle || (_items.length + ' agenda kegiatan pembinaan tercatat dalam sistem.');
        }

        // Metrik Strip 4-Kolom
        var m = res.metrics || {};
        var kpiTotal = document.getElementById('kpi-keg-total');
        var kpiPeserta = document.getElementById('kpi-keg-peserta');
        var kpiLampiran = document.getElementById('kpi-keg-lampiran');
        var kpiBulanIni = document.getElementById('kpi-keg-bulan-ini');

        if (kpiTotal) kpiTotal.textContent = Format.number(m.totalKegiatan || _items.length);
        if (kpiPeserta) kpiPeserta.textContent = Format.number(m.totalPeserta || 0);
        if (kpiLampiran) kpiLampiran.textContent = Format.number(m.totalLampiran || 0);
        if (kpiBulanIni) kpiBulanIni.textContent = Format.number(m.kegiatanBulanIni || 0);

        var totalInfo = document.getElementById('keg-total-info');
        if (totalInfo) totalInfo.textContent = Format.number(res.total || _items.length) + ' agenda';

        _renderTable();
        if (_activeTab === 'timeline') {
          _renderTimeline();
        }
      })
      .catch(function (err) {
        if (btnRefresh) {
          btnRefresh.disabled = false;
          btnRefresh.classList.remove('loading');
        }
        Toast.error(err.message || 'Gagal memuat log kegiatan.');
      });
  }

  function _renderTable() {
    var tbody = document.getElementById('keg-list-tbody');
    if (!tbody) return;

    if (_items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:32px 0;">Tidak ada agenda kegiatan yang cocok dengan filter.</td></tr>';
      return;
    }

    var html = '';
    _items.forEach(function (keg) {
      var isVoid = String(keg.status || '').toUpperCase() === 'VOID';
      var statusBadgeHtml = isVoid
        ? Format.statusBadge('Dianulir', 'negative')
        : Format.statusBadge('Aktif', 'positive');

      var dateDisplay = Format.date(keg.tanggalMulai);
      if (keg.tanggalSelesai && keg.tanggalSelesai !== keg.tanggalMulai) {
        dateDisplay += ' &ndash; ' + Format.date(keg.tanggalSelesai);
      }

      var jenisLabel = JENIS_LABELS[keg.jenisKegiatan] || keg.jenisKegiatan;
      var wilayahPill = keg.wilayah
        ? '<span style="display:inline-block; font-size:11px; padding:1px 6px; background:var(--surface); border:1px solid var(--border); border-radius:3px; color:var(--muted);">' + Format.escape(keg.wilayah) + '</span>'
        : '';

      var deskSnippet = keg.deskripsi
        ? '<div style="font-size:11px; color:var(--muted); line-height:1.4; margin-top:2px; max-width:440px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + Format.escape(keg.deskripsi) + '</div>'
        : '';

      var evidenceHtml = '--';
      if (keg.evidenceCount > 0) {
        evidenceHtml = '<span class="badge-neutral mono tnum" style="display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 6px;">' +
          '<svg viewBox="0 0 24 24" style="width:11px; height:11px; stroke:currentColor; stroke-width:2; fill:none;"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>' +
          keg.evidenceCount +
          '</span>';
      }

      var isPrivileged = (_userRole === 'KADIV' || _userRole === 'SUPERADMIN' || _userRole === 'DIREKTUR');
      var actions = '<div style="display:flex; justify-content:flex-end; gap:6px;">' +
        '<button type="button" class="btn btn-secondary-sm" onclick="KegiatanView.openDetailSheet(\'' + keg.rowId + '\')">Detail</button>';

      if (!isVoid) {
        actions += '<button type="button" class="btn btn-secondary-sm" onclick="KegiatanView.openEditModal(\'' + keg.rowId + '\')">Revisi</button>';
        if (isPrivileged) {
          actions += '<button type="button" class="btn btn-negative-sm" onclick="KegiatanView.openAnulirModal(\'' + keg.rowId + '\')">Anulir</button>';
        }
      }
      actions += '</div>';

      html += '<tr style="' + (isVoid ? 'opacity:0.6;' : '') + '">' +
        '<td>' + statusBadgeHtml + '</td>' +
        '<td>' +
          '<div style="display:flex; align-items:center; gap:6px; margin-bottom:2px;">' +
            '<span class="mono tnum" style="font-size:11px; color:var(--muted);">' + Format.date(keg.tanggalMulai) + '</span>' +
            wilayahPill +
          '</div>' +
          '<div class="cell-primary" style="font-size:13px; font-weight:600; color:var(--text);">' + Format.escape(keg.judulKegiatan) + '</div>' +
          deskSnippet +
        '</td>' +
        '<td><span style="font-size:12px; color:var(--text);">' + Format.escape(jenisLabel) + '</span></td>' +
        '<td><span class="mono tnum" style="font-size:12px; color:var(--text);">' + dateDisplay + '</span></td>' +
        '<td style="text-align:right;"><span class="mono tnum" style="font-size:13px; font-weight:600; color:var(--text);">' + Format.number(keg.jumlahPeserta) + '</span> <span style="font-size:11px; color:var(--muted);">org</span></td>' +
        '<td style="text-align:center;">' + evidenceHtml + '</td>' +
        '<td style="text-align:right;">' + actions + '</td>' +
      '</tr>';
    });

    tbody.innerHTML = html;
  }

  function _renderTimeline() {
    var container = document.getElementById('keg-timeline-container');
    if (!container) return;

    if (_items.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:var(--muted); padding:32px 0;">Belum ada agenda kegiatan untuk ditampilkan pada garis waktu.</div>';
      return;
    }

    var activeItems = _items.filter(function (it) {
      return String(it.status || '').toUpperCase() !== 'VOID';
    });

    var html = '<div style="position:relative; padding-left:24px; border-left:2px solid var(--border); display:flex; flex-direction:column; gap:24px; margin-left:12px;">';

    activeItems.forEach(function (keg) {
      var jenisLabel = JENIS_LABELS[keg.jenisKegiatan] || keg.jenisKegiatan;
      var dateRange = Format.date(keg.tanggalMulai);
      if (keg.tanggalSelesai && keg.tanggalSelesai !== keg.tanggalMulai) {
        dateRange += ' &ndash; ' + Format.date(keg.tanggalSelesai);
      }

      html += '<div style="position:relative;">' +
        // Bullet titik orange pada garis waktu
        '<div style="position:absolute; left:-31px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--bg);"></div>' +
        '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px;">' +
          '<div>' +
            '<div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">' +
              '<span class="mono tnum" style="font-size:11px; font-weight:600; color:var(--accent);">' + dateRange + '</span>' +
              (keg.wilayah ? '<span style="font-size:11px; padding:1px 6px; background:var(--surface); border:1px solid var(--border); border-radius:3px; color:var(--muted);">' + Format.escape(keg.wilayah) + '</span>' : '') +
              '<span style="font-size:11px; color:var(--muted);">· ' + Format.escape(jenisLabel) + '</span>' +
            '</div>' +
            '<div style="font-size:14px; font-weight:600; color:var(--text); margin-bottom:4px;">' + Format.escape(keg.judulKegiatan) + '</div>' +
            (keg.deskripsi ? '<p style="font-size:12px; color:var(--text-secondary); line-height:1.5; margin:0 0 6px 0; max-width:680px;">' + Format.escape(keg.deskripsi) + '</p>' : '') +
            '<div style="display:flex; align-items:center; gap:12px; font-size:11px; color:var(--muted);">' +
              '<span><strong>' + Format.number(keg.jumlahPeserta) + '</strong> personil peserta</span>' +
              (keg.evidenceCount > 0 ? '<span>· <strong>' + keg.evidenceCount + '</strong> berkas lampiran</span>' : '') +
            '</div>' +
          '</div>' +
          '<button type="button" class="btn btn-secondary-sm" onclick="KegiatanView.openDetailSheet(\'' + keg.rowId + '\')">Detail</button>' +
        '</div>' +
      '</div>';
    });

    html += '</div>';
    container.innerHTML = html;
  }

  function openDetailSheet(rowId) {
    var token = AuthApp.getToken();
    if (!token) return;

    Sheet.open('sheet-keg-detail', 'sheet-keg-overlay');
    var body = document.getElementById('sheet-keg-body');
    if (body) {
      body.innerHTML = '<div style="text-align:center; color:var(--muted); padding:32px 0;">Memuat rincian kegiatan...</div>';
    }

    rpc('keg_getDetail', token, rowId)
      .then(function (data) {
        if (!data || !data.kegiatan) {
          if (body) body.innerHTML = '<div style="text-align:center; color:var(--negative); padding:32px 0;">Rincian kegiatan tidak ditemukan.</div>';
          return;
        }

        var k = data.kegiatan;
        var jenisLabel = JENIS_LABELS[k.JenisKegiatan] || k.JenisKegiatan;
        var isVoid = String(k.Status || '').toUpperCase() === 'VOID';

        var titleEl = document.getElementById('sheet-keg-title');
        if (titleEl) titleEl.textContent = k.JudulKegiatan || 'Detail kegiatan';

        var subtitleEl = document.getElementById('sheet-keg-subtitle');
        if (subtitleEl) subtitleEl.textContent = 'Wilayah: ' + (k.Wilayah || 'Seluruh Satuan Operasi Ditjen PSDKP');

        var filesHtml = '<div style="font-size:12px; color:var(--muted); padding:8px 0;">Belum ada dokumen bukti yang terlampir.</div>';
        if (Array.isArray(data.evidence) && data.evidence.length > 0) {
          filesHtml = '<div style="display:flex; flex-direction:column; gap:8px;">';
          data.evidence.forEach(function (ev) {
            filesHtml += '<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);">' +
              '<div style="display:flex; align-items:center; gap:8px; overflow:hidden;">' +
                '<svg viewBox="0 0 24 24" style="width:16px; height:16px; stroke:var(--accent); stroke-width:2; fill:none; flex-shrink:0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' +
                '<div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' +
                  '<div style="font-size:12px; font-weight:500; color:var(--text);">' + Format.escape(ev.JudulFile || 'Dokumen Bukti') + '</div>' +
                  '<div style="font-size:10px; color:var(--muted);">' + Format.date(ev.Timestamp) + '</div>' +
                '</div>' +
              '</div>' +
              (ev.FileUrl ? '<a href="' + ev.FileUrl + '" target="_blank" rel="noopener noreferrer" class="btn btn-secondary-sm" style="flex-shrink:0;">Buka berkas</a>' : '') +
            '</div>';
          });
          filesHtml += '</div>';
        }

        var voidInfo = '';
        if (isVoid) {
          voidInfo = '<div style="padding:12px; background:var(--negative-bg); border:1px solid var(--negative-border); border-radius:var(--radius-sm); margin-bottom:16px; font-size:12px; color:var(--negative);">' +
            '<strong>Agenda ini telah dianulir.</strong><br>' +
            'Alasan: ' + Format.escape(k.VoidReason || 'Tidak ada catatan alasan.') + '<br>' +
            '<span style="font-size:11px; color:var(--muted);">' + Format.date(k.VoidedAt) + '</span>' +
          '</div>';
        }

        var bHtml = voidInfo +
          '<div style="display:flex; flex-direction:column; gap:16px;">' +
            '<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);">' +
              '<div>' +
                '<div style="font-size:11px; color:var(--muted);">Jenis pembinaan</div>' +
                '<div style="font-size:12px; font-weight:600; color:var(--text);">' + Format.escape(jenisLabel) + '</div>' +
              '</div>' +
              '<div>' +
                '<div style="font-size:11px; color:var(--muted);">Wilayah pangkalan</div>' +
                '<div style="font-size:12px; font-weight:600; color:var(--text);">' + (Format.escape(k.Wilayah) || '—') + '</div>' +
              '</div>' +
              '<div>' +
                '<div style="font-size:11px; color:var(--muted);">Jadwal pelaksanaan</div>' +
                '<div class="mono tnum" style="font-size:12px; font-weight:600; color:var(--text);">' + Format.date(k.TanggalMulai) + (k.TanggalSelesai && k.TanggalSelesai !== k.TanggalMulai ? ' &ndash; ' + Format.date(k.TanggalSelesai) : '') + '</div>' +
              '</div>' +
              '<div>' +
                '<div style="font-size:11px; color:var(--muted);">Jumlah peserta</div>' +
                '<div class="mono tnum" style="font-size:12px; font-weight:600; color:var(--text);">' + Format.number(k.JumlahPeserta) + ' personil</div>' +
              '</div>' +
            '</div>' +

            '<div>' +
              '<div style="font-size:12px; font-weight:600; color:var(--text); margin-bottom:6px;">Ringkasan notula &amp; pembahasan</div>' +
              '<div style="font-size:12px; line-height:1.6; color:var(--text); padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); white-space:pre-wrap;">' +
                (Format.escape(k.Deskripsi) || 'Tidak ada notula terlampir.') +
              '</div>' +
            '</div>' +

            '<div>' +
              '<div style="font-size:12px; font-weight:600; color:var(--text); margin-bottom:6px;">Dokumen bukti tersimpan</div>' +
              filesHtml +
            '</div>' +

            '<div style="font-size:11px; color:var(--muted); border-top:1px solid var(--border); padding-top:12px;">' +
              'Perekam: ' + Format.escape(k.SubmittedBy || '—') + ' · Dicatat pada ' + Format.date(k.Timestamp) +
            '</div>' +
          '</div>';

        if (body) body.innerHTML = bHtml;
      })
      .catch(function (err) {
        if (body) body.innerHTML = '<div style="text-align:center; color:var(--negative); padding:32px 0;">Galat: ' + err.message + '</div>';
      });
  }

  function closeDetailSheet() {
    Sheet.close('sheet-keg-detail', 'sheet-keg-overlay');
  }

  function _openCreateModal() {
    var modeInput = document.getElementById('keg-form-mode');
    var rowIdInput = document.getElementById('keg-form-rowid');
    var modalTitle = document.getElementById('modal-keg-title');
    var form = document.getElementById('form-kegiatan');

    if (modeInput) modeInput.value = 'create';
    if (rowIdInput) rowIdInput.value = '';
    if (modalTitle) modalTitle.textContent = 'Catat agenda kegiatan baru';
    if (form) form.reset();

    _stagedFiles = [];
    _renderStagedFiles();
    Modal.open('modal-keg-form');
  }

  function openEditModal(rowId) {
    var item = _items.find(function (it) { return it.rowId === rowId; });
    if (!item) return;

    var modeInput = document.getElementById('keg-form-mode');
    var rowIdInput = document.getElementById('keg-form-rowid');
    var modalTitle = document.getElementById('modal-keg-title');

    if (modeInput) modeInput.value = 'update';
    if (rowIdInput) rowIdInput.value = rowId;
    if (modalTitle) modalTitle.textContent = 'Revisi agenda kegiatan';

    var fJudul = document.getElementById('keg-judul');
    var fJenis = document.getElementById('keg-jenis');
    var fWilayah = document.getElementById('keg-wilayah');
    var fMulai = document.getElementById('keg-tgl-mulai');
    var fSelesai = document.getElementById('keg-tgl-selesai');
    var fPeserta = document.getElementById('keg-peserta');
    var fDesk = document.getElementById('keg-deskripsi');

    if (fJudul) fJudul.value = item.judulKegiatan || '';
    if (fJenis) fJenis.value = item.jenisKegiatan || 'PELATIHAN_TEKNIS';
    if (fWilayah) fWilayah.value = item.wilayah || '';
    if (fMulai) fMulai.value = item.tanggalMulai || '';
    if (fSelesai) fSelesai.value = item.tanggalSelesai || '';
    if (fPeserta) fPeserta.value = item.jumlahPeserta || 0;
    if (fDesk) fDesk.value = item.deskripsi || '';

    _stagedFiles = [];
    _renderStagedFiles();
    Modal.open('modal-keg-form');
  }

  function openAnulirModal(rowId) {
    var item = _items.find(function (it) { return it.rowId === rowId; });
    if (!item) return;

    var idEl = document.getElementById('anulir-keg-rowid');
    var judulEl = document.getElementById('anulir-keg-judul');
    var alasanEl = document.getElementById('anulir-keg-alasan');

    if (idEl) idEl.value = rowId;
    if (judulEl) judulEl.textContent = item.judulKegiatan;
    if (alasanEl) alasanEl.value = '';

    Modal.open('modal-keg-anulir');
  }

  function _handleFileSelection(fileList) {
    if (!fileList || fileList.length === 0) return;
    for (var i = 0; i < fileList.length; i++) {
      var file = fileList[i];
      if (file.size > 15 * 1024 * 1024) {
        Toast.error('Berkas "' + file.name + '" melebihi batas 15 MB.');
        continue;
      }
      (function (f) {
        var reader = new FileReader();
        reader.onload = function (e) {
          _stagedFiles.push({
            name: f.name,
            mimeType: f.type || 'application/octet-stream',
            size: f.size,
            dataUrl: e.target.result
          });
          _renderStagedFiles();
        };
        reader.readAsDataURL(f);
      })(file);
    }
  }

  function _renderStagedFiles() {
    var container = document.getElementById('keg-staged-files');
    if (!container) return;

    if (_stagedFiles.length === 0) {
      container.innerHTML = '';
      return;
    }

    var html = '';
    _stagedFiles.forEach(function (f, idx) {
      var sizeKb = Math.round(f.size / 1024);
      html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); font-size:11px;">' +
        '<div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:380px;">' +
          '<strong>' + Format.escape(f.name) + '</strong> (' + sizeKb + ' KB)' +
        '</div>' +
        '<button type="button" class="btn btn-secondary-sm" style="padding:2px 6px; font-size:11px;" onclick="KegiatanView.removeStagedFile(' + idx + ')">Hapus</button>' +
      '</div>';
    });

    container.innerHTML = html;
  }

  function removeStagedFile(idx) {
    _stagedFiles.splice(idx, 1);
    _renderStagedFiles();
  }

  function _submitForm() {
    var token = AuthApp.getToken();
    if (!token) return;

    var mode = (document.getElementById('keg-form-mode') || {}).value || 'create';
    var rowId = (document.getElementById('keg-form-rowid') || {}).value || '';
    var judul = (document.getElementById('keg-judul') || {}).value || '';
    var jenis = (document.getElementById('keg-jenis') || {}).value || '';
    var wilayah = (document.getElementById('keg-wilayah') || {}).value || '';
    var tglMulai = (document.getElementById('keg-tgl-mulai') || {}).value || '';
    var tglSelesai = (document.getElementById('keg-tgl-selesai') || {}).value || '';
    var peserta = parseInt((document.getElementById('keg-peserta') || {}).value, 10) || 0;
    var deskripsi = (document.getElementById('keg-deskripsi') || {}).value || '';

    if (!judul.trim()) {
      Toast.error('Nama agenda kegiatan wajib diisi.');
      return;
    }
    if (!tglMulai) {
      Toast.error('Tanggal mulai wajib diisi.');
      return;
    }

    var btnSubmit = document.getElementById('btn-keg-submit');
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.classList.add('loading');
    }

    var payload = {
      token: token,
      judulKegiatan: judul,
      jenisKegiatan: jenis,
      wilayah: wilayah,
      tanggalMulai: tglMulai,
      tanggalSelesai: tglSelesai || tglMulai,
      jumlahPeserta: peserta,
      deskripsi: deskripsi,
      files: _stagedFiles.map(function (f) {
        return {
          filename: f.name,
          mimeType: f.mimeType,
          dataBase64: f.dataUrl ? f.dataUrl.split(',')[1] : ''
        };
      })
    };

    var rpcName = 'keg_submit';
    if (mode === 'update') {
      rpcName = 'keg_revisi';
      payload.rowId = rowId;
      payload.alasanRevisi = 'Revisi data via antarmuka Nakhoda';
    }

    rpc(rpcName, payload)
      .then(function () {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.classList.remove('loading');
        }
        Modal.close('modal-keg-form');
        Toast.success(mode === 'update' ? 'Agenda kegiatan berhasil direvisi.' : 'Agenda kegiatan baru berhasil dicatat.');
        load();
      })
      .catch(function (err) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.classList.remove('loading');
        }
        Toast.error(err.message || 'Gagal menyimpan agenda kegiatan.');
      });
  }

  function _submitAnulir() {
    var token = AuthApp.getToken();
    if (!token) return;

    var rowId = (document.getElementById('anulir-keg-rowid') || {}).value || '';
    var alasan = (document.getElementById('anulir-keg-alasan') || {}).value || '';

    if (!alasan.trim()) {
      Toast.error('Alasan pembatalan wajib diisi.');
      return;
    }

    var btn = document.getElementById('btn-keg-anulir-submit');
    if (btn) {
      btn.disabled = true;
      btn.classList.add('loading');
    }

    rpc('keg_anulir', {
      token: token,
      rowId: rowId,
      alasanAnulir: alasan
    })
      .then(function () {
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('loading');
        }
        Modal.close('modal-keg-anulir');
        Toast.success('Agenda kegiatan berhasil dianulir.');
        load();
      })
      .catch(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('loading');
        }
        Toast.error(err.message || 'Gagal menganulir agenda.');
      });
  }

  return {
    init: init,
    load: load,
    openDetailSheet: openDetailSheet,
    closeDetailSheet: closeDetailSheet,
    openEditModal: openEditModal,
    openAnulirModal: openAnulirModal,
    removeStagedFile: removeStagedFile
  };
})();
</script>
