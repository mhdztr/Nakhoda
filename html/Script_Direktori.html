<script>
/**
 * html/Script_Direktori.html
 * Controller Klien Sub-Modul C: Direktori 396+ Awak Kapal Armada PSDKP (Achromatic Ledger).
 * Nakhoda — Timja Pengawakan Dit. POA KKP RI
 */
var DirektoriView = (function () {
  'use strict';

  var _offset = 0;
  var _limit = 50;
  var _total = 0;
  var _selectedIds = {};
  var _perluDilengkapiOnly = false;
  var _currentDetailAwak = null;
  var _eventsBound = false;

  function init() {
    _bindEvents();
    load(0);
  }

  function _bindEvents() {
    if (_eventsBound) return;
    _eventsBound = true;

    var filterRumpun = document.getElementById('dir-filter-rumpun');
    var filterKelas = document.getElementById('dir-filter-kelas');
    var searchInput = document.getElementById('dir-search-input');
    var btnSearch = document.getElementById('btn-dir-search');
    var btnPrev = document.getElementById('btn-dir-prev');
    var btnNext = document.getElementById('btn-dir-next');
    var btnTogglePerlu = document.getElementById('btn-toggle-perlu');
    var cardFilterPerlu = document.getElementById('card-filter-perlu');
    var checkAll = document.getElementById('check-select-all');
    var btnBatch = document.getElementById('btn-batch-assign');
    var btnTambah = document.getElementById('btn-tambah-awak');
    var formAwak = document.getElementById('form-dir-awak');
    var formBatch = document.getElementById('form-dir-batch');
    var btnSheetEdit = document.getElementById('btn-sheet-edit-awak');

    if (filterRumpun) filterRumpun.onchange = function () { load(0); };
    if (filterKelas) filterKelas.onchange = function () { load(0); };
    if (btnSearch) btnSearch.onclick = function () { load(0); };
    if (searchInput) {
      searchInput.onkeydown = function (e) {
        if (e.key === 'Enter') load(0);
      };
    }

    if (btnPrev) {
      btnPrev.onclick = function () {
        if (_offset >= _limit) load(_offset - _limit);
      };
    }

    if (btnNext) {
      btnNext.onclick = function () {
        if (_offset + _limit < _total) load(_offset + _limit);
      };
    }

    if (btnTogglePerlu) {
      btnTogglePerlu.onclick = function () {
        _perluDilengkapiOnly = !_perluDilengkapiOnly;
        btnTogglePerlu.textContent = _perluDilengkapiOnly ? 'Hanya perlu dilengkapi' : 'Semua personil';
        btnTogglePerlu.className = _perluDilengkapiOnly ? 'btn btn-primary-md' : 'btn btn-secondary-md';
        load(0);
      };
    }

    if (cardFilterPerlu) {
      cardFilterPerlu.onclick = function () {
        _perluDilengkapiOnly = true;
        if (btnTogglePerlu) {
          btnTogglePerlu.textContent = 'Hanya perlu dilengkapi';
          btnTogglePerlu.className = 'btn btn-primary-md';
        }
        load(0);
      };
    }

    if (checkAll) {
      checkAll.onchange = function () {
        var cbs = document.querySelectorAll('.cb-select-awak');
        cbs.forEach(function (cb) {
          cb.checked = checkAll.checked;
          var id = cb.getAttribute('data-id');
          if (checkAll.checked) {
            _selectedIds[id] = true;
          } else {
            delete _selectedIds[id];
          }
        });
        _updateBatchButton();
      };
    }

    if (btnBatch) {
      btnBatch.onclick = function () {
        _openBatchModal();
      };
    }

    if (btnTambah) {
      btnTambah.onclick = function () {
        _openFormModal(null);
      };
    }

    if (btnSheetEdit) {
      btnSheetEdit.onclick = function () {
        if (_currentDetailAwak) {
          _openFormModal(_currentDetailAwak);
        }
      };
    }

    if (formAwak) {
      formAwak.onsubmit = function (e) {
        e.preventDefault();
        _submitFormAwak();
      };
    }

    if (formBatch) {
      formBatch.onsubmit = function (e) {
        e.preventDefault();
        _submitBatch();
      };
    }
  }

  function load(offset) {
    var token = AuthApp.getToken();
    if (!token) return;

    _offset = offset || 0;
    var rumpun = (document.getElementById('dir-filter-rumpun') || {}).value || '';
    var kelas = (document.getElementById('dir-filter-kelas') || {}).value || '';
    var search = (document.getElementById('dir-search-input') || {}).value || '';

    rpc('dir_list', {
      token: token,
      rumpun: rumpun,
      kelasKapal: kelas,
      search: search,
      perluDilengkapi: _perluDilengkapiOnly,
      limit: _limit,
      offset: _offset
    })
      .then(function (res) {
        _total = res.total || 0;

        // 1. Update KPI Stat Cards
        var stTot = document.getElementById('stat-total-awak');
        var stDek = document.getElementById('stat-dek-awak');
        var stMes = document.getElementById('stat-mesin-awak');
        var stPerlu = document.getElementById('stat-perlu-awak');
        var stMatch = document.getElementById('dir-total-matched');
        var findingEl = document.getElementById('dir-finding-sub');

        if (stTot) stTot.textContent = Format.number(res.stats.total);
        if (stDek) stDek.textContent = Format.number(res.stats.dek);
        if (stMes) stMes.textContent = Format.number(res.stats.mesin);
        if (stPerlu) stPerlu.textContent = Format.number(res.stats.perluDilengkapi);
        if (stMatch) stMatch.textContent = Format.number(_total) + ' personil cocok';

        if (findingEl) {
          findingEl.textContent = 'Menampilkan ' + Format.number(_total) + ' personil awak kapal (' +
            Format.number(res.stats.dek) + ' Dek, ' + Format.number(res.stats.mesin) + ' Mesin). ' +
            (res.stats.perluDilengkapi > 0 ? (res.stats.perluDilengkapi + ' profil dalam antrean kelengkapan nomor buku pelaut / kategori.') : 'Seluruh profil terisi lengkap.');
        }

        // 2. Render Tabel Data
        _renderTable(res.items || []);

        // 3. Update Paginasi
        var pageInfo = document.getElementById('dir-page-info');
        var btnPrev = document.getElementById('btn-dir-prev');
        var btnNext = document.getElementById('btn-dir-next');

        var start = _total === 0 ? 0 : (_offset + 1);
        var end = Math.min(_offset + _limit, _total);
        if (pageInfo) pageInfo.textContent = 'Menampilkan ' + start + ' – ' + end + ' dari ' + Format.number(_total) + ' data';

        if (btnPrev) btnPrev.disabled = _offset <= 0;
        if (btnNext) btnNext.disabled = (_offset + _limit) >= _total;
      })
      .catch(function (err) {
        Toast.error('Gagal memuat direktori awak: ' + err.message);
      });
  }

  function _renderTable(items) {
    var tbody = document.getElementById('dir-list-tbody');
    if (!tbody) return;

    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:32px 0; color:var(--muted);">Tidak ada data personil awak yang cocok dengan kriteria saring.</td></tr>';
      return;
    }

    var html = '';
    items.forEach(function (a) {
      var isChecked = !!_selectedIds[a.pegawaiId];
      var klsLabel = String(a.kelasKapal || '').replace('_', ' ');
      var bg = Format.avatarBg(a.nama);
      var inis = Format.initials(a.nama);

      html +=
        '<tr class="clickable" data-id="' + a.pegawaiId + '">' +
          '<td style="text-align:center;" onclick="event.stopPropagation();">' +
            '<input type="checkbox" class="cb-select-awak" data-id="' + a.pegawaiId + '" ' + (isChecked ? 'checked' : '') + '>' +
          '</td>' +
          '<td>' +
            '<div style="display:flex; align-items:center; gap:10px;">' +
              '<div class="avatar-sm" style="background-color:' + bg + ';">' + inis + '</div>' +
              '<div>' +
                '<div class="cell-primary">' + Format.escape(a.nama) + '</div>' +
                '<div class="cell-sub mono">NIP: ' + Format.escape(a.nipDisplay) + '</div>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td>' +
            '<div class="cell-primary">' + Format.escape(a.jabatanLengkap || a.kelompokJabatan) + '</div>' +
            '<div class="cell-sub">' + Format.escape(a.kelompokJabatan) + '</div>' +
          '</td>' +
          '<td><span class="badge badge-neutral">' + Format.escape(klsLabel) + '</span></td>' +
          '<td>' + Format.kelompokBadge(a.rumpun) + '</td>' +
          '<td class="mono">' + (a.kategoriKepegawaian === '-' ? '<span style="color:var(--warning);">Belum diset</span>' : Format.escape(a.kategoriKepegawaian)) + '</td>' +
          '<td class="mono">' + (a.nomorBukuPelaut === '-' ? '<span style="color:var(--warning);">-</span>' : Format.escape(a.nomorBukuPelaut)) + '</td>' +
          '<td class="text-center" onclick="event.stopPropagation();">' +
            '<button type="button" class="btn btn-secondary-sm btn-row-detail" data-id="' + a.pegawaiId + '">Buka</button>' +
          '</td>' +
        '</tr>';
    });

    tbody.innerHTML = html;

    // Pasang click listener di seluruh baris tabel untuk membuka slide-over sheet
    tbody.querySelectorAll('tr[data-id]').forEach(function (tr) {
      tr.onclick = function () {
        var id = tr.getAttribute('data-id');
        openDetailSheet(id);
      };
    });

    // Pasang listener di tombol "Buka"
    tbody.querySelectorAll('.btn-row-detail').forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute('data-id');
        openDetailSheet(id);
      };
    });

    // Pasang listener checkbox
    tbody.querySelectorAll('.cb-select-awak').forEach(function (cb) {
      cb.onchange = function () {
        var id = cb.getAttribute('data-id');
        if (cb.checked) {
          _selectedIds[id] = true;
        } else {
          delete _selectedIds[id];
        }
        _updateBatchButton();
      };
    });
  }

  function _updateBatchButton() {
    var count = Object.keys(_selectedIds).length;
    var btnBatch = document.getElementById('btn-batch-assign');
    var badgeCount = document.getElementById('selected-count-badge');
    if (badgeCount) badgeCount.textContent = count;
    if (btnBatch) {
      if (count > 0) {
        btnBatch.classList.remove('hidden');
      } else {
        btnBatch.classList.add('hidden');
      }
    }
  }

  function openDetailSheet(pegawaiId) {
    var token = AuthApp.getToken();
    if (!token) return;

    Sheet.open('sheet-dir-panel', 'sheet-dir-overlay');
    switchSheetTab('profil');

    var nameEl = document.getElementById('sheet-dir-nama');
    if (nameEl) nameEl.textContent = 'Memuat profil...';

    rpc('dir_getDetail', token, pegawaiId)
      .then(function (res) {
        _currentDetailAwak = res;
        _renderSheetDetail(res);
      })
      .catch(function (err) {
        Toast.error('Gagal memuat detail personil: ' + err.message);
      });
  }

  function _renderSheetDetail(d) {
    if (!d) return;

    var nameEl = document.getElementById('sheet-dir-nama');
    var nipEl = document.getElementById('sheet-dir-nip-display');
    var idEl = document.getElementById('sheet-dir-id-display');
    var avatarEl = document.getElementById('sheet-dir-avatar');
    var badgeRumpun = document.getElementById('sheet-dir-badge-rumpun');
    var badgeKelas = document.getElementById('sheet-dir-badge-kelas');
    var badgeStatus = document.getElementById('sheet-dir-badge-status');
    var jabEl = document.getElementById('sheet-dir-jabatan');
    var katEl = document.getElementById('sheet-dir-kategori');
    var bukuEl = document.getElementById('sheet-dir-buku');
    var kapalEl = document.getElementById('sheet-dir-kapal');
    var pangkalanEl = document.getElementById('sheet-dir-pangkalan');

    if (nameEl) nameEl.textContent = d.nama || '-';
    if (nipEl) nipEl.textContent = 'NIP: ' + (d.nipDisplay || '-');
    if (idEl) idEl.textContent = 'ID: ' + (d.pegawaiId || '-');
    if (avatarEl) {
      avatarEl.textContent = Format.initials(d.nama);
      avatarEl.style.backgroundColor = Format.avatarBg(d.nama);
    }
    if (badgeRumpun) badgeRumpun.textContent = d.rumpun || 'Dek';
    if (badgeKelas) badgeKelas.textContent = String(d.kelasKapal || 'Kelas II').replace('_', ' ');
    if (badgeStatus) {
      badgeStatus.textContent = d.statusAktif || 'Aktif';
      badgeStatus.className = d.statusAktif === 'NONAKTIF' ? 'pill pill-negative' : 'pill pill-positive';
    }
    if (jabEl) jabEl.textContent = d.jabatanLengkap || d.kelompokJabatan || '-';
    if (katEl) katEl.textContent = d.kategoriKepegawaian || 'Belum ditentukan';
    if (bukuEl) bukuEl.textContent = d.nomorBukuPelaut || 'Belum diisi';
    if (kapalEl) kapalEl.textContent = d.kapalId || 'Belum ada penempatan';
    if (pangkalanEl) pangkalanEl.textContent = d.pangkalanId || 'Pusat (Dit. POA)';

    // Render daftar sertifikat di Tab 2
    var certListEl = document.getElementById('sheet-dir-sertifikat-list');
    if (certListEl) {
      var certs = d.sertifikat || [];
      if (certs.length === 0) {
        certListEl.innerHTML = '<div style="padding:18px; text-align:center; color:var(--muted); font-size:12px;">Belum ada sertifikat kepelautan tercatat.</div>';
      } else {
        certListEl.innerHTML = certs.map(function (s) {
          return (
            '<div style="padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-control); background-color:var(--ground);">' +
              '<div style="font-size:13px; font-weight:500; color:var(--text);">' + Format.escape(s.namaPelatihan) + '</div>' +
              '<div class="mono" style="font-size:11px; color:var(--muted); margin-top:2px;">No: ' + Format.escape(s.nomorSertifikat) + '</div>' +
              '<div style="font-size:11px; color:var(--muted); margin-top:2px;">Berlaku s.d: ' + (s.berlakuSampai ? Format.date(s.berlakuSampai) : 'Permanen') + '</div>' +
            '</div>'
          );
        }).join('');
      }
    }

    // Render riwayat penugasan di Tab 3
    var tgsListEl = document.getElementById('sheet-dir-penugasan-list');
    if (tgsListEl) {
      var penugasan = d.penugasan || [];
      if (penugasan.length === 0) {
        tgsListEl.innerHTML = '<div style="padding:18px; text-align:center; color:var(--muted); font-size:12px;">Belum ada riwayat penugasan kapal.</div>';
      } else {
        tgsListEl.innerHTML = penugasan.map(function (t) {
          return (
            '<div style="padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-control); background-color:var(--ground);">' +
              '<div style="font-size:13px; font-weight:500; color:var(--text);">' + Format.escape(t.kapalId) + ' — ' + Format.escape(t.posSijil) + '</div>' +
              '<div class="mono" style="font-size:11px; color:var(--muted); margin-top:2px;">Naik: ' + Format.date(t.tanggalNaik) + (t.tanggalTurun ? ' · Turun: ' + Format.date(t.tanggalTurun) : ' (Aktif)') + '</div>' +
            '</div>'
          );
        }).join('');
      }
    }
  }

  function switchSheetTab(tab) {
    ['profil', 'sertifikat', 'penugasan'].forEach(function (t) {
      var btn = document.getElementById('tab-dir-btn-' + t);
      var panel = document.getElementById('sheet-tab-' + t);
      if (btn) {
        if (t === tab) btn.classList.add('active');
        else btn.classList.remove('active');
      }
      if (panel) {
        if (t === tab) panel.classList.remove('hidden');
        else panel.classList.add('hidden');
      }
    });
  }

  function openCatatSertifikatFromSheet() {
    if (!_currentDetailAwak) return;
    Sheet.close('sheet-dir-panel', 'sheet-dir-overlay');
    Router.navigate('kompetensi');
    if (typeof KompetensiView !== 'undefined' && KompetensiView.openModalCatat) {
      KompetensiView.openModalCatat(_currentDetailAwak.pegawaiId, _currentDetailAwak.nama);
    }
  }

  function _openFormModal(awakObj) {
    var titleEl = document.getElementById('modal-awak-title');
    var idInp = document.getElementById('awak-input-id');
    var namaInp = document.getElementById('awak-input-nama');
    var nipInp = document.getElementById('awak-input-nip');
    var jabInp = document.getElementById('awak-input-jabatan-lengkap');
    var kelInp = document.getElementById('awak-input-kelompok');
    var rmpInp = document.getElementById('awak-input-rumpun');
    var klsInp = document.getElementById('awak-input-kelas');
    var katInp = document.getElementById('awak-input-kategori');
    var bukuInp = document.getElementById('awak-input-buku');
    var statusInp = document.getElementById('awak-input-status-aktif');

    if (awakObj) {
      if (titleEl) titleEl.textContent = 'Edit profil awak kapal';
      if (idInp) idInp.value = awakObj.pegawaiId || '';
      if (namaInp) namaInp.value = awakObj.nama || '';
      if (nipInp) nipInp.value = awakObj.nipRaw || awakObj.nipDisplay || '';
      if (jabInp) jabInp.value = awakObj.jabatanLengkap || '';
      if (kelInp) kelInp.value = awakObj.kelompokJabatan || 'Juru Mudi';
      if (rmpInp) rmpInp.value = awakObj.rumpun || 'DEK';
      if (klsInp) klsInp.value = awakObj.kelasKapal || 'KELAS_II';
      if (katInp) katInp.value = awakObj.kategoriKepegawaian || 'PNS';
      if (bukuInp) bukuInp.value = awakObj.nomorBukuPelaut || '';
      if (statusInp) statusInp.value = awakObj.statusAktif || 'AKTIF';
    } else {
      if (titleEl) titleEl.textContent = 'Tambah personil baru';
      if (idInp) idInp.value = '';
      if (namaInp) namaInp.value = '';
      if (nipInp) nipInp.value = '';
      if (jabInp) jabInp.value = '';
      if (kelInp) kelInp.value = 'Juru Mudi';
      if (rmpInp) rmpInp.value = 'DEK';
      if (klsInp) klsInp.value = 'KELAS_II';
      if (katInp) katInp.value = 'PNS';
      if (bukuInp) bukuInp.value = '';
      if (statusInp) statusInp.value = 'AKTIF';
    }

    Modal.open('modal-dir-awak');
  }

  function _submitFormAwak() {
    var token = AuthApp.getToken();
    var payload = {
      token: token,
      pegawaiId: document.getElementById('awak-input-id').value.trim(),
      nama: document.getElementById('awak-input-nama').value.trim(),
      nip: document.getElementById('awak-input-nip').value.trim(),
      jabatanLengkap: document.getElementById('awak-input-jabatan-lengkap').value.trim(),
      kelompokJabatan: document.getElementById('awak-input-kelompok').value,
      rumpun: document.getElementById('awak-input-rumpun').value,
      kelasKapal: document.getElementById('awak-input-kelas').value,
      kategoriKepegawaian: document.getElementById('awak-input-kategori').value,
      nomorBukuPelaut: document.getElementById('awak-input-buku').value.trim(),
      statusAktif: document.getElementById('awak-input-status-aktif').value
    };

    var btnSubmit = document.getElementById('btn-submit-awak');
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Menyimpan...';
    }

    rpc('dir_save', payload)
      .then(function (res) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Simpan profil personil';
        }
        Modal.close('modal-dir-awak');
        Toast.success(res.message || 'Profil personil berhasil disimpan.');
        load(_offset);
        if (_currentDetailAwak && _currentDetailAwak.pegawaiId === payload.pegawaiId) {
          openDetailSheet(payload.pegawaiId);
        }
      })
      .catch(function (err) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Simpan profil personil';
        }
        Toast.error('Gagal menyimpan profil: ' + err.message);
      });
  }

  function _openBatchModal() {
    var count = Object.keys(_selectedIds).length;
    var countEl = document.getElementById('modal-batch-count');
    if (countEl) countEl.textContent = count;
    Modal.open('modal-dir-batch');
  }

  function _submitBatch() {
    var token = AuthApp.getToken();
    var ids = Object.keys(_selectedIds);
    var kat = document.getElementById('batch-input-kategori').value;

    var btnSubmit = document.getElementById('btn-submit-batch');
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Menerapkan...';
    }

    rpc('dir_batchAssign', {
      token: token,
      pegawaiIds: ids,
      kategoriKepegawaian: kat
    })
      .then(function (res) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Terapkan kategori';
        }
        Modal.close('modal-dir-batch');
        Toast.success(res.message || 'Kategori berhasil diperbarui.');
        _selectedIds = {};
        _updateBatchButton();
        load(_offset);
      })
      .catch(function (err) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Terapkan kategori';
        }
        Toast.error('Gagal memperbarui kategori massal: ' + err.message);
      });
  }

  return {
    init: init,
    load: load,
    openDetailSheet: openDetailSheet,
    switchSheetTab: switchSheetTab,
    openCatatSertifikatFromSheet: openCatatSertifikatFromSheet
  };
})();
</script>
