<script>
/**
 * html/Script_Direktori.html
 * Controller Klien Sub-Modul C: Direktori 396+ Awak Kapal Armada PSDKP (Achromatic Ledger).
 * Nakhoda — Timja Pengawakan Dit. POA KKP RI
 */
var DirektoriView = (function () {
  'use strict';

  var _offset = 0;
  var _limit = 50;
  var _total = 0;
  var _selectedIds = {};
  var _perluDilengkapiOnly = false;
  var _currentDetailAwak = null;
  var _skFileData = null;
  var _eventsBound = false;

  function init() {
    _bindEvents();
    _syncPeriodeRangeVisibility();
    load(0);
  }

  function _syncPeriodeRangeVisibility() {
    var modeEl = document.getElementById('dir-filter-periode-mode');
    var tahunEl = document.getElementById('dir-filter-tahun');
    var rangeWrap = document.getElementById('dir-filter-range-wrap');
    if (!modeEl) return;
    var m = modeEl.value || 'ALL';
    if (tahunEl) tahunEl.classList.toggle('hidden', m === 'ALL' || m === 'CUSTOM');
    if (rangeWrap) {
      rangeWrap.classList.toggle('hidden', m !== 'CUSTOM');
      rangeWrap.style.display = m === 'CUSTOM' ? 'flex' : 'none';
    }
  }

  function _bindEvents() {
    if (_eventsBound) return;
    _eventsBound = true;

    var filterPeriodeMode = document.getElementById('dir-filter-periode-mode');
    var filterTahun = document.getElementById('dir-filter-tahun');
    var filterDateStart = document.getElementById('dir-filter-date-start');
    var filterDateEnd = document.getElementById('dir-filter-date-end');
    var filterRumpun = document.getElementById('dir-filter-rumpun');
    var filterKelas = document.getElementById('dir-filter-kelas');
    var filterPenempatan = document.getElementById('dir-filter-penempatan');
    var filterStatus = document.getElementById('dir-filter-status');
    var searchInput = document.getElementById('dir-search-input');
    var btnSearch = document.getElementById('btn-dir-search');
    var btnFilterNonaktif = document.getElementById('btn-dir-filter-nonaktif');
    var btnDismissAlert = document.getElementById('btn-dir-dismiss-alert');
    var btnPrev = document.getElementById('btn-dir-prev');
    var btnNext = document.getElementById('btn-dir-next');
    var btnTogglePerlu = document.getElementById('btn-toggle-perlu');
    var cardFilterPerlu = document.getElementById('card-filter-perlu');
    var checkAll = document.getElementById('check-select-all');
    var btnBatch = document.getElementById('btn-batch-assign');
    var btnTambah = document.getElementById('btn-tambah-awak');
    var formAwak = document.getElementById('form-dir-awak');
    var formBatch = document.getElementById('form-dir-batch');
    var btnSheetEdit = document.getElementById('btn-sheet-edit-awak');
    var btnSyncSikap = document.getElementById('btn-sync-sikap');
    var fileSkInp = document.getElementById('awak-input-file-sk');

    if (btnSyncSikap) {
      btnSyncSikap.onclick = function () {
        _syncSikap();
      };
    }

    if (filterPeriodeMode) {
      filterPeriodeMode.onchange = function () {
        _syncPeriodeRangeVisibility();
        load(0);
      };
    }
    if (filterTahun) filterTahun.onchange = function () { load(0); };
    if (filterDateStart) {
      filterDateStart.onchange = function () {
        if (filterDateEnd && filterDateEnd.value) load(0);
      };
    }
    if (filterDateEnd) filterDateEnd.onchange = function () { load(0); };
    if (filterRumpun) filterRumpun.onchange = function () { load(0); };
    if (filterKelas) filterKelas.onchange = function () { load(0); };
    if (filterPenempatan) filterPenempatan.onchange = function () { load(0); };
    if (filterStatus) filterStatus.onchange = function () { load(0); };

    if (fileSkInp) {
      fileSkInp.onchange = function () {
        var f = fileSkInp.files && fileSkInp.files[0];
        var stEl = document.getElementById('awak-file-sk-status');
        if (!f) {
          _skFileData = null;
          if (stEl) stEl.textContent = 'Format PDF, JPG, atau PNG maks 15 MB.';
          return;
        }
        if (f.size > 15 * 1024 * 1024) {
          Toast.error('Ukuran berkas SK maksimal 15 MB.');
          fileSkInp.value = '';
          _skFileData = null;
          return;
        }
        var reader = new FileReader();
        reader.onload = function (ev) {
          _skFileData = {
            fileName: f.name,
            mimeType: f.type || 'application/pdf',
            dataBase64: String(ev.target.result || '').split(',')[1] || ''
          };
          if (stEl) stEl.textContent = 'Siap unggah: ' + f.name + ' (' + (f.size / 1024).toFixed(0) + ' KB)';
        };
        reader.readAsDataURL(f);
      };
    }
    if (btnSearch) btnSearch.onclick = function () { load(0); };
    if (btnFilterNonaktif) {
      btnFilterNonaktif.onclick = function () {
        if (filterStatus) filterStatus.value = 'NONAKTIF';
        load(0);
      };
    }
    if (btnDismissAlert) {
      btnDismissAlert.onclick = function () {
        var token = AuthApp.getToken();
        if (!token) return;
        rpc('dir_dismissSikapAlerts', token).then(function (alerts) {
          _renderSikapAlerts(alerts);
        }).catch(function () {});
      };
    }
    if (searchInput) {
      searchInput.onkeydown = function (e) {
        if (e.key === 'Enter') load(0);
      };
    }

    if (btnPrev) {
      btnPrev.onclick = function () {
        if (_offset >= _limit) load(_offset - _limit);
      };
    }

    if (btnNext) {
      btnNext.onclick = function () {
        if (_offset + _limit < _total) load(_offset + _limit);
      };
    }

    if (btnTogglePerlu) {
      btnTogglePerlu.onclick = function () {
        _perluDilengkapiOnly = !_perluDilengkapiOnly;
        btnTogglePerlu.textContent = _perluDilengkapiOnly ? 'Hanya perlu dilengkapi' : 'Semua personil';
        btnTogglePerlu.className = _perluDilengkapiOnly ? 'btn btn-primary-md' : 'btn btn-secondary-md';
        load(0);
      };
    }

    if (cardFilterPerlu) {
      cardFilterPerlu.onclick = function () {
        _perluDilengkapiOnly = true;
        if (btnTogglePerlu) {
          btnTogglePerlu.textContent = 'Hanya perlu dilengkapi';
          btnTogglePerlu.className = 'btn btn-primary-md';
        }
        load(0);
      };
    }

    if (checkAll) {
      checkAll.onchange = function () {
        var cbs = document.querySelectorAll('.cb-select-awak');
        cbs.forEach(function (cb) {
          cb.checked = checkAll.checked;
          var id = cb.getAttribute('data-id');
          if (checkAll.checked) {
            _selectedIds[id] = true;
          } else {
            delete _selectedIds[id];
          }
        });
        _updateBatchButton();
      };
    }

    if (btnBatch) {
      btnBatch.onclick = function () {
        _openBatchModal();
      };
    }

    if (btnTambah) {
      btnTambah.onclick = function () {
        _openFormModal(null);
      };
    }

    if (btnSheetEdit) {
      btnSheetEdit.onclick = function () {
        if (_currentDetailAwak) {
          _openFormModal(_currentDetailAwak);
        }
      };
    }

    if (formAwak) {
      formAwak.onsubmit = function (e) {
        e.preventDefault();
        _submitFormAwak();
      };
    }

    if (formBatch) {
      formBatch.onsubmit = function (e) {
        e.preventDefault();
        _submitBatch();
      };
    }
  }

  function load(offset) {
    var token = AuthApp.getToken();
    if (!token) return;

    _offset = offset || 0;
    var periodeMode = (document.getElementById('dir-filter-periode-mode') || {}).value || 'ALL';
    var tahun = (document.getElementById('dir-filter-tahun') || {}).value || new Date().getFullYear();
    var startDate = (document.getElementById('dir-filter-date-start') || {}).value || '';
    var endDate = (document.getElementById('dir-filter-date-end') || {}).value || '';
    var rumpun = (document.getElementById('dir-filter-rumpun') || {}).value || '';
    var kelas = (document.getElementById('dir-filter-kelas') || {}).value || '';
    var statusPenempatan = (document.getElementById('dir-filter-penempatan') || {}).value || '';
    var statusAktif = (document.getElementById('dir-filter-status') || {}).value || '';
    var search = (document.getElementById('dir-search-input') || {}).value || '';

    rpc('dir_list', {
      token: token,
      periodeMode: periodeMode,
      tahun: tahun,
      startDate: startDate,
      endDate: endDate,
      rumpun: rumpun,
      kelasKapal: kelas,
      statusPenempatan: statusPenempatan,
      statusAktif: statusAktif,
      search: search,
      perluDilengkapi: _perluDilengkapiOnly,
      limit: _limit,
      offset: _offset
    })
      .then(function (res) {
        _total = res.total || 0;

        _renderSikapAlerts(res.sikapAlerts || null);

        // 1. Update KPI Stat Cards
        var stTot = document.getElementById('stat-total-awak');
        var stDek = document.getElementById('stat-dek-awak');
        var stMes = document.getElementById('stat-mesin-awak');
        var stPerlu = document.getElementById('stat-perlu-awak');
        var stMatch = document.getElementById('dir-total-matched');
        var findingEl = document.getElementById('dir-finding-sub');

        if (stTot) stTot.textContent = Format.number(res.stats.total);
        if (stDek) stDek.textContent = Format.number(res.stats.dek);
        if (stMes) stMes.textContent = Format.number(res.stats.mesin);
        if (stPerlu) stPerlu.textContent = Format.number(res.stats.perluDilengkapi);
        if (stMatch) stMatch.textContent = Format.number(_total) + ' personil cocok';

        if (findingEl) {
          findingEl.textContent = 'Menampilkan ' + Format.number(_total) + ' personil awak kapal (' +
            Format.number(res.stats.dek) + ' Dek, ' + Format.number(res.stats.mesin) + ' Mesin). ' +
            (res.stats.perluDilengkapi > 0 ? (res.stats.perluDilengkapi + ' profil memerlukan sertifikat BST aktif atau verifikasi NIP non-PJLP.') : 'Seluruh profil dan BST terisi lengkap.');
        }

        // 2. Render Tabel Data
        _renderTable(res.items || []);

        // 3. Update Paginasi
        var pageInfo = document.getElementById('dir-page-info');
        var btnPrev = document.getElementById('btn-dir-prev');
        var btnNext = document.getElementById('btn-dir-next');

        var start = _total === 0 ? 0 : (_offset + 1);
        var end = Math.min(_offset + _limit, _total);
        if (pageInfo) pageInfo.textContent = 'Menampilkan ' + start + ' – ' + end + ' dari ' + Format.number(_total) + ' data';

        if (btnPrev) btnPrev.disabled = _offset <= 0;
        if (btnNext) btnNext.disabled = (_offset + _limit) >= _total;
      })
      .catch(function (err) {
        var msg = (err && err.message) ? err.message : 'Gagal memuat direktori awak.';
        Toast.error('Gagal memuat direktori awak: ' + msg);
        var tbody = document.getElementById('dir-list-tbody');
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state-box"><div class="empty-state-title">Direktori gagal dimuat</div><div class="empty-state-desc">' + Format.escape(msg) + '</div><div class="empty-state-actions"><button type="button" class="btn btn-secondary-sm" onclick="DirektoriView.load(0)">Coba lagi</button></div></div></td></tr>';
        }
      });
  }

  function _renderSikapAlerts(alerts) {
    var banner = document.getElementById('dir-sikap-alert-banner');
    var titleEl = document.getElementById('dir-sikap-alert-title');
    var descEl = document.getElementById('dir-sikap-alert-desc');
    var pillEl = document.getElementById('dir-sikap-alert-pill');
    var btnDismiss = document.getElementById('btn-dir-dismiss-alert');
    if (!banner) return;

    if (!alerts || !alerts.hasAlert) {
      banner.classList.add('hidden');
      return;
    }

    var conflicts = alerts.onboardConflicts || [];
    var missingCnt = alerts.missingCount || 0;
    var deactCnt = alerts.deactivatedCount || 0;
    var parts = [];
    if (missingCnt > 0) parts.push(missingCnt + ' personil tidak lagi ditemukan/keluar dari SIKAP');
    if (deactCnt > 0) parts.push(deactCnt + ' personil berstatus nonaktif di SIKAP');
    if (conflicts.length > 0) {
      var names = conflicts.slice(0, 3).map(function (c) {
        return c.nama + ' (' + (c.namaKapal || c.kapalId) + ')';
      }).join(', ');
      parts.push(conflicts.length + ' awak nonaktif masih tercatat onboard di Sijil: ' + names + (conflicts.length > 3 ? ', dll.' : ''));
    }

    if (pillEl) {
      pillEl.className = conflicts.length > 0 ? 'pill pill-negative' : 'pill pill-warning';
      pillEl.innerHTML = '<span class="pill-dot"></span>' + (conflicts.length > 0 ? 'Konflik Sijil & SIKAP' : 'Perhatian SIKAP');
    }
    if (titleEl) {
      titleEl.textContent = conflicts.length > 0
        ? 'Awak nonaktif/keluar SIKAP masih terdaftar aktif di kapal'
        : 'Perubahan status kepegawaian terdeteksi di SIKAP';
    }
    if (descEl) {
      descEl.textContent = parts.join(' · ') + (alerts.syncedAt ? (' (Sync: ' + Format.dateTime(alerts.syncedAt) + ')') : '');
    }
    if (btnDismiss) {
      btnDismiss.style.display = conflicts.length > 0 ? 'none' : '';
    }
    banner.classList.remove('hidden');
  }

  function resetFilters() {
    ['dir-filter-rumpun', 'dir-filter-kelas', 'dir-filter-penempatan', 'dir-filter-status', 'dir-search-input'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    var pm = document.getElementById('dir-filter-periode-mode');
    if (pm) pm.value = 'ALL';
    _perluDilengkapiOnly = false;
    var btnPerlu = document.getElementById('btn-toggle-perlu');
    if (btnPerlu) btnPerlu.textContent = 'Semua personil';
    _syncPeriodeRangeVisibility();
    load(0);
  }

  function _renderTable(items) {
    var tbody = document.getElementById('dir-list-tbody');
    if (!tbody) return;

    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state-box">' +
        '<div class="empty-state-title">Belum ada personil awak yang cocok</div>' +
        '<div class="empty-state-desc">Tidak ada personel yang sesuai dengan filter atau kata kunci pencarian saat ini.</div>' +
        '<div class="empty-state-actions">' +
          '<button type="button" class="btn btn-secondary-sm" onclick="DirektoriView.resetFilters()">Reset filter</button>' +
          '<button type="button" class="btn btn-primary-sm" onclick="document.getElementById(\'btn-tambah-awak\')?.click()">+ Tambah personil baru</button>' +
        '</div>' +
      '</div></td></tr>';
      return;
    }

    var html = '';
    items.forEach(function (a) {
      var isChecked = !!_selectedIds[a.pegawaiId];
      var klsLabel = String(a.kelasKapal || '').replace('_', ' ');
      var bg = Format.avatarBg(a.nama);
      var inis = Format.initials(a.nama);
      var isNonAktif = String(a.statusAktif || 'AKTIF').toUpperCase() !== 'AKTIF';
      var statusNote = isNonAktif ? ' <span class="pill pill-neutral" style="margin-left:6px;">Nonaktif SIKAP</span>' : '';
      var isUpt = a.statusPenempatan === 'DIPERBANTUKAN_UPT';
      var kapalText = (a.namaKapal && a.namaKapal !== '-') ? a.namaKapal : (isUpt ? a.pangkalanId : 'Dit. POA Pusat');
      var durasiSub = (a.durasiKapalTeks && a.durasiKapalTeks !== '-') ? ('Durasi: ' + a.durasiKapalTeks) : (isUpt ? 'Diperbantukan UPT' : 'Pusat POA');
      var uptTag = isUpt ? ' <span class="badge badge-neutral" style="font-size:10px; margin-left:4px;">UPT</span>' : '';
      var bstPill = Format.statusBadge(a.bstStatus || 'BELUM_ADA');
      var sizeTag = (a.ukuranBaju || a.ukuranSepatu)
        ? ('<div class="cell-sub mono" style="font-size:10px;">Baju: ' + Format.escape(a.ukuranBaju || '-') + ' · Sepatu: ' + Format.escape(a.ukuranSepatu || '-') + '</div>')
        : '';

      html +=
        '<tr class="clickable" data-id="' + a.pegawaiId + '" style="' + (isNonAktif ? 'opacity:0.75;' : '') + '">' +
          '<td style="text-align:center;" onclick="event.stopPropagation();">' +
            '<input type="checkbox" class="cb-select-awak" data-id="' + a.pegawaiId + '" aria-label="Pilih personil ' + Format.escape(a.nama) + '" ' + (isChecked ? 'checked' : '') + '>' +
          '</td>' +
          '<td>' +
            '<div style="display:flex; align-items:center; gap:10px;">' +
              '<div class="avatar-sm" style="background-color:' + bg + ';">' + inis + '</div>' +
              '<div>' +
                '<div class="cell-primary">' + Format.escape(a.nama) + statusNote + '</div>' +
                '<div class="cell-sub mono">NIP: ' + Format.escape(a.nipDisplay || '-') + '</div>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td data-label="Jabatan">' +
            '<div class="cell-primary">' + Format.escape(a.kelompokJabatan || '-') + '</div>' +
            '<div class="cell-sub">' + Format.escape(klsLabel) + '</div>' +
          '</td>' +
          '<td data-label="Rumpun">' + Format.kelompokBadge(a.rumpun) + '</td>' +
          '<td data-label="Kategori">' +
            '<div class="mono">' + Format.escape(a.kategoriKepegawaian || 'PNS') + '</div>' +
            sizeTag +
          '</td>' +
          '<td data-label="Penempatan">' +
            '<div class="cell-primary" style="font-size:12px;">' + Format.escape(kapalText) + uptTag + '</div>' +
            '<div class="cell-sub mono">' + Format.escape(durasiSub) + '</div>' +
          '</td>' +
          '<td data-label="BST">' + bstPill + '</td>' +
          '<td class="text-center" onclick="event.stopPropagation();">' +
            '<button type="button" class="btn btn-secondary-sm btn-row-detail" data-id="' + a.pegawaiId + '">Buka</button>' +
          '</td>' +
        '</tr>';
    });

    tbody.innerHTML = html;

    // Pasang click + keyboard Enter listener di seluruh baris tabel
    tbody.querySelectorAll('tr[data-id]').forEach(function (tr) {
      var id = tr.getAttribute('data-id');
      tr.onclick = function () {
        openDetailSheet(id);
      };
      ShellUI.bindRowKeyboard(tr, function () {
        openDetailSheet(id);
      });
    });

    // Pasang listener di tombol "Buka"
    tbody.querySelectorAll('.btn-row-detail').forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute('data-id');
        openDetailSheet(id);
      };
    });

    // Pasang listener checkbox
    tbody.querySelectorAll('.cb-select-awak').forEach(function (cb) {
      cb.onchange = function () {
        var id = cb.getAttribute('data-id');
        if (cb.checked) {
          _selectedIds[id] = true;
        } else {
          delete _selectedIds[id];
        }
        _updateBatchButton();
      };
    });
  }

  function _updateBatchButton() {
    var count = Object.keys(_selectedIds).length;
    var btnBatch = document.getElementById('btn-batch-assign');
    var badgeCount = document.getElementById('selected-count-badge');
    if (badgeCount) badgeCount.textContent = count;
    if (btnBatch) {
      if (count > 0) {
        btnBatch.classList.remove('hidden');
      } else {
        btnBatch.classList.add('hidden');
      }
    }
  }

  function openDetailSheet(pegawaiId) {
    var token = AuthApp.getToken();
    if (!token) return;

    Sheet.open('sheet-dir-panel', 'sheet-dir-overlay');
    switchSheetTab('profil');

    var nameEl = document.getElementById('sheet-dir-nama');
    if (nameEl) nameEl.textContent = 'Memuat profil...';

    rpc('dir_getDetail', token, pegawaiId)
      .then(function (res) {
        _currentDetailAwak = res;
        _renderSheetDetail(res);
      })
      .catch(function (err) {
        Toast.error('Gagal memuat detail personil: ' + err.message);
      });
  }

  function _renderSheetDetail(d) {
    if (!d) return;

    var nameEl = document.getElementById('sheet-dir-nama');
    var nipEl = document.getElementById('sheet-dir-nip-display');
    var idEl = document.getElementById('sheet-dir-id-display');
    var avatarEl = document.getElementById('sheet-dir-avatar');
    var badgeRumpun = document.getElementById('sheet-dir-badge-rumpun');
    var badgeKelas = document.getElementById('sheet-dir-badge-kelas');
    var badgeStatus = document.getElementById('sheet-dir-badge-status');
    var jabEl = document.getElementById('sheet-dir-jabatan');
    var katEl = document.getElementById('sheet-dir-kategori');
    var bstEl = document.getElementById('sheet-dir-bst');
    var kapalEl = document.getElementById('sheet-dir-kapal');
    var durasiEl = document.getElementById('sheet-dir-durasi');
    var penempatanEl = document.getElementById('sheet-dir-penempatan');
    var pangkalanEl = document.getElementById('sheet-dir-pangkalan');
    var logistikEl = document.getElementById('sheet-dir-logistik');
    var skEl = document.getElementById('sheet-dir-sk');

    if (nameEl) nameEl.textContent = d.nama || '-';
    if (nipEl) nipEl.textContent = 'NIP: ' + (d.nipDisplay || '-');
    if (idEl) idEl.textContent = 'ID: ' + (d.pegawaiId || '-');
    if (avatarEl) {
      avatarEl.textContent = Format.initials(d.nama);
      avatarEl.style.backgroundColor = Format.avatarBg(d.nama);
    }
    if (badgeRumpun) badgeRumpun.textContent = d.rumpun || 'Dek';
    if (badgeKelas) badgeKelas.textContent = String(d.kelasKapal || 'Kelas II').replace('_', ' ');
    if (badgeStatus) {
      badgeStatus.textContent = d.statusAktif || 'Aktif';
      badgeStatus.className = d.statusAktif === 'NONAKTIF' ? 'pill pill-negative' : 'pill pill-positive';
    }
    if (jabEl) jabEl.textContent = d.kelompokJabatan || '-';
    if (katEl) katEl.textContent = d.kategoriKepegawaian || 'Belum ditentukan';
    if (bstEl) bstEl.innerHTML = Format.statusBadge(d.bstStatus || 'BELUM_ADA');
    if (kapalEl) kapalEl.textContent = d.namaKapal || d.kapalId || 'Belum ada penempatan';
    if (durasiEl) durasiEl.textContent = d.durasiKapalTeks || '-';
    if (penempatanEl) {
      penempatanEl.textContent = d.statusPenempatan === 'DIPERBANTUKAN_UPT'
        ? 'AKP Pusat Diperbantukan di UPT'
        : 'Organik Dit. POA Pusat';
    }
    if (pangkalanEl) pangkalanEl.textContent = d.pangkalanId || 'Pusat (Dit. POA)';
    if (logistikEl) {
      logistikEl.textContent = 'Baju: ' + (d.ukuranBaju || '-') + ' · Sepatu: ' + (d.ukuranSepatu || '-');
    }
    if (skEl) {
      if (d.dokumenPenempatanUrl) {
        skEl.innerHTML = '<a href="' + Format.escape(d.dokumenPenempatanUrl) + '" target="_blank" rel="noopener noreferrer" style="color:var(--accent);">' + Format.escape(d.nomorSkPenempatan || 'Lihat SK / Surat Tugas') + '</a>';
      } else {
        skEl.textContent = d.nomorSkPenempatan || 'Belum diunggah (opsional)';
      }
    }

    // Render daftar sertifikat di Tab 2
    var certListEl = document.getElementById('sheet-dir-sertifikat-list');
    if (certListEl) {
      var certs = d.sertifikat || [];
      if (certs.length === 0) {
        certListEl.innerHTML = '<div style="padding:18px; text-align:center; color:var(--muted); font-size:12px;">Belum ada sertifikat kepelautan tercatat.</div>';
      } else {
        certListEl.innerHTML = certs.map(function (s) {
          return (
            '<div style="padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-control); background-color:var(--ground);">' +
              '<div style="font-size:13px; font-weight:500; color:var(--text);">' + Format.escape(s.namaPelatihan) + '</div>' +
              '<div class="mono" style="font-size:11px; color:var(--muted); margin-top:2px;">No: ' + Format.escape(s.nomorSertifikat) + '</div>' +
              '<div style="font-size:11px; color:var(--muted); margin-top:2px;">Berlaku s.d: ' + (s.berlakuSampai ? Format.date(s.berlakuSampai) : 'Permanen') + '</div>' +
            '</div>'
          );
        }).join('');
      }
    }

    // Render riwayat penugasan di Tab 3
    var tgsListEl = document.getElementById('sheet-dir-penugasan-list');
    if (tgsListEl) {
      var penugasan = d.penugasan || [];
      if (penugasan.length === 0) {
        tgsListEl.innerHTML = '<div style="padding:18px; text-align:center; color:var(--muted); font-size:12px;">Belum ada riwayat penugasan kapal.</div>';
      } else {
        tgsListEl.innerHTML = penugasan.map(function (t) {
          return (
            '<div style="padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-control); background-color:var(--ground);">' +
              '<div style="font-size:13px; font-weight:500; color:var(--text);">' + Format.escape(t.kapalId) + ' — ' + Format.escape(t.posSijil) + '</div>' +
              '<div class="mono" style="font-size:11px; color:var(--muted); margin-top:2px;">Naik: ' + Format.date(t.tanggalNaik) + (t.tanggalTurun ? ' · Turun: ' + Format.date(t.tanggalTurun) : ' (Aktif)') + '</div>' +
            '</div>'
          );
        }).join('');
      }
    }
  }

  function switchSheetTab(tab) {
    ['profil', 'sertifikat', 'penugasan'].forEach(function (t) {
      var btn = document.getElementById('tab-dir-btn-' + t);
      var panel = document.getElementById('sheet-tab-' + t);
      if (btn) {
        if (t === tab) btn.classList.add('active');
        else btn.classList.remove('active');
      }
      if (panel) {
        if (t === tab) panel.classList.remove('hidden');
        else panel.classList.add('hidden');
      }
    });
  }

  function openCatatSertifikatFromSheet() {
    if (!_currentDetailAwak) return;
    Sheet.close('sheet-dir-panel', 'sheet-dir-overlay');
    Router.navigate('kompetensi');
    if (typeof KompetensiView !== 'undefined' && KompetensiView.openModalCatat) {
      KompetensiView.openModalCatat(_currentDetailAwak.pegawaiId, _currentDetailAwak.nama);
    }
  }

  function openAssignSijilFromSheet() {
    if (!_currentDetailAwak) return;
    var target = { pegawaiId: _currentDetailAwak.pegawaiId, nama: _currentDetailAwak.nama };
    Sheet.close('sheet-dir-panel', 'sheet-dir-overlay');
    Router.navigate('sijil', { openAssignPegawai: target });
  }

  function sanitizeNamaInput(inp) {
    if (!inp) return;
    var clean = String(inp.value || '').toUpperCase().replace(/['’`´]/g, '').replace(/[^A-Z\s]/g, '').replace(/\s{2,}/g, ' ');
    if (inp.value !== clean) inp.value = clean;
  }

  function syncKategoriRules() {
    var katEl = document.getElementById('awak-input-kategori');
    var nipEl = document.getElementById('awak-input-nip');
    var nipLbl = document.getElementById('awak-nip-label');
    var nipHint = document.getElementById('awak-nip-hint');
    if (!katEl || !nipEl) return;

    var isPjlp = katEl.value === 'PJLP';
    if (isPjlp) {
      nipEl.value = '';
      nipEl.disabled = true;
      nipEl.required = false;
      nipEl.placeholder = 'Tidak wajib (PJLP tidak memiliki NIP)';
      if (nipLbl) nipLbl.textContent = 'NIP (Tidak wajib untuk PJLP)';
      if (nipHint) nipHint.textContent = 'Personel PJLP tidak memiliki NIP — input dinonaktifkan.';
    } else {
      nipEl.disabled = false;
      nipEl.required = true;
      nipEl.placeholder = '19xxxxxxxxxxxxxxxx';
      if (nipLbl) nipLbl.textContent = 'NIP (Wajib 18 digit angka)';
      if (nipHint) nipHint.textContent = 'Wajib tepat 18 digit angka untuk kategori PNS, P3K, dan P3K Paruh Waktu.';
    }
  }

  function autoMatchRumpun() {
    var kelEl = document.getElementById('awak-input-kelompok');
    var rmpEl = document.getElementById('awak-input-rumpun');
    if (!kelEl || !rmpEl) return;
    var val = String(kelEl.value || '').toUpperCase();
    if (/MASAK|KOKI/.test(val)) rmpEl.value = 'PENUNJANG';
    else if (/MESIN|KKM|MASINIS|MINYAK|OILER/.test(val)) rmpEl.value = 'MESIN';
    else rmpEl.value = 'DEK';
  }

  function _openFormModal(awakObj) {
    _skFileData = null;
    var titleEl = document.getElementById('modal-awak-title');
    var idInp = document.getElementById('awak-input-id');
    var namaInp = document.getElementById('awak-input-nama');
    var nipInp = document.getElementById('awak-input-nip');
    var kelInp = document.getElementById('awak-input-kelompok');
    var rmpInp = document.getElementById('awak-input-rumpun');
    var klsInp = document.getElementById('awak-input-kelas');
    var katInp = document.getElementById('awak-input-kategori');
    var statusInp = document.getElementById('awak-input-status-aktif');
    var penempatanInp = document.getElementById('awak-input-status-penempatan');
    var pangkalanInp = document.getElementById('awak-input-pangkalan');
    var tglMulaiInp = document.getElementById('awak-input-tgl-mulai');
    var tglSelesaiInp = document.getElementById('awak-input-tgl-selesai');
    var bajuInp = document.getElementById('awak-input-ukuran-baju');
    var sepatuInp = document.getElementById('awak-input-ukuran-sepatu');
    var noSkInp = document.getElementById('awak-input-no-sk');
    var fileSkInp = document.getElementById('awak-input-file-sk');
    var fileSkSt = document.getElementById('awak-file-sk-status');

    if (fileSkInp) fileSkInp.value = '';
    if (fileSkSt) fileSkSt.textContent = 'Format PDF, JPG, atau PNG maks 15 MB.';

    if (awakObj) {
      if (titleEl) titleEl.textContent = 'Edit profil awak kapal';
      if (idInp) idInp.value = awakObj.pegawaiId || '';
      if (namaInp) namaInp.value = awakObj.nama || '';
      if (nipInp) nipInp.value = (awakObj.nipRaw && awakObj.nipRaw !== '-') ? awakObj.nipRaw : '';
      if (kelInp) kelInp.value = awakObj.kelompokJabatan || 'Juru Mudi';
      if (rmpInp) rmpInp.value = awakObj.rumpun || 'DEK';
      if (klsInp) klsInp.value = awakObj.kelasKapal || 'KELAS_II';
      if (katInp) katInp.value = awakObj.kategoriKepegawaian || 'PNS';
      if (statusInp) statusInp.value = awakObj.statusAktif || 'AKTIF';
      if (penempatanInp) penempatanInp.value = awakObj.statusPenempatan || 'PUSAT_POA';
      if (pangkalanInp) pangkalanInp.value = awakObj.pangkalanId || '';
      if (tglMulaiInp) tglMulaiInp.value = awakObj.tanggalMulaiKerja || '';
      if (tglSelesaiInp) tglSelesaiInp.value = awakObj.tanggalSelesaiKontrak || '';
      if (bajuInp) bajuInp.value = awakObj.ukuranBaju || '';
      if (sepatuInp) sepatuInp.value = awakObj.ukuranSepatu || '';
      if (noSkInp) noSkInp.value = awakObj.nomorSkPenempatan || '';
    } else {
      if (titleEl) titleEl.textContent = 'Tambah personil baru';
      if (idInp) idInp.value = '';
      if (namaInp) namaInp.value = '';
      if (nipInp) nipInp.value = '';
      if (kelInp) kelInp.value = 'Juru Mudi';
      if (rmpInp) rmpInp.value = 'DEK';
      if (klsInp) klsInp.value = 'KELAS_II';
      if (katInp) katInp.value = 'PNS';
      if (statusInp) statusInp.value = 'AKTIF';
      if (penempatanInp) penempatanInp.value = 'PUSAT_POA';
      if (pangkalanInp) pangkalanInp.value = '';
      if (tglMulaiInp) tglMulaiInp.value = '';
      if (tglSelesaiInp) tglSelesaiInp.value = '';
      if (bajuInp) bajuInp.value = '';
      if (sepatuInp) sepatuInp.value = '';
      if (noSkInp) noSkInp.value = '';
    }

    syncKategoriRules();
    Modal.open('modal-dir-awak');
  }

  function _submitFormAwak() {
    var token = AuthApp.getToken();
    var namaInp = document.getElementById('awak-input-nama');
    sanitizeNamaInput(namaInp);
    var namaVal = (namaInp ? namaInp.value : '').trim();
    var katVal = document.getElementById('awak-input-kategori').value;
    var nipVal = (document.getElementById('awak-input-nip').value || '').replace(/[^0-9]/g, '');

    if (!namaVal || !/^[A-Z ]+$/.test(namaVal)) {
      Toast.error('Nama lengkap wajib HURUF BESAR (A-Z) tanpa gelar, simbol, atau angka.');
      return;
    }
    if (katVal !== 'PJLP' && !/^\d{18}$/.test(nipVal)) {
      Toast.error('NIP wajib diisi 18 digit angka untuk kategori PNS, P3K, dan P3K Paruh Waktu.');
      return;
    }

    var payload = {
      token: token,
      pegawaiId: document.getElementById('awak-input-id').value.trim(),
      nama: namaVal,
      nip: katVal === 'PJLP' ? '' : nipVal,
      kelompokJabatan: document.getElementById('awak-input-kelompok').value,
      rumpun: document.getElementById('awak-input-rumpun').value,
      kelasKapal: document.getElementById('awak-input-kelas').value,
      kategoriKepegawaian: katVal,
      statusAktif: document.getElementById('awak-input-status-aktif').value,
      statusPenempatan: document.getElementById('awak-input-status-penempatan').value,
      pangkalanId: document.getElementById('awak-input-pangkalan').value.trim(),
      tanggalMulaiKerja: document.getElementById('awak-input-tgl-mulai').value,
      tanggalSelesaiKontrak: document.getElementById('awak-input-tgl-selesai').value,
      ukuranBaju: document.getElementById('awak-input-ukuran-baju').value,
      ukuranSepatu: document.getElementById('awak-input-ukuran-sepatu').value,
      nomorSkPenempatan: document.getElementById('awak-input-no-sk').value.trim(),
      fileData: _skFileData
    };

    var btnSubmit = document.getElementById('btn-submit-awak');
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Menyimpan...';
    }

    rpc('dir_save', payload)
      .then(function (res) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Simpan profil personil';
        }
        Modal.close('modal-dir-awak');
        Toast.success(res.message || 'Profil personil berhasil disimpan.');
        load(_offset);
        if (_currentDetailAwak && _currentDetailAwak.pegawaiId === payload.pegawaiId) {
          openDetailSheet(payload.pegawaiId);
        }
      })
      .catch(function (err) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Simpan profil personil';
        }
        Toast.error('Gagal menyimpan profil: ' + err.message);
      });
  }

  function _openBatchModal() {
    var count = Object.keys(_selectedIds).length;
    var countEl = document.getElementById('modal-batch-count');
    if (countEl) countEl.textContent = count;
    Modal.open('modal-dir-batch');
  }

  function _submitBatch() {
    var token = AuthApp.getToken();
    var ids = Object.keys(_selectedIds);
    var kat = document.getElementById('batch-input-kategori').value;

    var btnSubmit = document.getElementById('btn-submit-batch');
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Menerapkan...';
    }

    rpc('dir_batchAssign', {
      token: token,
      pegawaiIds: ids,
      kategoriKepegawaian: kat
    })
      .then(function (res) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Terapkan kategori';
        }
        Modal.close('modal-dir-batch');
        Toast.success(res.message || 'Kategori berhasil diperbarui.');
        _selectedIds = {};
        _updateBatchButton();
        load(_offset);
      })
      .catch(function (err) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Terapkan kategori';
        }
        Toast.error('Gagal memperbarui kategori massal: ' + err.message);
      });
  }

  function _syncSikap() {
    var token = AuthApp.getToken();
    if (!token) return;

    if (!confirm('Lakukan sinkronisasi data master aparatur dan sertifikasi dengan sistem SIKAP Ditjen PSDKP?\n\nProses ini akan memperbarui data demografis personil, mengimpor awak baru, dan menyinkronkan rekaman sertifikat kepelautan/diklat ke register kompetensi Nakhoda.')) {
      return;
    }

    var btn = document.getElementById('btn-sync-sikap');
    var origHtml = btn ? btn.innerHTML : '';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span>Sinkronisasi...</span>';
    }

    rpc('dir_syncSikap', { token: token })
      .then(function (res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = origHtml;
        }
        var d = res || {};
        var msg = 'Sinkronisasi SIKAP selesai: ' + (d.updated || 0) + ' dimutakhirkan, ' + (d.added || 0) + ' awak baru diimpor.';
        if (d.sertifikatSynced) {
          msg += ' (' + d.sertifikatSynced + ' sertifikat terbarui)';
        }
        var totalNonaktif = (d.deactivatedCount || 0) + (d.missingCount || 0);
        if (totalNonaktif > 0 || (d.onboardConflicts && d.onboardConflicts.length > 0)) {
          var warnMsg = msg + ' Peringatan: ' + totalNonaktif + ' personil dinonaktifkan/tidak lagi terdaftar di SIKAP';
          if (d.onboardConflicts && d.onboardConflicts.length > 0) {
            warnMsg += ' dan ' + d.onboardConflicts.length + ' di antaranya masih aktif di formasi kapal (perlu diturunkan dari Papan Sijil)';
          }
          Toast.error(warnMsg + '.');
        } else {
          Toast.success(msg);
        }
        load(_offset);
      })
      .catch(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = origHtml;
        }
        Toast.error('Gagal sinkronisasi SIKAP: ' + (err.message || err));
      });
  }

  return {
    init: init,
    load: load,
    resetFilters: resetFilters,
    sanitizeNamaInput: sanitizeNamaInput,
    syncKategoriRules: syncKategoriRules,
    autoMatchRumpun: autoMatchRumpun,
    openDetailSheet: openDetailSheet,
    switchSheetTab: switchSheetTab,
    openCatatSertifikatFromSheet: openCatatSertifikatFromSheet,
    openAssignSijilFromSheet: openAssignSijilFromSheet
  };
})();
</script>
