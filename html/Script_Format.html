<script>
/**
 * html/Script_Format.html
 * Utilitas pemformatan teks, angka tabular, tanggal Indonesia, avatar pastel, dan pil status.
 * Memenuhi spesifikasi DESIGN.md: Achromatic Ledger, tabular-nums, zero-emoji.
 */
var Format = (function () {
  'use strict';

  var BULAN_ID = [
    'Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun',
    'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'
  ];

  var BULAN_LENGKAP_ID = [
    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
  ];

  function escape(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function number(val) {
    if (val === null || val === undefined || val === '') return '0';
    var n = Number(val);
    if (isNaN(n)) return '0';
    return n.toLocaleString('id-ID');
  }

  function currency(val) {
    if (val === null || val === undefined || val === '') return 'Rp 0';
    var n = Number(val);
    if (isNaN(n)) return 'Rp 0';
    return 'Rp ' + n.toLocaleString('id-ID');
  }

  function _parseDate(d) {
    if (!d) return null;
    if (d instanceof Date) return isNaN(d.getTime()) ? null : d;
    var s = String(d).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
      var parts = s.split('-');
      return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    }
    var parsed = new Date(s);
    return isNaN(parsed.getTime()) ? null : parsed;
  }

  function date(val) {
    var d = _parseDate(val);
    if (!d) return '-';
    var day = d.getDate();
    var month = BULAN_ID[d.getMonth()];
    var year = d.getFullYear();
    return (day < 10 ? '0' + day : day) + ' ' + month + ' ' + year;
  }

  function dateLong(val) {
    var d = _parseDate(val);
    if (!d) return '-';
    var day = d.getDate();
    var month = BULAN_LENGKAP_ID[d.getMonth()];
    var year = d.getFullYear();
    return day + ' ' + month + ' ' + year;
  }

  function dateTime(val) {
    var d = _parseDate(val);
    if (!d) return '-';
    var dt = date(d);
    var h = d.getHours();
    var m = d.getMinutes();
    var hh = h < 10 ? '0' + h : h;
    var mm = m < 10 ? '0' + m : m;
    return dt + ', ' + hh + ':' + mm + ' WIB';
  }

  function initials(name) {
    if (!name) return '--';
    var parts = String(name).trim().split(/\s+/);
    if (parts.length === 1) {
      return parts[0].substring(0, 2).toUpperCase();
    }
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  /**
   * 6 rona lembut deterministik (DESIGN.md §10.2: L=0.90, C=0.04 dengan teks gelap).
   */
  function avatarBg(name) {
    if (!name) return '#E6E9EC';
    var hash = 0;
    var str = String(name);
    for (var i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    var pastels = [
      '#FCE8DF', // Warm Peach (Safety Orange Tint)
      '#E2F2E8', // Sage Mist
      '#E6EBF2', // Cool Slate Tint
      '#F5EBD6', // Warm Sand
      '#ECE6F4', // Soft Lavender
      '#E1EFEF'  // Seafoam Mist
    ];
    return pastels[Math.abs(hash) % pastels.length];
  }

  /**
   * Pil status dengan titik 6px (DESIGN.md §5.6).
   */
  function statusBadge(status) {
    var s = String(status || '').toUpperCase().trim();
    var pillClass = 'pill-neutral';
    var label = s || 'Draft';

    switch (s) {
      case 'ACTIVE':
      case 'AKTIF':
      case 'APPROVED':
      case 'BERLAKU':
      case 'SELESAI':
      case 'LENGKAP':
      case 'LAIK_OPERASI':
        pillClass = 'pill-positive';
        if (s === 'ACTIVE' || s === 'AKTIF') label = 'Aktif';
        else if (s === 'APPROVED') label = 'Disetujui';
        else if (s === 'BERLAKU') label = 'Berlaku';
        else if (s === 'LENGKAP') label = 'Lengkap';
        else if (s === 'LAIK_OPERASI') label = 'Laik operasi';
        else label = 'Selesai';
        break;

      case 'PENDING':
      case 'SEGERA_HABIS':
      case 'PROSES':
      case 'MENUNGGU':
      case 'PERLU_DILENGKAPI':
        pillClass = 'pill-warning';
        if (s === 'PENDING' || s === 'MENUNGGU') label = 'Menunggu';
        else if (s === 'SEGERA_HABIS') label = 'Segera habis';
        else if (s === 'PERLU_DILENGKAPI') label = 'Perlu dilengkapi';
        else label = 'Proses';
        break;

      case 'REJECTED':
      case 'KEDALUWARSA':
      case 'VOID':
      case 'NONAKTIF':
      case 'BELUM_LENGKAP':
      case 'KURANG_AWAK':
        pillClass = 'pill-negative';
        if (s === 'REJECTED') label = 'Ditolak';
        else if (s === 'KEDALUWARSA') label = 'Kedaluwarsa';
        else if (s === 'VOID') label = 'Dianulir';
        else if (s === 'NONAKTIF') label = 'Nonaktif';
        else if (s === 'KURANG_AWAK') label = 'Kurang awak';
        else label = 'Belum lengkap';
        break;

      case 'SUPERSEDED':
        pillClass = 'pill-neutral';
        label = 'Direvisi';
        break;

      default:
        pillClass = 'pill-neutral';
        label = s ? (s.charAt(0) + s.slice(1).toLowerCase().replace(/_/g, ' ')) : '-';
        break;
    }

    return '<span class="pill ' + pillClass + '"><span class="pill-dot"></span>' + escape(label) + '</span>';
  }

  function kelompokBadge(kelompok) {
    var k = String(kelompok || '').toUpperCase().trim();
    if (k.indexOf('AWAK_') === 0) k = k.substring(5);
    var cls = k === 'DEK' ? 'badge-accent' : 'badge-neutral';
    var lbl = k === 'DEK' ? 'Dek' : (k === 'MESIN' ? 'Mesin' : (k || '-'));
    return '<span class="pill ' + cls + '">' + escape(lbl) + '</span>';
  }

  function deltaText(delta, suffix) {
    var d = parseInt(delta, 10) || 0;
    var sfx = suffix ? ' ' + suffix : '';
    if (d > 0) return '<span class="delta-up">+' + number(d) + sfx + '</span>';
    if (d < 0) return '<span class="delta-down">' + number(d) + sfx + '</span>';
    return '<span style="color:var(--muted);">0' + sfx + '</span>';
  }

  function safe(val, fallback) {
    if (val === null || val === undefined || String(val).trim() === '') {
      return fallback !== undefined ? fallback : '-';
    }
    return escape(String(val));
  }

  return {
    escape: escape,
    number: number,
    currency: currency,
    date: date,
    dateLong: dateLong,
    dateTime: dateTime,
    initials: initials,
    avatarBg: avatarBg,
    statusBadge: statusBadge,
    kelompokBadge: kelompokBadge,
    deltaText: deltaText,
    safe: safe
  };
})();
</script>
