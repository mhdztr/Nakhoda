<script>
/**
 * html/Script_Sijil.html
 * Controller Klien Sub-Modul E: Penugasan Kapal & Matriks Papan Sijil 2D Safe Manning (DESIGN.md §8.1).
 * Nakhoda — Timja Pengawakan Dit. POA KKP RI
 */
var SijilView = (function () {
  'use strict';

  var _currentKapalId = '';
  var _data = null;
  var _eventsBound = false;

  var KELAS_GROUPS = [
    { key: 'KELAS_I', label: 'Kapal Pengawas Kelas I (Panjang > 60 meter / ZEE)' },
    { key: 'KELAS_II', label: 'Kapal Pengawas Kelas II (Panjang 40 - 60 meter)' },
    { key: 'KELAS_III', label: 'Kapal Pengawas Kelas III (Panjang 28 - 40 meter)' },
    { key: 'KELAS_IV', label: 'Kapal Pengawas Kelas IV (Panjang 18 - 28 meter)' },
    { key: 'KELAS_V', label: 'Speedboat Pengawas Kelas V (Reaksi Cepat)' }
  ];

  function init() {
    _bindEvents();
    load();
  }

  function _bindEvents() {
    if (_eventsBound) return;
    _eventsBound = true;

    var btnRefresh = document.getElementById('btn-sijil-refresh');
    var filterKelas = document.getElementById('sijil-filter-kelas');
    var filterStatus = document.getElementById('sijil-filter-status');
    var searchInput = document.getElementById('sijil-search-input');
    var btnSearch = document.getElementById('btn-sijil-search');
    var btnQuickAssign = document.getElementById('btn-sijil-quick-assign');
    var btnSheetAdd = document.getElementById('btn-sheet-add-awak');
    var formAssign = document.getElementById('form-sijil-assign');

    if (btnRefresh) {
      btnRefresh.onclick = function () { load(); };
    }
    if (filterKelas) filterKelas.onchange = function () { _renderMatrixTable(); };
    if (filterStatus) filterStatus.onchange = function () { _renderMatrixTable(); };
    if (btnSearch) btnSearch.onclick = function () { _renderMatrixTable(); };
    if (searchInput) {
      searchInput.onkeydown = function (e) {
        if (e.key === 'Enter') _renderMatrixTable();
      };
    }

    if (btnQuickAssign) {
      btnQuickAssign.onclick = function () {
        openAssignModal('');
      };
    }

    if (btnSheetAdd) {
      btnSheetAdd.onclick = function () {
        openAssignModal(_currentKapalId);
      };
    }

    if (formAssign) {
      formAssign.onsubmit = function (e) {
        e.preventDefault();
        _submitAssign();
      };
    }
  }

  function load() {
    var token = AuthApp.getToken();
    if (!token) return;

    rpc('sijil_getPapanArmada', token)
      .then(function (res) {
        _data = res;

        // 1. Update KPI Strip
        var mTot = document.getElementById('metric-sijil-total-kapal');
        var mLaik = document.getElementById('metric-sijil-laik');
        var mKur = document.getElementById('metric-sijil-kurang');
        var mDef = document.getElementById('metric-sijil-defisit-kursi');
        var mKurSub = document.getElementById('metric-sijil-kurang-sub');
        var mAwakSub = document.getElementById('metric-sijil-awak-laut-sub');
        var findingEl = document.getElementById('sijil-finding-sub');

        var totKapal = res.metrics.totalKapal || 0;
        var laik = res.metrics.laikOperasi || 0;
        var kurang = res.metrics.kurangAwak || 0;
        var defisit = res.metrics.totalKekuranganKursi || 0;
        var bertugas = res.metrics.totalAwakBertugas || 0;

        if (mTot) mTot.textContent = Format.number(totKapal);
        if (mLaik) mLaik.textContent = Format.number(laik);
        if (mKur) mKur.textContent = Format.number(kurang);
        if (mDef) mDef.textContent = Format.number(defisit);

        if (mKurSub) {
          mKurSub.textContent = kurang > 0 ? (res.metrics.kritis + ' kapal berstatus kritis <= -2') : 'Seluruh kapal siap operasi';
        }
        if (mAwakSub) {
          mAwakSub.textContent = 'Awak bertugas di laut: ' + Format.number(bertugas) + ' personil';
        }

        if (findingEl) {
          findingEl.textContent = kurang > 0
            ? ('Terdapat ' + kurang + ' kapal pengawas dengan kekurangan formasi (' + defisit + ' kursi kosong dari standar Safe Manning Kepmen KP); ' + laik + ' kapal memenuhi formasi siap laik operasi.')
            : ('Seluruh ' + totKapal + ' kapal pengawas armada Ditjen PSDKP memenuhi standar formasi Safe Manning Kepmen KP.');
        }

        // 2. Render Matriks 2D Table
        _renderMatrixTable();
      })
      .catch(function (err) {
        Toast.error('Gagal memuat papan sijil armada: ' + err.message);
      });
  }

  function _renderDevCell(colObj) {
    if (!colObj) {
      return '<span class="sijil-cell sijil-cell-na mono">-</span>';
    }
    var min = colObj.min !== undefined ? colObj.min : colObj.req;
    if (min === 0) {
      return '<span class="sijil-cell sijil-cell-na mono">-</span>';
    }
    var sel = colObj.selisih !== undefined ? colObj.selisih : (colObj.dev !== undefined ? colObj.dev : 0);
    if (sel <= -2) {
      return '<span class="sijil-cell sijil-cell-crit mono">' + sel + '</span>';
    } else if (sel === -1) {
      return '<span class="sijil-cell sijil-cell-warn mono">-1</span>';
    } else if (sel > 0) {
      return '<span class="sijil-cell sijil-cell-plus mono">+' + sel + '</span>';
    } else {
      return '<span class="sijil-cell sijil-cell-ok mono">0</span>';
    }
  }

  function _renderMatrixTable() {
    if (!_data || !_data.kapal) return;

    var tbody = document.getElementById('sijil-2d-matrix-tbody');
    if (!tbody) return;

    var filterKls = (document.getElementById('sijil-filter-kelas') || {}).value || '';
    var filterSts = (document.getElementById('sijil-filter-status') || {}).value || '';
    var searchStr = (document.getElementById('sijil-search-input') || {}).value || '';
    searchStr = searchStr.toLowerCase().trim();

    var filtered = _data.kapal.filter(function (k) {
      if (filterKls && k.kelasKapal !== filterKls) return false;
      if (filterSts && k.statusOperasi !== filterSts) return false;
      if (searchStr) {
        var n = k.namaKapal.toLowerCase();
        var p = k.pangkalanId.toLowerCase();
        if (n.indexOf(searchStr) === -1 && p.indexOf(searchStr) === -1) return false;
      }
      return true;
    });

    var countInfo = document.getElementById('sijil-total-matched');
    if (countInfo) countInfo.textContent = filtered.length + ' kapal cocok';

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="14" style="text-align:center; padding:32px 0; color:var(--muted);">Tidak ada kapal pengawas yang cocok dengan kriteria pencarian.</td></tr>';
      return;
    }

    function _normKelasKey(val) {
      var s = String(val || '').toUpperCase().replace(/[\s-]+/g, '_');
      if (s === 'KELAS_1') s = 'KELAS_I';
      if (s === 'KELAS_2') s = 'KELAS_II';
      if (s === 'KELAS_3') s = 'KELAS_III';
      if (s === 'KELAS_4') s = 'KELAS_IV';
      if (s === 'KELAS_5') s = 'KELAS_V';
      return s;
    }

    var html = '';
    var handledIds = {};

    // Kelompokkan baris berdasarkan Kelas I–V
    KELAS_GROUPS.forEach(function (grp) {
      var inGroup = filtered.filter(function (k) { return _normKelasKey(k.kelasKapal) === grp.key; });
      if (inGroup.length === 0) return;

      html +=
        '<tr class="sijil-group-row">' +
          '<td colspan="14">' + Format.escape(grp.label) + ' (' + inGroup.length + ' kapal)</td>' +
        '</tr>';

      inGroup.forEach(function (k) {
        handledIds[k.kapalId] = true;
        var mCols = k.matrixCols || k.positions || {};
        var defisitHtml = (k.kekuranganKursi > 0)
          ? '<span class="delta-down mono">-' + k.kekuranganKursi + '</span>'
          : '<span style="color:var(--muted);" class="mono">0</span>';

        html +=
          '<tr class="clickable" data-id="' + k.kapalId + '">' +
            '<td>' +
              '<div class="cell-primary">' + Format.escape(k.namaKapal) + '</div>' +
              '<div class="cell-sub mono">' + k.kapalId + '</div>' +
            '</td>' +
            '<td style="color:var(--muted); font-size:12px;">' + Format.escape(k.pangkalanId) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.nakhoda) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.mualim) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.kkm) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.masinis) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.markonis) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.serang) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.juruMudi) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.kelasi) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.juruMinyak) + '</td>' +
            '<td class="text-right mono tnum">' + k.jumlahAwakBertugas + ' / ' + k.kebutuhanMinimum + '</td>' +
            '<td class="text-right">' + defisitHtml + '</td>' +
            '<td class="text-center">' + Format.statusBadge(k.statusOperasi) + '</td>' +
          '</tr>';
      });
    });

    // Baris sisa (jika ada kapal yang belum masuk grup di atas)
    var remaining = filtered.filter(function (k) { return !handledIds[k.kapalId]; });
    if (remaining.length > 0) {
      html += '<tr class="sijil-group-row"><td colspan="14">Armada Kapal Lainnya (' + remaining.length + ' kapal)</td></tr>';
      remaining.forEach(function (k) {
        var mCols = k.matrixCols || k.positions || {};
        var defisitHtml = (k.kekuranganKursi > 0)
          ? '<span class="delta-down mono">-' + k.kekuranganKursi + '</span>'
          : '<span style="color:var(--muted);" class="mono">0</span>';

        html +=
          '<tr class="clickable" data-id="' + k.kapalId + '">' +
            '<td>' +
              '<div class="cell-primary">' + Format.escape(k.namaKapal) + '</div>' +
              '<div class="cell-sub mono">' + k.kapalId + '</div>' +
            '</td>' +
            '<td style="color:var(--muted); font-size:12px;">' + Format.escape(k.pangkalanId) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.nakhoda) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.mualim) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.kkm) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.masinis) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.markonis) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.serang) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.juruMudi) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.kelasi) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.juruMinyak) + '</td>' +
            '<td class="text-right mono tnum">' + k.jumlahAwakBertugas + ' / ' + k.kebutuhanMinimum + '</td>' +
            '<td class="text-right">' + defisitHtml + '</td>' +
            '<td class="text-center">' + Format.statusBadge(k.statusOperasi) + '</td>' +
          '</tr>';
      });
    }

    tbody.innerHTML = html;

    // Pasang click listener di seluruh baris tabel
    tbody.querySelectorAll('tr.clickable[data-id]').forEach(function (tr) {
      tr.onclick = function () {
        var id = tr.getAttribute('data-id');
        openKapalSheet(id);
      };
    });
  }

  function openKapalSheet(kapalId) {
    var token = AuthApp.getToken();
    if (!token) return;

    _currentKapalId = kapalId;
    Sheet.open('sheet-sijil-panel', 'sheet-sijil-overlay');

    var nameEl = document.getElementById('sheet-sijil-nama-kapal');
    if (nameEl) nameEl.textContent = 'Memuat formasi ' + kapalId + '...';

    rpc('sijil_getDetailKapal', token, kapalId)
      .then(function (res) {
        _renderSheetDetail(res);
      })
      .catch(function (err) {
        Toast.error('Gagal memuat detail kapal: ' + err.message);
      });
  }

  function _renderSheetDetail(d) {
    if (!d) return;

    var nameEl = document.getElementById('sheet-sijil-nama-kapal');
    var badgeKelas = document.getElementById('sheet-sijil-badge-kelas');
    var statusBadge = document.getElementById('sheet-sijil-status-badge');
    var pangkalanEl = document.getElementById('sheet-sijil-pangkalan');
    var ratioText = document.getElementById('sheet-sijil-ratio-text');
    var ratioBar = document.getElementById('sheet-sijil-ratio-bar');
    var listAwak = document.getElementById('sheet-sijil-awak-list');
    var tbodyManning = document.getElementById('sheet-sijil-manning-tbody');

    if (nameEl) nameEl.textContent = d.namaKapal || d.kapalId;
    if (badgeKelas) badgeKelas.textContent = String(d.kelasKapal || 'Kelas II').replace(/_/g, ' ');
    if (statusBadge) {
      var isLaik = d.evaluasi.isLaikOperasi;
      statusBadge.textContent = isLaik ? 'Siap laik operasi' : 'Kurang awak';
      statusBadge.className = isLaik ? 'pill pill-positive' : 'pill pill-negative';
    }
    if (pangkalanEl) pangkalanEl.textContent = d.pangkalanId || '-';

    var terisi = d.evaluasi.totalTerisi || 0;
    var butuh = d.evaluasi.totalKebutuhan || 0;
    var pct = butuh > 0 ? Math.round((terisi / butuh) * 100) : 100;

    if (ratioText) ratioText.textContent = terisi + ' / ' + butuh + ' (' + pct + '%)';
    if (ratioBar) ratioBar.style.width = Math.min(100, pct) + '%';

    // 1. Render Daftar Awak Aktif Naik Kapal
    if (listAwak) {
      var awakList = d.awakBertugas || [];
      if (awakList.length === 0) {
        listAwak.innerHTML = '<div style="padding:18px; text-align:center; color:var(--muted); font-size:12px;">Belum ada awak bertugas di kapal ini.</div>';
      } else {
        listAwak.innerHTML = awakList.map(function (a) {
          var bg = Format.avatarBg(a.nama);
          var inis = Format.initials(a.nama);
          var posLabel = String(a.posSijil || '').replace(/_/g, ' ');

          return (
            '<div style="padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-control); background-color:var(--surface); display:flex; justify-content:space-between; align-items:center;">' +
              '<div style="display:flex; align-items:center; gap:10px;">' +
                '<div class="avatar-sm" style="background-color:' + bg + ';">' + inis + '</div>' +
                '<div>' +
                  '<div class="cell-primary">' + Format.escape(a.nama) + '</div>' +
                  '<div class="cell-sub"><strong style="color:var(--accent);">' + Format.escape(posLabel) + '</strong> · Naik: ' + Format.date(a.tanggalNaik) + '</div>' +
                '</div>' +
              '</div>' +
              '<button type="button" class="btn btn-danger-sm btn-unassign" data-row="' + a.rowId + '" data-peg="' + a.pegawaiId + '" data-nama="' + Format.escape(a.nama) + '">Turunkan</button>' +
            '</div>'
          );
        }).join('');

        listAwak.querySelectorAll('.btn-unassign').forEach(function (btn) {
          btn.onclick = function () {
            var rId = btn.getAttribute('data-row');
            var pId = btn.getAttribute('data-peg');
            var nama = btn.getAttribute('data-nama');
            _confirmUnassign(rId, pId, nama);
          };
        });
      }
    }

    // 2. Render Tabel Standar Safe Manning
    if (tbodyManning) {
      var rincian = (d.evaluasi && d.evaluasi.posisiRincian) ? d.evaluasi.posisiRincian : [];
      if (rincian.length === 0) {
        tbodyManning.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:16px; color:var(--muted);">Standar safe manning tidak ditemukan.</td></tr>';
      } else {
        tbodyManning.innerHTML = rincian.map(function (r) {
          var isOk = r.status === 'TERPENUHI';
          return (
            '<tr>' +
              '<td>' + Format.escape(r.posSijil.replace(/_/g, ' ')) + '</td>' +
              '<td class="text-right mono tnum">' + r.minimum + '</td>' +
              '<td class="text-right mono tnum" style="font-weight:600;">' + r.terisi + '</td>' +
              '<td class="text-center">' +
                (isOk ? '<span class="pill pill-positive"><span class="pill-dot"></span>Sesuai</span>' : '<span class="pill pill-negative"><span class="pill-dot"></span>Kurang ' + r.kurang + '</span>') +
              '</td>' +
            '</tr>'
          );
        }).join('');
      }
    }
  }

  function _confirmUnassign(rowId, pegawaiId, nama) {
    if (!confirm('Apakah Anda yakin ingin menurunkan personil ' + nama + ' dari penugasan kapal ini?')) {
      return;
    }

    var token = AuthApp.getToken();
    rpc('sijil_unassignAwak', {
      token: token,
      rowId: rowId,
      pegawaiId: pegawaiId
    })
      .then(function (res) {
        Toast.success(res.message || 'Personil berhasil diturunkan.');
        load();
        if (_currentKapalId) openKapalSheet(_currentKapalId);
      })
      .catch(function (err) {
        Toast.error('Gagal menurunkan awak: ' + err.message);
      });
  }

  function openAssignModal(prefillKapalId) {
    var selKapal = document.getElementById('assign-select-kapal');
    var selPeg = document.getElementById('assign-select-pegawai');
    var tglNaik = document.getElementById('assign-input-tgl-naik');
    var ketInp = document.getElementById('assign-input-keterangan');

    if (ketInp) ketInp.value = '';
    if (tglNaik) {
      var now = new Date();
      tglNaik.value = now.toISOString().substring(0, 10);
    }

    // Populate dropdown kapal
    if (selKapal && _data && _data.kapal) {
      selKapal.innerHTML = '<option value="">-- Pilih Kapal Pengawas --</option>' + _data.kapal.map(function (k) {
        var selected = (k.kapalId === prefillKapalId) ? 'selected' : '';
        return '<option value="' + k.kapalId + '" ' + selected + '>' + Format.escape(k.namaKapal) + ' (' + k.kapalId + ')</option>';
      }).join('');
    }

    // Populate dropdown awak
    var token = AuthApp.getToken();
    if (selPeg) {
      selPeg.innerHTML = '<option value="">Memuat daftar personil...</option>';
      rpc('dir_list', { token: token, limit: 120 })
        .then(function (res) {
          var items = res.items || [];
          selPeg.innerHTML = '<option value="">-- Pilih Awak Kapal --</option>' + items.map(function (a) {
            return '<option value="' + a.pegawaiId + '">' + Format.escape(a.nama) + ' (' + a.kelompokJabatan + ' - ' + a.rumpun + ')</option>';
          }).join('');
        })
        .catch(function () {
          selPeg.innerHTML = '<option value="">Gagal memuat personil</option>';
        });
    }

    Modal.open('modal-sijil-assign');
  }

  function _submitAssign() {
    var token = AuthApp.getToken();
    var kapalId = document.getElementById('assign-select-kapal').value;
    var pegawaiId = document.getElementById('assign-select-pegawai').value;
    var posSijil = document.getElementById('assign-select-posisi').value;
    var tglNaik = document.getElementById('assign-input-tgl-naik').value;
    var ket = document.getElementById('assign-input-keterangan').value.trim();

    if (!kapalId) {
      Toast.error('Pilih kapal tujuan.');
      return;
    }
    if (!pegawaiId) {
      Toast.error('Pilih personil awak kapal.');
      return;
    }
    if (!tglNaik) {
      Toast.error('Tentukan tanggal naik kapal.');
      return;
    }

    var btnSubmit = document.getElementById('btn-submit-sijil-assign');
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Menempatkan...';
    }

    rpc('sijil_assignAwak', {
      token: token,
      kapalId: kapalId,
      pegawaiId: pegawaiId,
      posSijil: posSijil,
      tanggalNaik: tglNaik,
      keterangan: ket
    })
      .then(function (res) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Tempatkan personil';
        }
        Modal.close('modal-sijil-assign');
        Toast.success(res.message || 'Personil berhasil ditempatkan ke papan sijil.');
        load();
        if (_currentKapalId === kapalId) {
          openKapalSheet(kapalId);
        }
      })
      .catch(function (err) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Tempatkan personil';
        }
        Toast.error('Gagal menempatkan awak: ' + err.message);
      });
  }

  return {
    init: init,
    load: load,
    openKapalSheet: openKapalSheet,
    openAssignModal: openAssignModal
  };
})();
</script>
