<script>
/**
 * html/Script_Sijil.html
 * Controller Klien Sub-Modul E: Penugasan Kapal & Matriks Papan Sijil 2D Safe Manning (DESIGN.md §8.1).
 * Nakhoda — Timja Pengawakan Dit. POA KKP RI
 */
var SijilView = (function () {
  'use strict';

  var _currentKapalId = '';
  var _data = null;
  var _eventsBound = false;
  var _awakOptions = [];
  var _selectedAwak = null;
  var _assignFile = null;
  var _quickFile = null;

  var KELAS_GROUPS = [
    { key: 'KELAS_I', label: 'Kapal Pengawas Kelas I (Panjang > 60 meter / ZEE)' },
    { key: 'KELAS_II', label: 'Kapal Pengawas Kelas II (Panjang 40 - 60 meter)' },
    { key: 'KELAS_III', label: 'Kapal Pengawas Kelas III (Panjang 28 - 40 meter)' },
    { key: 'KELAS_IV', label: 'Kapal Pengawas Kelas IV (Panjang 18 - 28 meter)' },
    { key: 'KELAS_V', label: 'Speedboat Pengawas Kelas V (Reaksi Cepat)' }
  ];

  function init() {
    _bindEvents();
    load();
  }

  function _bindEvents() {
    if (_eventsBound) return;
    _eventsBound = true;

    var btnRefresh = document.getElementById('btn-sijil-refresh');
    var filterKelas = document.getElementById('sijil-filter-kelas');
    var filterStatus = document.getElementById('sijil-filter-status');
    var searchInput = document.getElementById('sijil-search-input');
    var btnSearch = document.getElementById('btn-sijil-search');
    var btnQuickAssign = document.getElementById('btn-sijil-quick-assign');
    var btnSheetAdd = document.getElementById('btn-sheet-add-awak');
    var formAssign = document.getElementById('form-sijil-assign');
    var formQuickSpt = document.getElementById('form-sijil-upload-spt');

    if (btnRefresh) {
      btnRefresh.onclick = function () { load(); };
    }
    if (filterKelas) filterKelas.onchange = function () { _renderMatrixTable(); };
    if (filterStatus) filterStatus.onchange = function () { _renderMatrixTable(); };
    if (btnSearch) btnSearch.onclick = function () { _renderMatrixTable(); };
    if (searchInput) {
      searchInput.onkeydown = function (e) {
        if (e.key === 'Enter') _renderMatrixTable();
      };
    }

    if (btnQuickAssign) {
      btnQuickAssign.onclick = function () {
        openAssignModal('');
      };
    }

    if (btnSheetAdd) {
      btnSheetAdd.onclick = function () {
        openAssignModal(_currentKapalId);
      };
    }

    if (formAssign) {
      formAssign.onsubmit = function (e) {
        e.preventDefault();
        _submitAssign();
      };
    }

    if (formQuickSpt) {
      formQuickSpt.onsubmit = function (e) {
        e.preventDefault();
        _submitQuickSpt();
      };
    }

    _bindComboboxEvents();
    _bindDropzoneEvents();
  }

  // ── PENCARIAN & AUTOCOMPLETE AWAK KAPAL (396+ PERSONIL) ──
  function _bindComboboxEvents() {
    var searchInp = document.getElementById('assign-crew-search-input');
    var dropdown = document.getElementById('assign-crew-dropdown');
    var btnChange = document.getElementById('btn-change-crew');

    if (searchInp) {
      searchInp.oninput = function () {
        _filterAndRenderAwakDropdown(searchInp.value);
      };
      searchInp.onfocus = function () {
        _filterAndRenderAwakDropdown(searchInp.value);
      };
    }

    if (btnChange) {
      btnChange.onclick = function () {
        _clearSelectedCrew();
      };
    }

    // Klik di luar dropdown untuk menutup
    document.addEventListener('click', function (e) {
      var wrap = document.getElementById('assign-crew-search-wrap');
      if (wrap && !wrap.contains(e.target)) {
        if (dropdown) dropdown.classList.add('hidden');
      }
    });
  }

  function _filterAndRenderAwakDropdown(query) {
    var dropdown = document.getElementById('assign-crew-dropdown');
    if (!dropdown) return;

    var q = String(query || '').toLowerCase().trim();
    var filtered = _awakOptions;
    if (q) {
      filtered = _awakOptions.filter(function (a) {
        var str = (a.nama + ' ' + (a.nipDisplay || '') + ' ' + (a.kelompokJabatan || '') + ' ' + (a.rumpun || '') + ' ' + (a.kapalId || '')).toLowerCase();
        return str.indexOf(q) !== -1;
      });
    }

    if (filtered.length === 0) {
      dropdown.innerHTML = '<div style="padding:12px; font-size:12px; color:var(--muted); text-align:center;">Tidak ada personil awak yang cocok.</div>';
      dropdown.classList.remove('hidden');
      return;
    }

    // Batasi maksimum 15 hasil per pencarian untuk performa render kilat
    var slice = filtered.slice(0, 15);
    dropdown.innerHTML = slice.map(function (a) {
      var bg = Format.avatarBg(a.nama);
      var inis = Format.initials(a.nama);
      var shipStatus = a.kapalId
        ? '<span class="pill pill-warning" style="font-size:10px; padding:1px 6px;">Aktif di ' + Format.escape(a.kapalId) + '</span>'
        : '<span class="pill pill-neutral" style="font-size:10px; padding:1px 6px;">Bebas tugas</span>';

      return (
        '<div class="combobox-item" data-peg-id="' + a.pegawaiId + '">' +
          '<div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1;">' +
            '<div class="avatar-sm" style="background-color:' + bg + '; border-radius:3px; flex-shrink:0;">' + inis + '</div>' +
            '<div style="min-width:0; flex:1;">' +
              '<div style="font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + Format.escape(a.nama) + '</div>' +
              '<div style="font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' +
                (a.nipDisplay ? 'NIP ' + a.nipDisplay + ' · ' : '') + Format.escape(a.kelompokJabatan || 'Awak') + ' (' + a.rumpun + ')' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div style="flex-shrink:0;">' + shipStatus + '</div>' +
        '</div>'
      );
    }).join('');

    dropdown.classList.remove('hidden');

    dropdown.querySelectorAll('.combobox-item[data-peg-id]').forEach(function (el) {
      el.onclick = function () {
        var pId = el.getAttribute('data-peg-id');
        var found = _awakOptions.find(function (x) { return x.pegawaiId === pId; });
        if (found) _selectCrew(found);
      };
    });
  }

  function _selectCrew(awak) {
    _selectedAwak = awak;
    var inpId = document.getElementById('assign-input-pegawai-id');
    var selPeg = document.getElementById('assign-select-pegawai');
    var searchWrap = document.getElementById('assign-crew-search-wrap');
    var card = document.getElementById('assign-crew-selected-card');
    var dropdown = document.getElementById('assign-crew-dropdown');

    if (inpId) inpId.value = awak.pegawaiId;
    if (selPeg) selPeg.value = awak.pegawaiId;

    if (searchWrap) searchWrap.classList.add('hidden');
    if (dropdown) dropdown.classList.add('hidden');

    if (card) {
      var avEl = document.getElementById('assign-crew-avatar');
      var nameEl = document.getElementById('assign-crew-name');
      var metaEl = document.getElementById('assign-crew-meta');

      if (avEl) {
        avEl.textContent = Format.initials(awak.nama);
        avEl.style.backgroundColor = Format.avatarBg(awak.nama);
      }
      if (nameEl) nameEl.textContent = awak.nama;
      if (metaEl) {
        var metaText = (awak.nipDisplay ? 'NIP ' + awak.nipDisplay + ' · ' : '') +
                       (awak.kelompokJabatan || 'Awak') + ' (' + awak.rumpun + ')';
        if (awak.kapalId) {
          metaText += ' · Sedang di ' + awak.kapalId + ' (akan dirotasi)';
        }
        metaEl.textContent = metaText;
      }
      card.classList.remove('hidden');
    }

    // Penyelarasan otomatis opsi posisi sijil berdasarkan kelompok jabatan
    _autoMatchPosisi(awak.kelompokJabatan);
  }

  function _autoMatchPosisi(jabatan) {
    var selPos = document.getElementById('assign-select-posisi');
    if (!selPos || !jabatan) return;

    var jLower = String(jabatan).toLowerCase();
    var mapped = '';

    if (jLower.indexOf('nakhoda') !== -1 || jLower.indexOf('nahkoda') !== -1) mapped = 'NAKHODA';
    else if (jLower.indexOf('mualim i') !== -1) mapped = 'MUALIM_I';
    else if (jLower.indexOf('mualim ii') !== -1) mapped = 'MUALIM_II';
    else if (jLower.indexOf('mualim iii') !== -1) mapped = 'MUALIM_III';
    else if (jLower.indexOf('mualim') !== -1) mapped = 'MUALIM_I';
    else if (jLower.indexOf('kkm') !== -1 || jLower.indexOf('kamar mesin') !== -1) mapped = 'KKM';
    else if (jLower.indexOf('masinis i') !== -1) mapped = 'MASINIS_I';
    else if (jLower.indexOf('masinis ii') !== -1) mapped = 'MASINIS_II';
    else if (jLower.indexOf('masinis iii') !== -1) mapped = 'MASINIS_III';
    else if (jLower.indexOf('masinis') !== -1) mapped = 'MASINIS_I';
    else if (jLower.indexOf('markonis') !== -1) mapped = 'MARKONIS';
    else if (jLower.indexOf('serang') !== -1) mapped = 'SERANG';
    else if (jLower.indexOf('juru mudi') !== -1) mapped = 'JURU_MUDI';
    else if (jLower.indexOf('juru minyak') !== -1) mapped = 'JURU_MINYAK';
    else if (jLower.indexOf('kelasi') !== -1) mapped = 'KELASI';

    if (mapped) selPos.value = mapped;
  }

  function _clearSelectedCrew() {
    _selectedAwak = null;
    var inpId = document.getElementById('assign-input-pegawai-id');
    var selPeg = document.getElementById('assign-select-pegawai');
    var searchWrap = document.getElementById('assign-crew-search-wrap');
    var searchInp = document.getElementById('assign-crew-search-input');
    var card = document.getElementById('assign-crew-selected-card');
    var dropdown = document.getElementById('assign-crew-dropdown');

    if (inpId) inpId.value = '';
    if (selPeg) selPeg.value = '';
    if (card) card.classList.add('hidden');
    if (searchWrap) searchWrap.classList.remove('hidden');
    if (dropdown) dropdown.classList.add('hidden');
    if (searchInp) {
      searchInp.value = '';
      searchInp.focus();
    }
  }

  // ── DROPZONE & PENGELOLAAN UNGGAH SURAT TUGAS ──
  function _bindDropzoneEvents() {
    // 1. Modal Penempatan
    var assignDropzone = document.getElementById('assign-spt-dropzone');
    var assignFileInput = document.getElementById('assign-spt-file');
    var btnAssignRemove = document.getElementById('btn-assign-remove-file');

    if (assignDropzone && assignFileInput) {
      assignDropzone.onclick = function (e) {
        if (e.target.id === 'btn-assign-remove-file') return;
        assignFileInput.click();
      };
      assignFileInput.onchange = function () {
        if (assignFileInput.files && assignFileInput.files[0]) {
          _handleFileSelected(assignFileInput.files[0], 'assign');
        }
      };
    }
    if (btnAssignRemove) {
      btnAssignRemove.onclick = function (e) {
        e.stopPropagation();
        _clearDropzoneFile('assign');
      };
    }

    // 2. Modal Quick Upload SPT dari Lembar Kapal
    var quickDropzone = document.getElementById('quick-spt-dropzone');
    var quickFileInput = document.getElementById('quick-spt-file');
    var btnQuickRemove = document.getElementById('btn-quick-remove-file');

    if (quickDropzone && quickFileInput) {
      quickDropzone.onclick = function (e) {
        if (e.target.id === 'btn-quick-remove-file') return;
        quickFileInput.click();
      };
      quickFileInput.onchange = function () {
        if (quickFileInput.files && quickFileInput.files[0]) {
          _handleFileSelected(quickFileInput.files[0], 'quick');
        }
      };
    }
    if (btnQuickRemove) {
      btnQuickRemove.onclick = function (e) {
        e.stopPropagation();
        _clearDropzoneFile('quick');
      };
    }
  }

  function _handleFileSelected(file, mode) {
    if (file.size > 15 * 1024 * 1024) {
      Toast.error('Ukuran berkas melebihi batas 15 MB.');
      _clearDropzoneFile(mode);
      return;
    }

    var reader = new FileReader();
    reader.onload = function (evt) {
      var fullData = evt.target.result;
      var base64 = fullData.split(',')[1];
      var fileObj = {
        fileName: file.name,
        mimeType: file.type || 'application/pdf',
        dataBase64: base64
      };

      if (mode === 'assign') {
        _assignFile = fileObj;
        var pPrompt = document.getElementById('assign-spt-prompt');
        var pSelected = document.getElementById('assign-spt-selected');
        var fName = document.getElementById('assign-spt-filename');
        var fSize = document.getElementById('assign-spt-filesize');
        if (pPrompt) pPrompt.classList.add('hidden');
        if (pSelected) pSelected.classList.remove('hidden');
        if (fName) fName.textContent = file.name;
        if (fSize) fSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
      } else {
        _quickFile = fileObj;
        var qPrompt = document.getElementById('quick-spt-prompt');
        var qSelected = document.getElementById('quick-spt-selected');
        var qName = document.getElementById('quick-spt-filename');
        var qSize = document.getElementById('quick-spt-filesize');
        if (qPrompt) qPrompt.classList.add('hidden');
        if (qSelected) qSelected.classList.remove('hidden');
        if (qName) qName.textContent = file.name;
        if (qSize) qSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
      }
    };
    reader.onerror = function () {
      Toast.error('Gagal membaca berkas.');
    };
    reader.readAsDataURL(file);
  }

  function _clearDropzoneFile(mode) {
    if (mode === 'assign') {
      _assignFile = null;
      var fileInput = document.getElementById('assign-spt-file');
      if (fileInput) fileInput.value = '';
      var pPrompt = document.getElementById('assign-spt-prompt');
      var pSelected = document.getElementById('assign-spt-selected');
      if (pPrompt) pPrompt.classList.remove('hidden');
      if (pSelected) pSelected.classList.add('hidden');
    } else {
      _quickFile = null;
      var qInput = document.getElementById('quick-spt-file');
      if (qInput) qInput.value = '';
      var qPrompt = document.getElementById('quick-spt-prompt');
      var qSelected = document.getElementById('quick-spt-selected');
      if (qPrompt) qPrompt.classList.remove('hidden');
      if (qSelected) qSelected.classList.add('hidden');
    }
  }

  function load() {
    var token = AuthApp.getToken();
    if (!token) return;

    rpc('sijil_getPapanArmada', token)
      .then(function (res) {
        _data = res;

        // 1. Update KPI Strip
        var mTot = document.getElementById('metric-sijil-total-kapal');
        var mLaik = document.getElementById('metric-sijil-laik');
        var mKur = document.getElementById('metric-sijil-kurang');
        var mDef = document.getElementById('metric-sijil-defisit-kursi');
        var mKurSub = document.getElementById('metric-sijil-kurang-sub');
        var mAwakSub = document.getElementById('metric-sijil-awak-laut-sub');
        var findingEl = document.getElementById('sijil-finding-sub');

        var totKapal = res.metrics.totalKapal || 0;
        var laik = res.metrics.laikOperasi || 0;
        var kurang = res.metrics.kurangAwak || 0;
        var defisit = res.metrics.totalKekuranganKursi || 0;
        var bertugas = res.metrics.totalAwakBertugas || 0;

        if (mTot) mTot.textContent = Format.number(totKapal);
        if (mLaik) mLaik.textContent = Format.number(laik);
        if (mKur) mKur.textContent = Format.number(kurang);
        if (mDef) mDef.textContent = Format.number(defisit);

        if (mKurSub) {
          mKurSub.textContent = kurang > 0 ? (res.metrics.kritis + ' kapal berstatus kritis <= -2') : 'Seluruh kapal siap operasi';
        }
        if (mAwakSub) {
          mAwakSub.textContent = 'Awak bertugas di laut: ' + Format.number(bertugas) + ' personil';
        }

        if (findingEl) {
          findingEl.textContent = kurang > 0
            ? ('Terdapat ' + kurang + ' kapal pengawas dengan kekurangan formasi (' + defisit + ' kursi kosong dari standar Safe Manning Kepmen KP); ' + laik + ' kapal memenuhi formasi siap laik operasi.')
            : ('Seluruh ' + totKapal + ' kapal pengawas armada Ditjen PSDKP memenuhi standar formasi Safe Manning Kepmen KP.');
        }

        // 1B. Render Peringatan Konflik Awak Nonaktif SIKAP Masih Onboard
        _renderSikapConflicts(res.sikapOnboardConflicts || []);

        // 2. Render Matriks 2D Table
        _renderMatrixTable();
      })
      .catch(function (err) {
        Toast.error('Gagal memuat papan sijil armada: ' + err.message);
      });
  }

  function _renderSikapConflicts(conflicts) {
    var banner = document.getElementById('sijil-sikap-conflict-banner');
    var descEl = document.getElementById('sijil-conflict-desc');
    var actEl = document.getElementById('sijil-conflict-actions');
    if (!banner) return;

    if (!conflicts || conflicts.length === 0) {
      banner.classList.add('hidden');
      return;
    }

    banner.classList.remove('hidden');
    var summary = conflicts.slice(0, 3).map(function (c) {
      return Format.escape(c.nama) + ' (' + Format.escape(c.namaKapal || c.kapalId) + (c.posSijil ? ' · ' + Format.escape(c.posSijil) : '') + ')';
    }).join(', ');
    if (conflicts.length > 3) summary += ' dan ' + (conflicts.length - 3) + ' lainnya';

    if (descEl) {
      descEl.innerHTML = conflicts.length + ' awak berstatus Nonaktif/Keluar SIKAP masih menempati formasi aktif kapal: ' + summary + '. Segera turunkan atau lakukan pergantian awak.';
    }
    if (actEl) {
      var firstKId = conflicts[0].kapalId || '';
      actEl.innerHTML = firstKId
        ? '<button type="button" class="btn btn-secondary-sm" onclick="SijilView.openKapalSheet(\'' + Format.escape(firstKId) + '\')">Tinjau ' + Format.escape(conflicts[0].namaKapal || firstKId) + '</button>'
        : '';
    }
  }

  function _renderDevCell(colObj) {
    if (!colObj) {
      return '<span class="sijil-cell sijil-cell-na mono">-</span>';
    }
    var min = colObj.min !== undefined ? colObj.min : colObj.req;
    if (min === 0) {
      return '<span class="sijil-cell sijil-cell-na mono">-</span>';
    }
    var sel = colObj.selisih !== undefined ? colObj.selisih : (colObj.dev !== undefined ? colObj.dev : 0);
    if (sel <= -2) {
      return '<span class="sijil-cell sijil-cell-crit mono">' + sel + '</span>';
    } else if (sel === -1) {
      return '<span class="sijil-cell sijil-cell-warn mono">-1</span>';
    } else if (sel > 0) {
      return '<span class="sijil-cell sijil-cell-plus mono">+' + sel + '</span>';
    } else {
      return '<span class="sijil-cell sijil-cell-ok mono">0</span>';
    }
  }

  function _renderMatrixTable() {
    if (!_data || !_data.kapal) return;

    var tbody = document.getElementById('sijil-2d-matrix-tbody');
    if (!tbody) return;

    var filterKls = (document.getElementById('sijil-filter-kelas') || {}).value || '';
    var filterSts = (document.getElementById('sijil-filter-status') || {}).value || '';
    var searchStr = (document.getElementById('sijil-search-input') || {}).value || '';
    searchStr = searchStr.toLowerCase().trim();

    var filtered = _data.kapal.filter(function (k) {
      if (filterKls && k.kelasKapal !== filterKls) return false;
      if (filterSts && k.statusOperasi !== filterSts) return false;
      if (searchStr) {
        var n = k.namaKapal.toLowerCase();
        var p = k.pangkalanId.toLowerCase();
        if (n.indexOf(searchStr) === -1 && p.indexOf(searchStr) === -1) return false;
      }
      return true;
    });

    var countInfo = document.getElementById('sijil-total-matched');
    if (countInfo) countInfo.textContent = filtered.length + ' kapal cocok';

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="14" style="text-align:center; padding:32px 0; color:var(--muted);">Tidak ada kapal pengawas yang cocok dengan kriteria pencarian.</td></tr>';
      return;
    }

    function _normKelasKey(val) {
      var s = String(val || '').toUpperCase().replace(/[\s-]+/g, '_');
      if (s === 'KELAS_1') s = 'KELAS_I';
      if (s === 'KELAS_2') s = 'KELAS_II';
      if (s === 'KELAS_3') s = 'KELAS_III';
      if (s === 'KELAS_4') s = 'KELAS_IV';
      if (s === 'KELAS_5') s = 'KELAS_V';
      return s;
    }

    var html = '';
    var handledIds = {};

    // Kelompokkan baris berdasarkan Kelas I–V
    KELAS_GROUPS.forEach(function (grp) {
      var inGroup = filtered.filter(function (k) { return _normKelasKey(k.kelasKapal) === grp.key; });
      if (inGroup.length === 0) return;

      html +=
        '<tr class="sijil-group-row">' +
          '<td colspan="14">' + Format.escape(grp.label) + ' (' + inGroup.length + ' kapal)</td>' +
        '</tr>';

      inGroup.forEach(function (k) {
        handledIds[k.kapalId] = true;
        var mCols = k.matrixCols || k.positions || {};
        var defisitHtml = (k.kekuranganKursi > 0)
          ? '<span class="delta-down mono">-' + k.kekuranganKursi + '</span>'
          : '<span style="color:var(--muted);" class="mono">0</span>';

        html +=
          '<tr class="clickable" data-id="' + k.kapalId + '">' +
            '<td>' +
              '<div class="cell-primary">' + Format.escape(k.namaKapal) + '</div>' +
              '<div class="cell-sub mono">' + k.kapalId + '</div>' +
            '</td>' +
            '<td style="color:var(--muted); font-size:12px;">' + Format.escape(k.pangkalanId) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.nakhoda) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.mualim) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.kkm) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.masinis) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.markonis) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.serang) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.juruMudi) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.kelasi) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.juruMinyak) + '</td>' +
            '<td class="text-right mono tnum">' + k.jumlahAwakBertugas + ' / ' + k.kebutuhanMinimum + '</td>' +
            '<td class="text-right">' + defisitHtml + '</td>' +
            '<td class="text-center">' + Format.statusBadge(k.statusOperasi) + '</td>' +
          '</tr>';
      });
    });

    // Baris sisa (jika ada kapal yang belum masuk grup di atas)
    var remaining = filtered.filter(function (k) { return !handledIds[k.kapalId]; });
    if (remaining.length > 0) {
      html += '<tr class="sijil-group-row"><td colspan="14">Armada Kapal Lainnya (' + remaining.length + ' kapal)</td></tr>';
      remaining.forEach(function (k) {
        var mCols = k.matrixCols || k.positions || {};
        var defisitHtml = (k.kekuranganKursi > 0)
          ? '<span class="delta-down mono">-' + k.kekuranganKursi + '</span>'
          : '<span style="color:var(--muted);" class="mono">0</span>';

        html +=
          '<tr class="clickable" data-id="' + k.kapalId + '">' +
            '<td>' +
              '<div class="cell-primary">' + Format.escape(k.namaKapal) + '</div>' +
              '<div class="cell-sub mono">' + k.kapalId + '</div>' +
            '</td>' +
            '<td style="color:var(--muted); font-size:12px;">' + Format.escape(k.pangkalanId) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.nakhoda) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.mualim) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.kkm) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.masinis) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.markonis) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.serang) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.juruMudi) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.kelasi) + '</td>' +
            '<td class="text-center">' + _renderDevCell(mCols.juruMinyak) + '</td>' +
            '<td class="text-right mono tnum">' + k.jumlahAwakBertugas + ' / ' + k.kebutuhanMinimum + '</td>' +
            '<td class="text-right">' + defisitHtml + '</td>' +
            '<td class="text-center">' + Format.statusBadge(k.statusOperasi) + '</td>' +
          '</tr>';
      });
    }

    tbody.innerHTML = html;

    // Pasang click listener di seluruh baris tabel
    tbody.querySelectorAll('tr.clickable[data-id]').forEach(function (tr) {
      tr.onclick = function () {
        var id = tr.getAttribute('data-id');
        openKapalSheet(id);
      };
    });
  }

  function openKapalSheet(kapalId) {
    var token = AuthApp.getToken();
    if (!token) return;

    _currentKapalId = kapalId;
    Sheet.open('sheet-sijil-panel', 'sheet-sijil-overlay');

    var nameEl = document.getElementById('sheet-sijil-nama-kapal');
    if (nameEl) nameEl.textContent = 'Loading formasi ' + kapalId + '...';

    rpc('sijil_getDetailKapal', token, kapalId)
      .then(function (res) {
        _renderSheetDetail(res);
      })
      .catch(function (err) {
        Toast.error('Gagal memuat detail kapal: ' + err.message);
      });
  }

  function _renderSheetDetail(d) {
    if (!d) return;

    var nameEl = document.getElementById('sheet-sijil-nama-kapal');
    var badgeKelas = document.getElementById('sheet-sijil-badge-kelas');
    var statusBadge = document.getElementById('sheet-sijil-status-badge');
    var pangkalanEl = document.getElementById('sheet-sijil-pangkalan');
    var ratioText = document.getElementById('sheet-sijil-ratio-text');
    var ratioBar = document.getElementById('sheet-sijil-ratio-bar');
    var listAwak = document.getElementById('sheet-sijil-awak-list');
    var tbodyManning = document.getElementById('sheet-sijil-manning-tbody');

    if (nameEl) nameEl.textContent = d.namaKapal || d.kapalId;
    if (badgeKelas) badgeKelas.textContent = String(d.kelasKapal || 'Kelas II').replace(/_/g, ' ');
    if (statusBadge) {
      var isLaik = d.evaluasi.isLaikOperasi;
      statusBadge.textContent = isLaik ? 'Siap laik operasi' : 'Kurang awak';
      statusBadge.className = isLaik ? 'pill pill-positive' : 'pill pill-negative';
    }
    if (pangkalanEl) pangkalanEl.textContent = d.pangkalanId || '-';

    var terisi = d.evaluasi.totalTerisi || 0;
    var butuh = d.evaluasi.totalKebutuhan || 0;
    var pct = butuh > 0 ? Math.round((terisi / butuh) * 100) : 100;

    if (ratioText) ratioText.textContent = terisi + ' / ' + butuh + ' (' + pct + '%)';
    if (ratioBar) ratioBar.style.width = Math.min(100, pct) + '%';

    // 1. Render Daftar Awak Aktif Naik Kapal beserta Akses Surat Tugas (SPT)
    if (listAwak) {
      var awakList = d.awakBertugas || [];
      if (awakList.length === 0) {
        listAwak.innerHTML = '<div style="padding:18px; text-align:center; color:var(--muted); font-size:12px;">Belum ada awak bertugas di kapal ini.</div>';
      } else {
        listAwak.innerHTML = awakList.map(function (a) {
          var bg = Format.avatarBg(a.nama);
          var inis = Format.initials(a.nama);
          var posLabel = String(a.posSijil || '').replace(/_/g, ' ');
          var sptBtn = '';

          if (a.suratTugas && a.suratTugas.viewUrl) {
            sptBtn =
              '<a href="' + a.suratTugas.viewUrl + '" target="_blank" rel="noopener noreferrer" class="btn btn-secondary-sm" title="Buka berkas Surat Tugas: ' + Format.escape(a.suratTugas.fileName) + '" style="color:var(--text); text-decoration:none;">' +
                '<svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="1.75"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' +
                '<span>Surat tugas</span>' +
              '</a>';
          } else {
            sptBtn =
              '<button type="button" class="btn btn-secondary-sm btn-attach-spt" data-row="' + a.rowId + '" data-nama="' + Format.escape(a.nama) + '" data-pos="' + Format.escape(posLabel) + '" title="Unggah berkas Surat Tugas untuk awak ini">' +
                '<svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="1.75"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>' +
                '<span>+ Surat tugas</span>' +
              '</button>';
          }

          var ketSub = a.keterangan ? ('<div style="font-size:11px; color:var(--muted); margin-top:2px;">' + Format.escape(a.keterangan) + '</div>') : '';

          return (
            '<div class="sijil-crew-card">' +
              '<div class="sijil-crew-left">' +
                '<div class="avatar-sm" style="background-color:' + bg + '; border-radius:3px; flex-shrink:0;">' + inis + '</div>' +
                '<div style="min-width:0; flex:1;">' +
                  '<div class="cell-primary" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + Format.escape(a.nama) + '</div>' +
                  '<div class="cell-sub"><strong style="color:var(--accent);">' + Format.escape(posLabel) + '</strong> · Naik: ' + Format.date(a.tanggalNaik) + '</div>' +
                  ketSub +
                '</div>' +
              '</div>' +
              '<div class="sijil-crew-actions">' +
                sptBtn +
                '<button type="button" class="btn btn-danger-sm btn-unassign" data-row="' + a.rowId + '" data-peg="' + a.pegawaiId + '" data-nama="' + Format.escape(a.nama) + '">Turunkan</button>' +
              '</div>' +
            '</div>'
          );
        }).join('');

        // Pasang event listener tombol Turunkan
        listAwak.querySelectorAll('.btn-unassign').forEach(function (btn) {
          btn.onclick = function () {
            var rId = btn.getAttribute('data-row');
            var pId = btn.getAttribute('data-peg');
            var nama = btn.getAttribute('data-nama');
            _confirmUnassign(rId, pId, nama);
          };
        });

        // Pasang event listener tombol Unggah Surat Tugas Langsung
        listAwak.querySelectorAll('.btn-attach-spt').forEach(function (btn) {
          btn.onclick = function () {
            var rId = btn.getAttribute('data-row');
            var nama = btn.getAttribute('data-nama');
            var pos = btn.getAttribute('data-pos');
            openUploadSptModal(rId, nama, pos);
          };
        });
      }
    }

    // 2. Render Tabel Standar Safe Manning
    if (tbodyManning) {
      var rincian = (d.evaluasi && d.evaluasi.posisiRincian) ? d.evaluasi.posisiRincian : [];
      if (rincian.length === 0) {
        tbodyManning.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:16px; color:var(--muted);">Standar safe manning tidak ditemukan.</td></tr>';
      } else {
        tbodyManning.innerHTML = rincian.map(function (r) {
          var isOk = r.status === 'TERPENUHI';
          return (
            '<tr>' +
              '<td>' + Format.escape(r.posSijil.replace(/_/g, ' ')) + '</td>' +
              '<td class="text-right mono tnum">' + r.minimum + '</td>' +
              '<td class="text-right mono tnum" style="font-weight:600;">' + r.terisi + '</td>' +
              '<td class="text-center">' +
                (isOk ? '<span class="pill pill-positive"><span class="pill-dot"></span>Sesuai</span>' : '<span class="pill pill-negative"><span class="pill-dot"></span>Kurang ' + r.kurang + '</span>') +
              '</td>' +
            '</tr>'
          );
        }).join('');
      }
    }
  }

  function _confirmUnassign(rowId, pegawaiId, nama) {
    if (!confirm('Apakah Anda yakin ingin menurunkan personil ' + nama + ' dari penugasan kapal ini?')) {
      return;
    }

    var token = AuthApp.getToken();
    rpc('sijil_unassignAwak', {
      token: token,
      rowId: rowId,
      pegawaiId: pegawaiId
    })
      .then(function (res) {
        Toast.success(res.message || 'Personil berhasil diturunkan.');
        load();
        if (_currentKapalId) openKapalSheet(_currentKapalId);
      })
      .catch(function (err) {
        Toast.error('Gagal menurunkan awak: ' + err.message);
      });
  }

  function openAssignModal(prefillKapalId) {
    var selKapal = document.getElementById('assign-select-kapal');
    var tglNaik = document.getElementById('assign-input-tgl-naik');
    var ketInp = document.getElementById('assign-input-keterangan');
    var driveUrlInp = document.getElementById('assign-spt-drive-url');

    if (ketInp) ketInp.value = '';
    if (driveUrlInp) driveUrlInp.value = '';
    _clearSelectedCrew();
    _clearDropzoneFile('assign');

    if (tglNaik) {
      var now = new Date();
      tglNaik.value = now.toISOString().substring(0, 10);
    }

    // Populate dropdown kapal
    if (selKapal && _data && _data.kapal) {
      selKapal.innerHTML = '<option value="">-- Pilih Kapal Pengawas --</option>' + _data.kapal.map(function (k) {
        var selected = (k.kapalId === prefillKapalId) ? 'selected' : '';
        return '<option value="' + k.kapalId + '" ' + selected + '>' + Format.escape(k.namaKapal) + ' (' + k.kapalId + ')</option>';
      }).join('');
    }

    // Muat daftar lengkap seluruh personil awak aktif untuk pencarian (396+ personil)
    var token = AuthApp.getToken();
    var searchInp = document.getElementById('assign-crew-search-input');
    if (searchInp) searchInp.placeholder = 'Loading data personil armada...';

    rpc('sijil_getAwakOptions', token)
      .then(function (res) {
        _awakOptions = (res && res.data) ? res.data : (Array.isArray(res) ? res : []);
        if (searchInp) searchInp.placeholder = 'Cari nama, NIP, atau jabatan awak (' + _awakOptions.length + ' personil)...';
        
        var selPeg = document.getElementById('assign-select-pegawai');
        if (selPeg) {
          selPeg.innerHTML = '<option value="">-- Pilih Awak Kapal --</option>' + _awakOptions.map(function (a) {
            return '<option value="' + a.pegawaiId + '">' + Format.escape(a.nama) + ' (' + a.kelompokJabatan + ' - ' + a.rumpun + ')</option>';
          }).join('');
        }
      })
      .catch(function () {
        rpc('dir_list', { token: token, statusAktif: 'AKTIF', limit: 500 })
          .then(function (res2) {
            _awakOptions = res2.items || [];
            if (searchInp) searchInp.placeholder = 'Cari nama, NIP, atau jabatan awak (' + _awakOptions.length + ' personil)...';
          })
          .catch(function () {
            if (searchInp) searchInp.placeholder = 'Gagal memuat personil. Ketik untuk coba lagi.';
          });
      });

    Modal.open('modal-sijil-assign');
  }

  function _submitAssign() {
    var token = AuthApp.getToken();
    var kapalId = document.getElementById('assign-select-kapal').value;
    var pegawaiId = document.getElementById('assign-input-pegawai-id').value ||
                    document.getElementById('assign-select-pegawai').value;
    var posSijil = document.getElementById('assign-select-posisi').value;
    var tglNaik = document.getElementById('assign-input-tgl-naik').value;
    var ket = document.getElementById('assign-input-keterangan').value.trim();
    var driveUrl = (document.getElementById('assign-spt-drive-url') || {}).value || '';
    driveUrl = driveUrl.trim();

    if (!kapalId) {
      Toast.error('Pilih kapal tujuan.');
      return;
    }
    if (!pegawaiId) {
      Toast.error('Pilih personil awak kapal melalui pencarian.');
      return;
    }
    if (!tglNaik) {
      Toast.error('Tentukan tanggal naik kapal.');
      return;
    }

    var btnSubmit = document.getElementById('btn-submit-sijil-assign');
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Menempatkan...';
    }

    var payload = {
      token: token,
      kapalId: kapalId,
      pegawaiId: pegawaiId,
      posSijil: posSijil,
      tanggalNaik: tglNaik,
      keterangan: ket
    };

    if (_assignFile) {
      payload.fileData = _assignFile;
    }
    if (driveUrl) {
      payload.driveUrl = driveUrl;
    }

    rpc('sijil_assignAwak', payload)
      .then(function (res) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Tempatkan personil';
        }
        Modal.close('modal-sijil-assign');
        Toast.success(res.message || 'Personil berhasil ditempatkan ke papan sijil.');
        load();
        if (_currentKapalId === kapalId) {
          openKapalSheet(kapalId);
        }
      })
      .catch(function (err) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Tempatkan personil';
        }
        Toast.error('Gagal menempatkan awak: ' + err.message);
      });
  }

  function openUploadSptModal(rowId, nama, pos) {
    var rowInput = document.getElementById('upload-spt-row-id');
    var infoEl = document.getElementById('upload-spt-target-info');
    var driveInp = document.getElementById('quick-spt-drive-url');

    if (rowInput) rowInput.value = rowId;
    if (infoEl) infoEl.textContent = 'Personil: ' + nama + ' (' + pos + ') · Penugasan: ' + rowId;
    if (driveInp) driveInp.value = '';
    _clearDropzoneFile('quick');

    Modal.open('modal-sijil-upload-spt');
  }

  function _submitQuickSpt() {
    var token = AuthApp.getToken();
    var rowId = document.getElementById('upload-spt-row-id').value;
    var driveUrl = (document.getElementById('quick-spt-drive-url') || {}).value || '';
    driveUrl = driveUrl.trim();

    if (!rowId) {
      Toast.error('Penugasan tidak valid.');
      return;
    }
    if (!_quickFile && !driveUrl) {
      Toast.error('Pilih berkas Surat Tugas atau cantumkan tautan Google Drive.');
      return;
    }

    var btnSubmit = document.getElementById('btn-submit-quick-spt');
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Mengunggah...';
    }

    var payload = {
      token: token,
      rowId: rowId
    };
    if (_quickFile) payload.fileData = _quickFile;
    if (driveUrl) payload.driveUrl = driveUrl;

    rpc('sijil_uploadSuratTugas', payload)
      .then(function (res) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Unggah surat tugas';
        }
        Modal.close('modal-sijil-upload-spt');
        Toast.success(res.message || 'Surat tugas berhasil diunggah.');
        if (_currentKapalId) {
          openKapalSheet(_currentKapalId);
        }
      })
      .catch(function (err) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Unggah surat tugas';
        }
        Toast.error('Gagal mengunggah surat tugas: ' + err.message);
      });
  }

  return {
    init: init,
    load: load,
    openKapalSheet: openKapalSheet,
    openAssignModal: openAssignModal,
    openUploadSptModal: openUploadSptModal
  };
})();
</script>
