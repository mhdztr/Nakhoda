<script>
/**
 * html/Script_Akn.html
 * Controller Logika Klien Sub-Modul A: Komposisi AKN (Achromatic Ledger).
 * Nakhoda — Timja Pengawakan Dit. POA KKP RI
 */
var AknView = (function () {
  'use strict';

  var _currentPeriode = '';
  var _data = null;
  var _eventsBound = false;
  var KATEGORIS = ['PNS', 'P3K', 'P3K_PARUH_WAKTU', 'PJLP'];
  var KATEGORI_LABELS = {
    'PNS': 'Pegawai negeri sipil (PNS)',
    'P3K': 'PPPK (P3K)',
    'P3K_PARUH_WAKTU': 'PPPK paruh waktu',
    'PJLP': 'PJLP / pegawai non-ASN'
  };

  function init() {
    _bindEvents();
    _syncFilterVisibility();
    load();
  }

  function _syncFilterVisibility() {
    var modeSel = document.getElementById('akn-filter-mode');
    var tahunSel = document.getElementById('akn-filter-tahun');
    var dateSingle = document.getElementById('akn-date-single');
    var rangeWrap = document.getElementById('akn-date-range-wrap');
    if (!modeSel) return;

    var m = modeSel.value || 'WEEK';
    var isWeek = m === 'WEEK';
    var isCustom = m === 'CUSTOM';
    var isPreset = !isWeek && !isCustom;

    if (dateSingle) {
      dateSingle.classList.toggle('hidden', !isWeek);
      if (isWeek && !dateSingle.value) {
        dateSingle.value = new Date().toISOString().substring(0, 10);
      }
    }
    if (rangeWrap) {
      rangeWrap.classList.toggle('hidden', !isCustom);
      rangeWrap.style.display = isCustom ? 'flex' : 'none';
    }
    if (tahunSel) {
      tahunSel.classList.toggle('hidden', !isPreset);
    }
  }

  function _buildFilterPayload() {
    var modeSel = document.getElementById('akn-filter-mode');
    var tahunSel = document.getElementById('akn-filter-tahun');
    var dateSingle = document.getElementById('akn-date-single');
    var dateStart = document.getElementById('akn-date-start');
    var dateEnd = document.getElementById('akn-date-end');

    var mode = (modeSel && modeSel.value) || 'WEEK';
    var payload = {
      mode: mode,
      tahun: tahunSel ? parseInt(tahunSel.value, 10) : new Date().getFullYear()
    };
    if (mode === 'WEEK') {
      payload.date = (dateSingle && dateSingle.value) || new Date().toISOString().substring(0, 10);
    } else if (mode === 'CUSTOM') {
      payload.startDate = (dateStart && dateStart.value) || '';
      payload.endDate = (dateEnd && dateEnd.value) || '';
    }
    return payload;
  }

  function _bindEvents() {
    if (_eventsBound) return;
    _eventsBound = true;

    var modeSel = document.getElementById('akn-filter-mode');
    var tahunSel = document.getElementById('akn-filter-tahun');
    var dateSingle = document.getElementById('akn-date-single');
    var dateStart = document.getElementById('akn-date-start');
    var dateEnd = document.getElementById('akn-date-end');
    var btnRefresh = document.getElementById('btn-akn-refresh');
    var btnRecalculate = document.getElementById('btn-akn-recalculate');
    var btnNoChange = document.getElementById('btn-akn-confirm-nochange');

    if (modeSel) {
      modeSel.onchange = function () {
        _syncFilterVisibility();
        load(_buildFilterPayload());
      };
    }
    if (tahunSel) {
      tahunSel.onchange = function () { load(_buildFilterPayload()); };
    }
    if (dateSingle) {
      dateSingle.onchange = function () { load(_buildFilterPayload()); };
    }
    if (dateStart) {
      dateStart.onchange = function () {
        if (dateEnd && dateEnd.value) load(_buildFilterPayload());
      };
    }
    if (dateEnd) {
      dateEnd.onchange = function () {
        load(_buildFilterPayload());
      };
    }

    if (btnRefresh) {
      btnRefresh.onclick = function () {
        load(_buildFilterPayload());
      };
    }

    if (btnRecalculate) {
      btnRecalculate.onclick = function () {
        _recalculateAkn();
      };
    }
  }

  function load(filterOrPeriode) {
    var token = AuthApp.getToken();
    if (!token) return;

    var req = (filterOrPeriode && typeof filterOrPeriode === 'object')
      ? filterOrPeriode
      : (filterOrPeriode ? String(filterOrPeriode).trim() : _buildFilterPayload());

    rpc('akn_getPapan', token, req)
      .then(function (res) {
        _data = res;
        _currentPeriode = res.periode;
        var pillEl = document.getElementById('akn-resolved-periode-pill');
        if (pillEl) {
          pillEl.textContent = (res.periodeWindow && res.periodeWindow.label) ? res.periodeWindow.label : res.periode;
        }
        _renderPapan(res);
        _loadTren();
      })
      .catch(function (err) {
        var msg = (err && err.message) ? err.message : 'Gagal memuat komposisi AKN.';
        Toast.error('Gagal memuat komposisi AKN: ' + msg);
        var tbM = document.getElementById('tbody-akn-matrix-display');
        if (tbM && !_data) {
          tbM.innerHTML = '<tr><td colspan="5"><div class="empty-state-box"><div class="empty-state-title">Gagal memuat komposisi AKN</div><div class="empty-state-desc">' + Format.escape(msg) + '</div><button type="button" class="btn btn-secondary-sm" onclick="AknView.load()">Coba lagi</button></div></td></tr>';
        }
      });
  }

  function _renderPapan(data) {
    // 1. Finding Subtitle & Status Banner
    var findingEl = document.getElementById('akn-finding-sub');
    var banner = document.getElementById('akn-status-banner');
    var bannerTitle = document.getElementById('akn-banner-title');
    var bannerDesc = document.getElementById('akn-banner-desc');
    var badgeHeader = document.getElementById('akn-badge-periode-header');

    if (badgeHeader) badgeHeader.textContent = 'Periode ' + data.periode;

    var totKes = (data.totals && data.totals.AKN_KESELURUHAN) || 0;
    var totPoa = (data.totals && data.totals.AKN_POA) || 0;
    var prevKes = (data.prevTotals && data.prevTotals.AKN_KESELURUHAN) || totKes;
    var deltaTotal = totKes - prevKes;

    if (findingEl) {
      findingEl.textContent = 'Total kekuatan personil ' + Format.number(totKes) + ' aparatur (' +
        Format.number(totPoa) + ' Dit. POA). Status ' + (data.isConfirmed ? 'terkonfirmasi' : 'tercatat aktif') + '.';
    }

    if (banner) {
      banner.classList.add('hidden');
    }

    // 2. Strip KPI Satu Kontainer
    var kpiKesEl = document.getElementById('kpi-akn-keseluruhan');
    var kpiDeltaEl = document.getElementById('kpi-akn-delta');
    if (kpiKesEl) kpiKesEl.textContent = Format.number(totKes);
    if (kpiDeltaEl) {
      kpiDeltaEl.innerHTML = Format.deltaText(deltaTotal, 'vs ' + (data.prevPeriode || 'lalu'));
    }

    var kpiPoaEl = document.getElementById('kpi-akn-poa');
    var kpiPoaPctEl = document.getElementById('kpi-akn-poa-pct');
    if (kpiPoaEl) kpiPoaEl.textContent = Format.number(totPoa);
    if (kpiPoaPctEl) {
      var poaPct = totKes > 0 ? ((totPoa / totKes) * 100).toFixed(1) : 0;
      kpiPoaPctEl.textContent = '(' + poaPct + '%)';
    }

    var kpiStatusText = document.getElementById('kpi-akn-status-text');
    var kpiStatusSub = document.getElementById('kpi-akn-status-sub');
    if (kpiStatusText) {
      kpiStatusText.textContent = data.isConfirmed ? 'Terkonfirmasi' : 'Terkalkulasi';
      kpiStatusText.style.color = data.isConfirmed ? 'var(--positive)' : 'var(--text)';
    }
    if (kpiStatusSub) {
      kpiStatusSub.textContent = data.sourcePeriode ? ('Periode acuan: ' + data.sourcePeriode) : 'Tercatat di periode ini';
    }

    var kpiPnsTotal = document.getElementById('kpi-akn-pns-total');
    if (kpiPnsTotal) {
      var pnsKes = (data.matrix && data.matrix.AKN_KESELURUHAN && data.matrix.AKN_KESELURUHAN.PNS) ? data.matrix.AKN_KESELURUHAN.PNS.jumlah : 0;
      kpiPnsTotal.textContent = Format.number(pnsKes);
    }

    // 3. Papan Matriks 5 Kategori Table
    var tbodyMatrix = document.getElementById('tbody-akn-matrix-display');
    if (tbodyMatrix) {
      var m = data.matrix || {};
      var prevM = data.prevMatrix || {};
      var rowsHtml = '';

      KATEGORIS.forEach(function (kat) {
        var poa = (m.AKN_POA && m.AKN_POA[kat]) ? m.AKN_POA[kat].jumlah : 0;
        var kes = (m.AKN_KESELURUHAN && m.AKN_KESELURUHAN[kat]) ? m.AKN_KESELURUHAN[kat].jumlah : 0;
        var prevKesItem = (prevM.AKN_KESELURUHAN && prevM.AKN_KESELURUHAN[kat]) ? prevM.AKN_KESELURUHAN[kat].jumlah : kes;
        var deltaKat = kes - prevKesItem;
        var pct = kes > 0 ? Math.round((poa / kes) * 100) : 0;

        rowsHtml +=
          '<tr>' +
            '<td>' +
              '<div class="cell-primary">' + (KATEGORI_LABELS[kat] || kat) + '</div>' +
              '<div class="cell-sub mono">' + kat + '</div>' +
            '</td>' +
            '<td class="text-right mono tnum" data-label="Dit. POA" style="color:var(--accent-ink); font-weight:600;">' + Format.number(poa) + '</td>' +
            '<td class="text-right mono tnum" data-label="PSDKP" style="font-weight:600;">' + Format.number(kes) + '</td>' +
            '<td data-label="Proporsi pusat">' +
              '<div style="display:flex; align-items:center; gap:8px;">' +
                '<div class="track-bar" style="flex:1;">' +
                  '<div class="track-fill" style="width:' + pct + '%;"></div>' +
                '</div>' +
                '<span class="mono tnum" style="font-size:11px; width:44px; text-align:right;">' + pct + '%</span>' +
              '</div>' +
            '</td>' +
            '<td class="text-right mono tnum" data-label="Dinamika">' + Format.deltaText(deltaKat) + '</td>' +
          '</tr>';
      });

      tbodyMatrix.innerHTML = rowsHtml;
    }

    var tfootPoa = document.getElementById('tfoot-poa-total');
    var tfootKes = document.getElementById('tfoot-kes-total');
    var tfootBar = document.getElementById('tfoot-ratio-bar');
    var tfootDelta = document.getElementById('tfoot-delta-total');

    if (tfootPoa) tfootPoa.textContent = Format.number(totPoa);
    if (tfootKes) tfootKes.textContent = Format.number(totKes);
    if (tfootBar) {
      var totPct = totKes > 0 ? Math.round((totPoa / totKes) * 100) : 0;
      tfootBar.style.width = totPct + '%';
    }
    if (tfootDelta) tfootDelta.innerHTML = Format.deltaText(deltaTotal);

    // 4. Render Rekap Kekuatan per Jabatan Awak
    _renderRekapJabatan(data.rekapJabatan || []);

    // 5. Render Riwayat Audit
    _renderRiwayat(data.riwayat || [], data.userRole);
  }

  function _renderRekapJabatan(list) {
    var tbody = document.getElementById('akn-rekap-jabatan-tbody');
    if (!tbody) return;
    if (!Array.isArray(list) || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:24px; color:var(--muted);">Belum ada data postur per jabatan.</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function (row) {
      var jbtName = row.kelompokJabatan || row.jabatan || '-';
      var ideal = row.idealArmada !== undefined ? row.idealArmada : (row.kebutuhan || 0);
      var diff = row.selisih || 0;
      var diffHtml = diff < 0
        ? '<span class="delta-down mono">' + diff + '</span>'
        : (diff > 0 ? '<span class="delta-up mono">+' + diff + '</span>' : '<span class="mono" style="color:var(--muted);">0</span>');
      var badge = ideal === 0
        ? '<span class="pill pill-neutral"><span class="pill-dot"></span>Penunjang</span>'
        : (diff >= 0
          ? '<span class="pill pill-positive"><span class="pill-dot"></span>Terpenuhi</span>'
          : '<span class="pill pill-negative"><span class="pill-dot"></span>Kurang ' + Math.abs(diff) + '</span>');
      return '<tr>' +
        '<td><div class="cell-primary">' + Format.escape(jbtName) + '</div></td>' +
        '<td class="text-right mono tnum" data-label="Dit. POA" style="color:var(--accent-ink);">' + Format.number(row.poaPusat || 0) + '</td>' +
        '<td class="text-right mono tnum" data-label="Eksisting" style="font-weight:600;">' + Format.number(row.eksisting || 0) + '</td>' +
        '<td class="text-right mono tnum" data-label="Ideal">' + (ideal > 0 ? Format.number(ideal) : '-') + '</td>' +
        '<td class="text-right" data-label="Selisih">' + diffHtml + '</td>' +
        '<td class="text-center" data-label="Ketercukupan">' + badge + '</td>' +
      '</tr>';
    }).join('');
  }

  function _recalculateAkn() {
    var token = AuthApp.getToken();
    if (!token) return;

    var btn = document.getElementById('btn-akn-recalculate');
    var origHtml = btn ? btn.innerHTML : '';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span>Menghitung kesimpulan...</span>';
    }

    rpc('akn_recalculate', token)
      .then(function (res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = origHtml;
        }
        Toast.success('Kesimpulan komposisi berhasil dihitung ulang dari data riil pegawai.');
        _data = res;
        _currentPeriode = res.periode;
        _renderPapan(res);
        _loadTren();
      })
      .catch(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = origHtml;
        }
        Toast.error('Gagal menghitung kesimpulan komposisi: ' + (err.message || err));
      });
  }

  function _renderRiwayat(rows) {
    var tbody = document.getElementById('akn-riwayat-tbody');
    if (!tbody) return;

    if (!rows || rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--muted);">Belum ada riwayat transaksi pada periode ini.</td></tr>';
      return;
    }

    var html = '';
    rows.forEach(function (r) {
      var scopeLabel = r.scope === 'AKN_POA' ? 'Pusat (POA)' : 'PSDKP';

      html += '<tr>' +
        '<td data-label="Status">' + Format.statusBadge(r.status) + '</td>' +
        '<td>' +
          '<div class="cell-primary">' + Format.escape(scopeLabel + ' — ' + (KATEGORI_LABELS[r.kategori] || r.kategori)) + '</div>' +
        '</td>' +
        '<td class="text-right mono tnum" data-label="Jumlah" style="font-weight:600;">' + Format.number(r.jumlah) + '</td>' +
        '<td class="mono" data-label="Waktu" style="font-size:11px; color:var(--muted);">' + Format.dateTime(r.timestamp) + '</td>' +
        '<td data-label="Keterangan" style="font-size:12px; color:var(--muted);">' + Format.escape(r.keterangan || 'Terkalkulasi otomatis') + '</td>' +
      '</tr>';
    });

    tbody.innerHTML = html;
  }

  function _loadTren() {
    var token = AuthApp.getToken();
    var container = document.getElementById('akn-chart-container');
    if (!container) return;

    rpc('akn_getTren', token, 12)
      .then(function (res) {
        var series = (res && Array.isArray(res.series)) ? res.series : (Array.isArray(res) ? res : []);
        _renderSvgLineChart(container, series);
      })
      .catch(function () {
        container.innerHTML = '<span style="font-size:12px; color:var(--muted);">Visualisasi tren belum tersedia.</span>';
      });
  }

  function _renderSvgLineChart(container, data) {
    if (typeof Charts !== 'undefined' && Charts.line) {
      Charts.line(container, data, {
        valueKey: 'totalPoa',
        labelKey: 'periode',
        unitLabel: 'Dit. POA'
      });
    }
  }

  return {
    init: init,
    load: load
  };
})();
</script>
