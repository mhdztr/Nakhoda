<script>
/**
 * html/Script_Akn.html
 * Controller Logika Klien Sub-Modul A: Komposisi AKN (Achromatic Ledger).
 * Nakhoda — Timja Pengawakan Dit. POA KKP RI
 */
var AknView = (function () {
  'use strict';

  var _currentPeriode = '';
  var _data = null;
  var _eventsBound = false;
  var KATEGORIS = ['PNS', 'PPPK_FUNGSIONAL', 'PPPK_PELAKSANA', 'PPPK_PARUH_WAKTU', 'PJLP'];
  var KATEGORI_LABELS = {
    'PNS': 'Pegawai negeri sipil (PNS)',
    'PPPK_FUNGSIONAL': 'PPPK tenaga fungsional',
    'PPPK_PELAKSANA': 'PPPK tenaga pelaksana',
    'PPPK_PARUH_WAKTU': 'PPPK paruh waktu',
    'PJLP': 'PJLP / pegawai non-ASN'
  };

  function init() {
    _bindEvents();
    load();
  }

  function _bindEvents() {
    if (_eventsBound) return;
    _eventsBound = true;

    var periodInput = document.getElementById('akn-periode-select');
    var btnRefresh = document.getElementById('btn-akn-refresh');
    var btnRecalculate = document.getElementById('btn-akn-recalculate');
    var btnNoChange = document.getElementById('btn-akn-confirm-nochange');

    if (btnRefresh) {
      btnRefresh.onclick = function () {
        var p = (periodInput && periodInput.value || '').trim();
        load(p);
      };
    }

    if (btnRecalculate) {
      btnRecalculate.onclick = function () {
        _recalculateAkn();
      };
    }

    if (btnNoChange) {
      btnNoChange.onclick = function () {
        _confirmNoChange();
      };
    }

    var formRevisi = document.getElementById('form-akn-revisi');
    if (formRevisi) {
      formRevisi.onsubmit = function (e) {
        e.preventDefault();
        _submitRevisi();
      };
    }

    var formAnulir = document.getElementById('form-akn-anulir');
    if (formAnulir) {
      formAnulir.onsubmit = function (e) {
        e.preventDefault();
        _submitAnulir();
      };
    }
  }

  function load(periode) {
    var token = AuthApp.getToken();
    if (!token) return;

    var targetP = (periode || _currentPeriode || '').trim();

    rpc('akn_getPapan', token, targetP)
      .then(function (res) {
        _data = res;
        _currentPeriode = res.periode;
        var periodInput = document.getElementById('akn-periode-select');
        if (periodInput) periodInput.value = res.periode;
        _renderPapan(res);
        _loadTren();
      })
      .catch(function (err) {
        Toast.error('Gagal memuat komposisi AKN: ' + err.message);
      });
  }

  function _renderPapan(data) {
    // 1. Finding Subtitle & Status Banner
    var findingEl = document.getElementById('akn-finding-sub');
    var banner = document.getElementById('akn-status-banner');
    var bannerTitle = document.getElementById('akn-banner-title');
    var bannerDesc = document.getElementById('akn-banner-desc');
    var badgeHeader = document.getElementById('akn-badge-periode-header');

    if (badgeHeader) badgeHeader.textContent = 'Periode ' + data.periode;

    var totKes = (data.totals && data.totals.AKN_KESELURUHAN) || 0;
    var totPoa = (data.totals && data.totals.AKN_POA) || 0;
    var prevKes = (data.prevTotals && data.prevTotals.AKN_KESELURUHAN) || totKes;
    var deltaTotal = totKes - prevKes;

    if (findingEl) {
      findingEl.textContent = 'Total kekuatan personil ' + Format.number(totKes) + ' aparatur (' +
        Format.number(totPoa) + ' Dit. POA). Status ' + (data.isConfirmed ? 'terkonfirmasi' : (data.isFullyCarried ? 'diwarisi (carry-forward)' : 'tercatat aktif')) + '.';
    }

    if (banner) {
      if (data.isConfirmed) {
        banner.classList.remove('hidden');
        banner.style.borderLeft = '4px solid var(--positive)';
        if (bannerTitle) bannerTitle.textContent = 'Status terkonfirmasi tanpa mutasi';
        if (bannerDesc) bannerDesc.textContent = 'Periode ini telah dikonfirmasi tidak memiliki perubahan mutasi personil (' + (data.konfirmasiCatatan || 'Tetap') + ').';
        var btnNoChange = document.getElementById('btn-akn-confirm-nochange');
        if (btnNoChange) btnNoChange.style.display = 'none';
      } else if (data.isFullyCarried) {
        banner.classList.remove('hidden');
        banner.style.borderLeft = '4px solid var(--accent)';
        if (bannerTitle) bannerTitle.textContent = 'Data diwarisi dari periode sebelumnya (carry-forward)';
        if (bannerDesc) bannerDesc.textContent = 'Belum ada mutasi baru pada ' + data.periode + '. Anda dapat mengonfirmasi tanpa mutasi atau menyimpan snapshot baru.';
        var btnNoChange2 = document.getElementById('btn-akn-confirm-nochange');
        if (btnNoChange2) btnNoChange2.style.display = 'inline-block';
      } else {
        banner.classList.add('hidden');
      }
    }

    // 2. Strip KPI Satu Kontainer
    var kpiKesEl = document.getElementById('kpi-akn-keseluruhan');
    var kpiDeltaEl = document.getElementById('kpi-akn-delta');
    if (kpiKesEl) kpiKesEl.textContent = Format.number(totKes);
    if (kpiDeltaEl) {
      kpiDeltaEl.innerHTML = Format.deltaText(deltaTotal, 'vs ' + (data.prevPeriode || 'lalu'));
    }

    var kpiPoaEl = document.getElementById('kpi-akn-poa');
    var kpiPoaPctEl = document.getElementById('kpi-akn-poa-pct');
    if (kpiPoaEl) kpiPoaEl.textContent = Format.number(totPoa);
    if (kpiPoaPctEl) {
      var poaPct = totKes > 0 ? ((totPoa / totKes) * 100).toFixed(1) : 0;
      kpiPoaPctEl.innerHTML = '<span class="mono">' + poaPct + '% dari total keseluruhan</span>';
    }

    var kpiStatusText = document.getElementById('kpi-akn-status-text');
    var kpiStatusSub = document.getElementById('kpi-akn-status-sub');
    if (kpiStatusText) {
      kpiStatusText.textContent = data.isConfirmed ? 'Terkonfirmasi' : (data.isFullyCarried ? 'Diwarisi (Carry)' : 'Snapshot Baru');
      kpiStatusText.style.color = data.isConfirmed ? 'var(--positive)' : (data.isFullyCarried ? 'var(--accent)' : 'var(--text)');
    }
    if (kpiStatusSub) {
      kpiStatusSub.textContent = data.isFullyCarried ? ('Sumber: ' + (data.sourcePeriode || data.prevPeriode)) : 'Tercatat di periode ini';
    }

    var kpiPnsTotal = document.getElementById('kpi-akn-pns-total');
    if (kpiPnsTotal) {
      var pnsKes = (data.matrix && data.matrix.AKN_KESELURUHAN && data.matrix.AKN_KESELURUHAN.PNS) ? data.matrix.AKN_KESELURUHAN.PNS.jumlah : 0;
      kpiPnsTotal.textContent = Format.number(pnsKes);
    }

    // 3. Papan Matriks 5 Kategori Table
    var tbodyMatrix = document.getElementById('tbody-akn-matrix-display');
    if (tbodyMatrix) {
      var m = data.matrix || {};
      var prevM = data.prevMatrix || {};
      var rowsHtml = '';

      KATEGORIS.forEach(function (kat) {
        var poa = (m.AKN_POA && m.AKN_POA[kat]) ? m.AKN_POA[kat].jumlah : 0;
        var kes = (m.AKN_KESELURUHAN && m.AKN_KESELURUHAN[kat]) ? m.AKN_KESELURUHAN[kat].jumlah : 0;
        var prevKesItem = (prevM.AKN_KESELURUHAN && prevM.AKN_KESELURUHAN[kat]) ? prevM.AKN_KESELURUHAN[kat].jumlah : kes;
        var deltaKat = kes - prevKesItem;
        var pct = kes > 0 ? Math.round((poa / kes) * 100) : 0;

        rowsHtml +=
          '<tr>' +
            '<td>' +
              '<div class="cell-primary">' + (KATEGORI_LABELS[kat] || kat) + '</div>' +
              '<div class="cell-sub mono">' + kat + '</div>' +
            '</td>' +
            '<td class="text-right mono tnum" style="color:var(--accent); font-weight:600;">' + Format.number(poa) + '</td>' +
            '<td class="text-right mono tnum" style="font-weight:600;">' + Format.number(kes) + '</td>' +
            '<td>' +
              '<div style="display:flex; align-items:center; gap:8px;">' +
                '<div class="track-bar" style="flex:1;">' +
                  '<div class="track-fill" style="width:' + pct + '%;"></div>' +
                '</div>' +
                '<span class="mono tnum" style="font-size:11px; width:44px; text-align:right;">' + pct + '%</span>' +
              '</div>' +
            '</td>' +
            '<td class="text-right mono tnum">' + Format.deltaText(deltaKat) + '</td>' +
          '</tr>';
      });

      tbodyMatrix.innerHTML = rowsHtml;
    }

    var tfootPoa = document.getElementById('tfoot-poa-total');
    var tfootKes = document.getElementById('tfoot-kes-total');
    var tfootBar = document.getElementById('tfoot-ratio-bar');
    var tfootDelta = document.getElementById('tfoot-delta-total');

    if (tfootPoa) tfootPoa.textContent = Format.number(totPoa);
    if (tfootKes) tfootKes.textContent = Format.number(totKes);
    if (tfootBar) {
      var totPct = totKes > 0 ? Math.round((totPoa / totKes) * 100) : 0;
      tfootBar.style.width = totPct + '%';
    }
    if (tfootDelta) tfootDelta.innerHTML = Format.deltaText(deltaTotal);

    // 4. Render Riwayat Audit
    _renderRiwayat(data.riwayat || [], data.userRole);
  }

  function _recalculateAkn() {
    var token = AuthApp.getToken();
    if (!token) return;

    var btn = document.getElementById('btn-akn-recalculate');
    var origHtml = btn ? btn.innerHTML : '';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span>Menghitung kesimpulan...</span>';
    }

    rpc('akn_recalculate', token)
      .then(function (res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = origHtml;
        }
        Toast.success('Kesimpulan komposisi berhasil dihitung ulang dari data riil pegawai.');
        _data = res;
        _currentPeriode = res.periode;
        _renderPapan(res);
        _loadTren();
      })
      .catch(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = origHtml;
        }
        Toast.error('Gagal menghitung kesimpulan komposisi: ' + (err.message || err));
      });
  }

  function _confirmNoChange() {
    var token = AuthApp.getToken();
    var periode = _currentPeriode;
    if (!confirm('Konfirmasi bahwa komposisi personil periode ' + periode + ' tetap dan tidak memiliki mutasi?')) {
      return;
    }

    rpc('akn_konfirmasiTanpaMutasi', {
      token: token,
      periode: periode,
      catatan: 'Dikonfirmasi tidak ada mutasi oleh staf'
    })
      .then(function (res) {
        Toast.success(res.message || 'Konfirmasi berhasil disimpan.');
        load(periode);
      })
      .catch(function (err) {
        Toast.error('Gagal konfirmasi: ' + err.message);
      });
  }

  function _renderRiwayat(rows, userRole) {
    var tbody = document.getElementById('akn-riwayat-tbody');
    if (!tbody) return;

    if (!rows || rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--muted);">Belum ada riwayat transaksi pada periode ini.</td></tr>';
      return;
    }

    var html = '';
    rows.forEach(function (r) {
      var canAnulir = (userRole === 'KADIV' || userRole === 'SUPERADMIN') && r.status === 'ACTIVE';
      var canRevisi = r.status === 'ACTIVE';
      var scopeLabel = r.scope === 'AKN_POA' ? 'Pusat (POA)' : 'PSDKP';

      html += '<tr>' +
        '<td>' + Format.statusBadge(r.status) + '</td>' +
        '<td>' +
          '<div class="cell-primary">' + Format.escape(scopeLabel + ' — ' + (KATEGORI_LABELS[r.kategori] || r.kategori)) + '</div>' +
          (r.keterangan ? '<div class="cell-sub">' + Format.escape(r.keterangan) + '</div>' : '') +
        '</td>' +
        '<td class="text-right mono tnum" style="font-weight:600;">' + Format.number(r.jumlah) + '</td>' +
        '<td class="mono" style="font-size:11px; color:var(--muted);">' + Format.dateTime(r.timestamp) + '</td>' +
        '<td class="text-center">' +
          '<div style="display:inline-flex; gap:4px;">' +
            (canRevisi ? '<button type="button" class="btn btn-secondary-sm btn-revisi" data-id="' + r.rowId + '" data-desc="' + scopeLabel + ' ' + (KATEGORI_LABELS[r.kategori] || r.kategori) + '" data-val="' + r.jumlah + '">Revisi</button>' : '') +
            (canAnulir ? '<button type="button" class="btn btn-danger-sm btn-anulir" data-id="' + r.rowId + '">Anulir</button>' : '') +
          '</div>' +
        '</td>' +
      '</tr>';
    });

    tbody.innerHTML = html;

    tbody.querySelectorAll('.btn-revisi').forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute('data-id');
        var desc = btn.getAttribute('data-desc');
        var val = btn.getAttribute('data-val');
        _openRevisiModal(id, desc, val);
      };
    });

    tbody.querySelectorAll('.btn-anulir').forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute('data-id');
        _openAnulirModal(id);
      };
    });
  }

  function _openRevisiModal(rowId, desc, val) {
    document.getElementById('revisi-row-id').value = rowId;
    document.getElementById('revisi-target-desc').textContent = desc;
    document.getElementById('revisi-jumlah-baru').value = val;
    document.getElementById('revisi-alasan').value = '';
    Modal.open('modal-akn-revisi');
  }

  function _submitRevisi() {
    var token = AuthApp.getToken();
    var rowId = document.getElementById('revisi-row-id').value;
    var jBaru = document.getElementById('revisi-jumlah-baru').value;
    var alasan = document.getElementById('revisi-alasan').value.trim();

    rpc('akn_revisi', {
      token: token,
      rowId: rowId,
      jumlahBaru: jBaru,
      alasanRevisi: alasan
    })
      .then(function (res) {
        Modal.close('modal-akn-revisi');
        Toast.success(res.message || 'Data berhasil direvisi.');
        load(_currentPeriode);
      })
      .catch(function (err) {
        Toast.error('Gagal revisi: ' + err.message);
      });
  }

  function _openAnulirModal(rowId) {
    document.getElementById('anulir-row-id').value = rowId;
    document.getElementById('anulir-alasan').value = '';
    Modal.open('modal-akn-anulir');
  }

  function _submitAnulir() {
    var token = AuthApp.getToken();
    var rowId = document.getElementById('anulir-row-id').value;
    var alasan = document.getElementById('anulir-alasan').value.trim();

    rpc('akn_anulir', {
      token: token,
      rowId: rowId,
      alasanAnulir: alasan
    })
      .then(function (res) {
        Modal.close('modal-akn-anulir');
        Toast.success(res.message || 'Data berhasil dianulir.');
        load(_currentPeriode);
      })
      .catch(function (err) {
        Toast.error('Gagal anulir: ' + err.message);
      });
  }

  function _loadTren() {
    var token = AuthApp.getToken();
    var container = document.getElementById('akn-chart-container');
    if (!container) return;

    rpc('akn_getTren', token, 12)
      .then(function (res) {
        var series = (res && Array.isArray(res.series)) ? res.series : (Array.isArray(res) ? res : []);
        _renderSvgLineChart(container, series);
      })
      .catch(function () {
        container.innerHTML = '<span style="font-size:12px; color:var(--muted);">Visualisasi tren belum tersedia.</span>';
      });
  }

  function _renderSvgLineChart(container, data) {
    if (!data || data.length === 0) {
      container.innerHTML = '<span style="font-size:12px; color:var(--muted);">Belum ada riwayat tren data multi-periode.</span>';
      return;
    }

    var width = container.clientWidth || 440;
    var height = 200;
    var padding = { top: 20, right: 24, bottom: 30, left: 44 };

    var maxVal = 10;
    data.forEach(function (d) {
      var k = d.totalKeseluruhan || 0;
      if (k > maxVal) maxVal = k;
    });
    maxVal = Math.ceil(maxVal * 1.12);

    var chartW = width - padding.left - padding.right;
    var chartH = height - padding.top - padding.bottom;
    var n = data.length;
    var stepX = n > 1 ? (chartW / (n - 1)) : chartW;

    var svg = '<svg width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '" style="font-family:var(--font-mono); font-size:10px;">';

    // Garis Grid Horizontal
    for (var g = 0; g <= 3; g++) {
      var val = Math.round((maxVal / 3) * g);
      var y = padding.top + chartH - (val / maxVal) * chartH;
      svg += '<line x1="' + padding.left + '" y1="' + y + '" x2="' + (width - padding.right) + '" y2="' + y + '" stroke="var(--rule)" stroke-dasharray="3,3" />';
      svg += '<text x="' + (padding.left - 6) + '" y="' + (y + 3) + '" text-anchor="end" fill="var(--muted)">' + val + '</text>';
    }

    // Bangun Jalur Polyline
    var pointsKes = [];
    var pointsPoa = [];

    data.forEach(function (d, i) {
      var x = padding.left + (n > 1 ? (i * stepX) : (chartW / 2));
      var yKes = padding.top + chartH - ((d.totalKeseluruhan || 0) / maxVal) * chartH;
      var yPoa = padding.top + chartH - ((d.totalPoa || 0) / maxVal) * chartH;

      pointsKes.push(x.toFixed(1) + ',' + yKes.toFixed(1));
      pointsPoa.push(x.toFixed(1) + ',' + yPoa.toFixed(1));

      var shortPeriod = String(d.periode || '').substring(5);
      svg += '<text x="' + x.toFixed(1) + '" y="' + (height - 8) + '" text-anchor="middle" fill="var(--muted)" font-size="9">' + Format.escape(shortPeriod) + '</text>';
    });

    // Jalur Keseluruhan (Tinta Gelap)
    svg += '<polyline points="' + pointsKes.join(' ') + '" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" />';

    // Jalur Dit. POA (Oranye Keselamatan)
    svg += '<polyline points="' + pointsPoa.join(' ') + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" />';

    // Titik Simpul
    data.forEach(function (d, i) {
      var x = padding.left + (n > 1 ? (i * stepX) : (chartW / 2));
      var yKes = padding.top + chartH - ((d.totalKeseluruhan || 0) / maxVal) * chartH;
      var yPoa = padding.top + chartH - ((d.totalPoa || 0) / maxVal) * chartH;

      svg += '<circle cx="' + x.toFixed(1) + '" cy="' + yKes.toFixed(1) + '" r="3" fill="#FFFFFF" stroke="var(--primary)" stroke-width="2"><title>' + d.periode + ' PSDKP: ' + d.totalKeseluruhan + '</title></circle>';
      svg += '<circle cx="' + x.toFixed(1) + '" cy="' + yPoa.toFixed(1) + '" r="3" fill="#FFFFFF" stroke="var(--accent)" stroke-width="2"><title>' + d.periode + ' Dit. POA: ' + d.totalPoa + '</title></circle>';
    });

    svg += '</svg>';
    container.innerHTML = svg;
  }

  return {
    init: init,
    load: load
  };
})();
</script>
