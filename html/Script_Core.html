<script>
/**
 * html/Script_Core.html
 * Pondasi Runtime Klien: RPC Bridge, Autentikasi, Hash Router, Toast, Modal, & Sheet.
 * Nakhoda — Timja Pengawakan Dit. POA KKP RI

// ===========================================================================
// 1. TOAST NOTIFICATION CONTROLLER (DESIGN.md §6.5)
// ===========================================================================
var Toast = (function () {
  'use strict';
  var container = null;

  function _ensureContainer() {
    if (!container) {
      container = document.getElementById('toaster');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toaster';
        document.body.appendChild(container);
      }
    }
    return container;
  }

  function show(message, type, durationMs) {
    var c = _ensureContainer();
    var t = type || 'info';
    var duration = durationMs || 4000;

    var toastEl = document.createElement('div');
    toastEl.className = 'toast toast-' + t;

    var iconSvg = '';
    if (t === 'success' || t === 'positive') {
      iconSvg = '<svg viewBox="0 0 24 24" class="toast-icon" style="stroke:var(--positive);"><polyline points="20 6 9 17 4 12"/></svg>';
    } else if (t === 'error' || t === 'negative') {
      iconSvg = '<svg viewBox="0 0 24 24" class="toast-icon" style="stroke:var(--negative);"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
    } else if (t === 'warning') {
      iconSvg = '<svg viewBox="0 0 24 24" class="toast-icon" style="stroke:var(--warning);"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    } else {
      iconSvg = '<svg viewBox="0 0 24 24" class="toast-icon" style="stroke:var(--primary);"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
    }

    toastEl.innerHTML = iconSvg + '<div class="toast-msg">' + Format.escape(message) + '</div>';
    c.appendChild(toastEl);

    setTimeout(function () {
      toastEl.style.opacity = '0';
      toastEl.style.transform = 'translateY(8px)';
      toastEl.style.transition = 'opacity 180ms ease, transform 180ms ease';
      setTimeout(function () {
        if (toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
      }, 200);
    }, duration);
  }

  return {
    show: show,
    success: function (msg, dur) { show(msg, 'success', dur); },
    error: function (msg, dur) { show(msg, 'error', dur); },
    warning: function (msg, dur) { show(msg, 'warning', dur); },
    info: function (msg, dur) { show(msg, 'info', dur); }
  };
})();

// ===========================================================================
// 2. MODAL CONTROLLER (DESIGN.md §6.4)
// ===========================================================================
var Modal = (function () {
  'use strict';

  function open(modalId) {
    var el = document.getElementById(modalId);
    if (!el) return;
    el.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function close(modalId) {
    var el = document.getElementById(modalId);
    if (!el) return;
    el.classList.remove('active');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var activeModals = document.querySelectorAll('.modal-overlay.active');
      activeModals.forEach(function (m) {
        m.classList.remove('active');
      });
      var activeSheets = document.querySelectorAll('.sheet-overlay.active');
      activeSheets.forEach(function (s) {
        s.classList.remove('active');
      });
      document.body.style.overflow = '';
    }
  });

  return {
    open: open,
    close: close
  };
})();

// ===========================================================================
// 3. SLIDE-OVER SHEET CONTROLLER (DESIGN.md §6.3 — 480px)
// ===========================================================================
var Sheet = (function () {
  'use strict';

  function open(panelId, overlayId) {
    var p = document.getElementById(panelId);
    var o = overlayId ? document.getElementById(overlayId) : null;
    if (p) p.classList.remove('hidden');
    if (o) o.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function close(panelId, overlayId) {
    var p = document.getElementById(panelId);
    var o = overlayId ? document.getElementById(overlayId) : null;
    if (p) p.classList.add('hidden');
    if (o) o.classList.remove('active');
    document.body.style.overflow = '';
  }

  return {
    open: open,
    close: close
  };
})();

// ===========================================================================
// 4. SHELL UI (Responsive & Sidebar Navigation)
// ===========================================================================
var ShellUI = (function () {
  'use strict';

  function toggleMobileNav() {
    var sb = document.getElementById('app-sidebar');
    var bd = document.getElementById('sidebar-backdrop');
    if (sb) sb.classList.toggle('mobile-open');
    if (bd) bd.classList.toggle('mobile-open');
  }

  function closeMobileNav() {
    var sb = document.getElementById('app-sidebar');
    var bd = document.getElementById('sidebar-backdrop');
    if (sb) sb.classList.remove('mobile-open');
    if (bd) bd.classList.remove('mobile-open');
  }

  return {
    toggleMobileNav: toggleMobileNav,
    closeMobileNav: closeMobileNav
  };
})();

// ===========================================================================
// 5. RPC BRIDGE (google.script.run Wrapper Multi-Argument)
// ===========================================================================
function rpc(funcName, params) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.warn('[RPC Mock]', funcName, args);
      return reject(new Error('google.script.run tidak tersedia di lingkungan ini.'));
    }

    var runner = google.script.run
      .withSuccessHandler(function (response) {
        if (!response) {
          return reject(new Error('Respon server kosong.'));
        }
        if (response.success === false) {
          var err = response.error || 'Terjadi kesalahan pada server.';
          if (err.indexOf('UNAUTHORIZED') !== -1) {
            Toast.error('Sesi Anda telah kedaluwarsa. Silakan masuk kembali.');
            AuthApp.logout(false);
          }
          return reject(new Error(err));
        }
        resolve(response.data);
      })
      .withFailureHandler(function (err) {
        var msg = err && err.message ? err.message : String(err);
        if (msg.indexOf('UNAUTHORIZED') !== -1) {
          Toast.error('Sesi Anda tidak valid. Silakan masuk kembali.');
          AuthApp.logout(false);
        }
        reject(new Error(msg));
      });

    if (typeof runner[funcName] !== 'function') {
      return reject(new Error('Fungsi RPC server "' + funcName + '" tidak ditemukan.'));
    }

    runner[funcName].apply(runner, args);
  });
}

// ===========================================================================
// 6. AUTH APP & SESSION CONTROLLER
// ===========================================================================
var AuthApp = (function () {
  'use strict';

  var STORAGE_TOKEN = 'nakhoda_token';
  var STORAGE_USER = 'nakhoda_user';
  var _currentUser = null;
  var _pendingOtpToken = null;
  var _regEmail = null;
  var _pollingInterval = null;

  function getToken() {
    return localStorage.getItem(STORAGE_TOKEN) || sessionStorage.getItem(STORAGE_TOKEN);
  }

  function setSession(token, user, remember) {
    _currentUser = user;
    if (remember) {
      localStorage.setItem(STORAGE_TOKEN, token);
      localStorage.setItem(STORAGE_USER, JSON.stringify(user));
    } else {
      sessionStorage.setItem(STORAGE_TOKEN, token);
      sessionStorage.setItem(STORAGE_USER, JSON.stringify(user));
    }
  }

  function clearSession() {
    _currentUser = null;
    localStorage.removeItem(STORAGE_TOKEN);
    localStorage.removeItem(STORAGE_USER);
    sessionStorage.removeItem(STORAGE_TOKEN);
    sessionStorage.removeItem(STORAGE_USER);
    if (_pollingInterval) {
      clearInterval(_pollingInterval);
      _pollingInterval = null;
    }
  }

  function getUser() {
    if (_currentUser) return _currentUser;
    var raw = localStorage.getItem(STORAGE_USER) || sessionStorage.getItem(STORAGE_USER);
    if (raw) {
      try { _currentUser = JSON.parse(raw); } catch (e) {}
    }
    return _currentUser;
  }

  function showAuthScreen() {
    var authRoot = document.getElementById('auth-root');
    var appShell = document.getElementById('app-shell');
    if (authRoot) authRoot.classList.remove('hidden');
    if (appShell) appShell.classList.add('hidden');
  }

  function showAppShell() {
    var authRoot = document.getElementById('auth-root');
    var appShell = document.getElementById('app-shell');
    if (authRoot) authRoot.classList.add('hidden');
    if (appShell) appShell.classList.remove('hidden');
    _updateShellProfile();
  }

  function _updateShellProfile() {
    var u = getUser();
    if (!u) return;
    var nameEl = document.getElementById('shell-user-name');
    var roleEl = document.getElementById('shell-user-role');
    var avatarEl = document.getElementById('shell-user-avatar');

    if (nameEl) nameEl.textContent = u.nama || u.email || 'Pengguna';
    if (roleEl) {
      var rTitle = 'Staf Pengawakan';
      if (u.role === 'SUPERADMIN') rTitle = 'Super Administrator';
      else if (u.role === 'DIREKTUR') rTitle = 'Direktur POA';
      else if (u.role === 'KADIV') rTitle = 'Ketua Timja Pengawakan';
      roleEl.textContent = rTitle;
    }
    if (avatarEl) {
      avatarEl.textContent = Format.initials(u.nama || u.email);
      avatarEl.style.backgroundColor = Format.avatarBg(u.nama || u.email);
      avatarEl.style.color = '#0F1214';
    }

    var adminGroup = document.getElementById('nav-group-admin');
    var adminNav = document.getElementById('nav-list-admin');
    var isPrivileged = (u.role === 'SUPERADMIN' || u.role === 'KADIV' || u.role === 'DIREKTUR');
    if (adminGroup) adminGroup.style.display = isPrivileged ? 'block' : 'none';
    if (adminNav) adminNav.style.display = isPrivileged ? 'flex' : 'none';
  }

  function init() {
    var token = getToken();
    if (!token) {
      showAuthScreen();
      _initAuthForms();
      return;
    }

    rpc('auth_getSessionInfo', token)
      .then(function (session) {
        if (!session || !session.userId) {
          clearSession();
          showAuthScreen();
          _initAuthForms();
          return;
        }
        setSession(token, session, true);
        showAppShell();
        _initAppEvents();
        Router.init();
      })
      .catch(function () {
        clearSession();
        showAuthScreen();
        _initAuthForms();
      });
  }

  function logout(notifyServer) {
    var token = getToken();
    if (notifyServer !== false && token) {
      rpc('auth_logout', token).catch(function () {});
    }
    clearSession();
    window.location.hash = '';
    showAuthScreen();
    _initAuthForms();
    Toast.info('Anda telah keluar dari sistem.');
  }

  function _showAlert(msg, isError) {
    var alertEl = document.getElementById('auth-alert');
    if (!alertEl) return;
    if (!msg) {
      alertEl.classList.add('hidden');
      alertEl.textContent = '';
      return;
    }
    alertEl.textContent = msg;
    alertEl.classList.remove('hidden');
    if (isError) {
      alertEl.style.backgroundColor = 'var(--pill-negative-bg)';
      alertEl.style.color = 'var(--pill-negative-ink)';
      alertEl.style.border = '1px solid #FFC9C9';
    } else {
      alertEl.style.backgroundColor = 'var(--pill-positive-bg)';
      alertEl.style.color = 'var(--pill-positive-ink)';
      alertEl.style.border = '1px solid #B2F2BB';
    }
  }

  function showLogin() {
    _showAlert('');
    var fLogin = document.getElementById('form-login');
    var fReg1 = document.getElementById('form-register-step1');
    var fReg2 = document.getElementById('form-register-step2');
    var vPending = document.getElementById('view-pending');

    if (fLogin) fLogin.classList.remove('hidden');
    if (fReg1) fReg1.classList.add('hidden');
    if (fReg2) fReg2.classList.add('hidden');
    if (vPending) vPending.classList.add('hidden');
  }

  function showRegister() {
    _showAlert('');
    var fLogin = document.getElementById('form-login');
    var fReg1 = document.getElementById('form-register-step1');
    var fReg2 = document.getElementById('form-register-step2');
    var vPending = document.getElementById('view-pending');

    if (fLogin) fLogin.classList.add('hidden');
    if (fReg1) fReg1.classList.remove('hidden');
    if (fReg2) fReg2.classList.add('hidden');
    if (vPending) vPending.classList.add('hidden');
  }

  function showRegisterStep1() {
    _showAlert('');
    var fReg1 = document.getElementById('form-register-step1');
    var fReg2 = document.getElementById('form-register-step2');
    if (fReg1) fReg1.classList.remove('hidden');
    if (fReg2) fReg2.classList.add('hidden');
  }

  function submitLogin() {
    _showAlert('');
    var identInput = document.getElementById('login-ident');
    var passInput = document.getElementById('login-password');
    var btnSubmit = document.getElementById('btn-submit-login');

    var ident = identInput ? identInput.value.trim() : '';
    var pass = passInput ? passInput.value : '';

    if (!ident || !pass) {
      _showAlert('Email atau NIP dan kata sandi wajib diisi.', true);
      return;
    }

    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Memverifikasi...';
    }

    rpc('auth_login', { identifier: ident, password: pass })
      .then(function (result) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Masuk ke Sistem';
        }

        if (!result || !result.user) {
          _showAlert('Respons masuk tidak valid dari server.', true);
          return;
        }

        if (result.user.status === 'PENDING') {
          _showApprovalScreen(result.user);
          return;
        }

        setSession(result.token, result.user, true);
        Toast.success('Selamat datang, ' + (result.user.nama || 'Rekan') + '.');
        showAppShell();
        _initAppEvents();
        Router.init();
      })
      .catch(function (err) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Masuk ke Sistem';
        }
        _showAlert(err.message || 'Gagal masuk. Periksa kembali email/NIP dan kata sandi.', true);
      });
  }

  function submitRegisterStep1() {
    _showAlert('');
    var namaEl = document.getElementById('reg-nama');
    var nipEl = document.getElementById('reg-nip');
    var emailEl = document.getElementById('reg-email');
    var roleEl = document.getElementById('reg-role');
    var passEl = document.getElementById('reg-password');
    var btnOtp = document.getElementById('btn-request-otp');

    var nama = namaEl ? namaEl.value.trim() : '';
    var nip = nipEl ? nipEl.value.trim() : '';
    var email = emailEl ? emailEl.value.trim().toLowerCase() : '';
    var role = roleEl ? roleEl.value : 'STAF';
    var pass = passEl ? passEl.value : '';

    if (!nama || !nip || !email || !pass) {
      _showAlert('Seluruh isian data wajib dilengkapi.', true);
      return;
    }

    if (btnOtp) {
      btnOtp.disabled = true;
      btnOtp.textContent = 'Mengirim Kode OTP...';
    }

    rpc('auth_requestOtp', {
      nama: nama,
      nip: nip,
      email: email,
      password: pass,
      divisiId: 'DIV-AWAK',
      roleDilamar: role
    })
      .then(function () {
        if (btnOtp) {
          btnOtp.disabled = false;
          btnOtp.textContent = 'Kirim Kode Verifikasi';
        }
        _regEmail = email;
        var sentEl = document.getElementById('otp-sent-email');
        if (sentEl) sentEl.textContent = email;

        var fReg1 = document.getElementById('form-register-step1');
        var fReg2 = document.getElementById('form-register-step2');
        if (fReg1) fReg1.classList.add('hidden');
        if (fReg2) fReg2.classList.remove('hidden');

        _showAlert('Kode verifikasi 6-digit telah dikirimkan ke email ' + email, false);
      })
      .catch(function (err) {
        if (btnOtp) {
          btnOtp.disabled = false;
          btnOtp.textContent = 'Kirim Kode Verifikasi';
        }
        _showAlert(err.message || 'Gagal mengirim kode verifikasi OTP.', true);
      });
  }

  function submitRegisterStep2() {
    _showAlert('');
    var otpInput = document.getElementById('reg-otp');
    var btnRegSubmit = document.getElementById('btn-submit-register');
    var code = otpInput ? otpInput.value.trim() : '';

    if (!code || code.length !== 6) {
      _showAlert('Masukkan 6-digit angka kode verifikasi OTP.', true);
      return;
    }

    if (btnRegSubmit) {
      btnRegSubmit.disabled = true;
      btnRegSubmit.textContent = 'Memverifikasi...';
    }

    rpc('auth_verifyOtp', { email: _regEmail, code: code })
      .then(function (otpResult) {
        _pendingOtpToken = otpResult.pendingToken;
        if (btnRegSubmit) btnRegSubmit.textContent = 'Mendaftarkan Akun...';

        var payload = {
          nama: document.getElementById('reg-nama').value.trim(),
          nip: document.getElementById('reg-nip').value.trim(),
          email: _regEmail,
          password: document.getElementById('reg-password').value,
          divisiId: 'DIV-AWAK',
          roleDilamar: document.getElementById('reg-role').value,
          pendingToken: _pendingOtpToken
        };

        return rpc('auth_register', payload);
      })
      .then(function (regResult) {
        if (btnRegSubmit) {
          btnRegSubmit.disabled = false;
          btnRegSubmit.textContent = 'Verifikasi & Daftarkan Akun';
        }
        Toast.success('Pendaftaran akun berhasil dikirim.');
        _showApprovalScreen(regResult);
      })
      .catch(function (err) {
        if (btnRegSubmit) {
          btnRegSubmit.disabled = false;
          btnRegSubmit.textContent = 'Verifikasi & Daftarkan Akun';
        }
        _showAlert(err.message || 'Verifikasi kode OTP gagal.', true);
      });
  }

  function _showApprovalScreen(userData) {
    _showAlert('');
    var fLogin = document.getElementById('form-login');
    var fReg1 = document.getElementById('form-register-step1');
    var fReg2 = document.getElementById('form-register-step2');
    var vPending = document.getElementById('view-pending');

    if (fLogin) fLogin.classList.add('hidden');
    if (fReg1) fReg1.classList.add('hidden');
    if (fReg2) fReg2.classList.add('hidden');
    if (vPending) {
      vPending.classList.remove('hidden');
      var nameEl = document.getElementById('pending-user-name');
      if (nameEl) nameEl.textContent = userData.nama || userData.email || 'Pengguna';

      if (_pollingInterval) clearInterval(_pollingInterval);
      _pollingInterval = setInterval(function () {
        rpc('auth_checkRegistrationStatus', { email: userData.email, userId: userData.userId })
          .then(function (st) {
            if (st && st.status === 'APPROVED') {
              clearInterval(_pollingInterval);
              Toast.success('Akun Anda telah disetujui. Silakan masuk.');
              showLogin();
            } else if (st && st.status === 'REJECTED') {
              clearInterval(_pollingInterval);
              Toast.error('Pendaftaran ditolak: ' + (st.alasanReject || 'Tidak memenuhi kualifikasi'));
            }
          })
          .catch(function () {});
      }, 8000);
    }
  }

  function _initAuthForms() {
    showLogin();
  }

  function _initAppEvents() {
    var btnLogout = document.getElementById('btn-logout');
    if (btnLogout) {
      btnLogout.onclick = function () {
        if (confirm('Apakah Anda yakin ingin keluar dari Nakhoda?')) {
          logout(true);
        }
      };
    }
  }

  return {
    init: init,
    getToken: getToken,
    getUser: getUser,
    logout: logout,
    showLogin: showLogin,
    showRegister: showRegister,
    showRegisterStep1: showRegisterStep1,
    submitLogin: submitLogin,
    submitRegisterStep1: submitRegisterStep1,
    submitRegisterStep2: submitRegisterStep2
  };
})();

// ===========================================================================
// 7. CLIENT-SIDE HASH ROUTER (Tanpa Kloning DOM)
// ===========================================================================
var Router = (function () {
  'use strict';

  var _routes = {};
  var _currentRoute = null;

  function register(route, handler) {
    _routes[route] = handler;
  }

  function navigate(route) {
    window.location.hash = '#/' + route;
  }

  function _handleHashChange() {
    var rawHash = window.location.hash || '#/ringkasan';
    var cleanRoute = rawHash.replace(/^#\/?/, '').split('?')[0] || 'ringkasan';

    // Highlight nav item di sidebar
    var navItems = document.querySelectorAll('#app-sidebar .nav-item');
    navItems.forEach(function (btn) {
      var btnRoute = btn.getAttribute('data-route');
      if (btnRoute === cleanRoute) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    // Perbarui label rute di header mobile
    var routeLabels = {
      'ringkasan': 'Ringkasan',
      'komposisi': 'Komposisi AKN',
      'direktori': 'Direktori awak',
      'kompetensi': 'Kompetensi & BST',
      'sijil': 'Papan sijil kapal',
      'kegiatan': 'Log kegiatan',
      'laporan': 'Laporan eksekutif',
      'admin-users': 'Pengguna & akses',
      'admin-audit': 'Catatan audit'
    };
    var lblEl = document.getElementById('mobile-route-label');
    if (lblEl) lblEl.textContent = routeLabels[cleanRoute] || 'Nakhoda';

    // Tutup mobile nav jika terbuka
    ShellUI.closeMobileNav();

    // Sembunyikan seluruh view yang ada di dalam #outlet-content
    var allViews = document.querySelectorAll('#outlet-content > .app-view, #outlet-content > .view-panel');
    allViews.forEach(function (v) {
      v.classList.add('hidden');
    });

    // Temukan kontainer tampilan yang sesuai
    var targetViewId = 'view-' + cleanRoute;
    if (cleanRoute === 'admin-users' || cleanRoute === 'admin-audit') {
      targetViewId = 'view-admin';
    }

    var targetView = document.getElementById(targetViewId);
    if (targetView) {
      targetView.classList.remove('hidden');
    }

    _currentRoute = cleanRoute;

    var handler = _routes[cleanRoute];
    if (typeof handler === 'function') {
      handler();
    }
  }

  function init() {
    // Daftarkan seluruh rute operasional
    register('ringkasan', function () {
      if (typeof RingkasanView !== 'undefined' && RingkasanView.init) {
        RingkasanView.init();
      }
    });

    register('komposisi', function () {
      if (typeof AknView !== 'undefined' && AknView.init) {
        AknView.init();
      }
    });

    register('direktori', function () {
      if (typeof DirektoriView !== 'undefined' && DirektoriView.init) {
        DirektoriView.init();
      }
    });

    register('kompetensi', function () {
      if (typeof KompetensiView !== 'undefined' && KompetensiView.init) {
        KompetensiView.init();
      }
    });

    register('sijil', function () {
      if (typeof SijilView !== 'undefined' && SijilView.init) {
        SijilView.init();
      }
    });

    register('kegiatan', function () {
      if (typeof KegiatanView !== 'undefined' && KegiatanView.init) {
        KegiatanView.init();
      }
    });

    register('laporan', function () {
      if (typeof LaporanView !== 'undefined' && LaporanView.init) {
        LaporanView.init();
      }
    });

    register('admin-users', function () {
      if (typeof AdminView !== 'undefined' && AdminView.init) {
        AdminView.init('users');
      }
    });

    register('admin-audit', function () {
      if (typeof AdminView !== 'undefined' && AdminView.init) {
        AdminView.init('audit');
      }
    });

    // Pasang click listener di tombol navigasi sidebar
    var navItems = document.querySelectorAll('#app-sidebar .nav-item');
    navItems.forEach(function (btn) {
      btn.onclick = function () {
        var r = btn.getAttribute('data-route');
        if (r) navigate(r);
      };
    });

    window.addEventListener('hashchange', _handleHashChange);
    _handleHashChange();
  }

  return {
    init: init,
    register: register,
    navigate: navigate,
    getCurrentRoute: function () { return _currentRoute; }
  };
})();

// ===========================================================================
// INITIALIZATION ON DOM READY
// ===========================================================================
document.addEventListener('DOMContentLoaded', function () {
  AuthApp.init();
});
</script>
