// ===========================================================================
// 1. TOAST NOTIFICATION CONTROLLER (DESIGN.md §6.5)
// ===========================================================================
var Toast = (function () {
  'use strict';
  var container = null;

  function _ensureContainer() {
    if (!container) {
      container = document.getElementById('toaster');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toaster';
        document.body.appendChild(container);
      }
    }
    return container;
  }

  function show(message, type, durationMs) {
    var c = _ensureContainer();
    var t = type || 'info';
    var duration = durationMs || 4000;

    var toastEl = document.createElement('div');
    toastEl.className = 'toast toast-' + t;

    var iconSvg = '';
    if (t === 'success' || t === 'positive') {
      iconSvg = '<svg viewBox="0 0 24 24" class="toast-icon" style="stroke:var(--positive);"><polyline points="20 6 9 17 4 12"/></svg>';
    } else if (t === 'error' || t === 'negative') {
      iconSvg = '<svg viewBox="0 0 24 24" class="toast-icon" style="stroke:var(--negative);"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
    } else if (t === 'warning') {
      iconSvg = '<svg viewBox="0 0 24 24" class="toast-icon" style="stroke:var(--warning);"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    } else {
      iconSvg = '<svg viewBox="0 0 24 24" class="toast-icon" style="stroke:var(--primary);"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
    }

    toastEl.innerHTML = iconSvg + '<div class="toast-msg">' + Format.escape(message) + '</div>';
    c.appendChild(toastEl);

    setTimeout(function () {
      toastEl.style.opacity = '0';
      toastEl.style.transform = 'translateY(8px)';
      toastEl.style.transition = 'opacity 180ms ease, transform 180ms ease';
      setTimeout(function () {
        if (toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
      }, 200);
    }, duration);
  }

  return {
    show: show,
    success: function (msg, dur) { show(msg, 'success', dur); },
    error: function (msg, dur) { show(msg, 'error', dur); },
    warning: function (msg, dur) { show(msg, 'warning', dur); },
    info: function (msg, dur) { show(msg, 'info', dur); }
  };
})();

// ===========================================================================
// 2. MODAL CONTROLLER (DESIGN.md §6.4)
// ===========================================================================
var Modal = (function () {
  'use strict';

  function open(modalId) {
    var el = document.getElementById(modalId);
    if (!el) return;
    el.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function close(modalId) {
    var el = document.getElementById(modalId);
    if (!el) return;
    el.classList.remove('active');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var activeModals = document.querySelectorAll('.modal-overlay.active');
      Array.prototype.forEach.call(activeModals, function (m) {
        m.classList.remove('active');
      });
      var activeSheets = document.querySelectorAll('.sheet-overlay.active');
      Array.prototype.forEach.call(activeSheets, function (s) {
        s.classList.remove('active');
      });
      var openPanels = document.querySelectorAll('.sheet-panel:not(.hidden)');
      Array.prototype.forEach.call(openPanels, function (p) {
        p.classList.add('hidden');
      });
      document.body.style.overflow = '';
    }
  });

  function confirm(opts) {
    var o = opts || {};
    var titleEl = document.getElementById('confirm-modal-title');
    var msgEl = document.getElementById('confirm-modal-message');
    var okBtn = document.getElementById('btn-confirm-ok');
    if (!titleEl || !msgEl || !okBtn) {
      if (typeof o.onConfirm === 'function') o.onConfirm();
      return;
    }
    titleEl.textContent = o.title || 'Konfirmasi tindakan';
    msgEl.textContent = o.message || 'Lanjutkan tindakan ini?';
    okBtn.textContent = o.confirmLabel || 'Lanjutkan';
    okBtn.className = o.danger ? 'btn btn-danger-md' : 'btn btn-primary-md';
    okBtn.onclick = function () {
      close('modal-global-confirm');
      if (typeof o.onConfirm === 'function') o.onConfirm();
    };
    open('modal-global-confirm');
  }

  return {
    open: open,
    close: close,
    confirm: confirm
  };
})();

// ===========================================================================
// 3. SLIDE-OVER SHEET CONTROLLER (DESIGN.md §6.3 — 480px)
// ===========================================================================
var Sheet = (function () {
  'use strict';

  function open(panelId, overlayId) {
    var p = document.getElementById(panelId);
    var o = overlayId ? document.getElementById(overlayId) : null;
    if (p) p.classList.remove('hidden');
    if (o) o.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function close(panelId, overlayId) {
    var p = document.getElementById(panelId);
    var o = overlayId ? document.getElementById(overlayId) : null;
    if (p) p.classList.add('hidden');
    if (o) o.classList.remove('active');
    document.body.style.overflow = '';
  }

  function confirm(opts) {
    var o = opts || {};
    var titleEl = document.getElementById('confirm-modal-title');
    var msgEl = document.getElementById('confirm-modal-message');
    var okBtn = document.getElementById('btn-confirm-ok');
    if (!titleEl || !msgEl || !okBtn) {
      if (typeof o.onConfirm === 'function') o.onConfirm();
      return;
    }
    titleEl.textContent = o.title || 'Konfirmasi tindakan';
    msgEl.textContent = o.message || 'Lanjutkan tindakan ini?';
    okBtn.textContent = o.confirmLabel || 'Lanjutkan';
    okBtn.className = o.danger ? 'btn btn-danger-md' : 'btn btn-primary-md';
    okBtn.onclick = function () {
      close('modal-global-confirm');
      if (typeof o.onConfirm === 'function') o.onConfirm();
    };
    open('modal-global-confirm');
  }

  return {
    open: open,
    close: close,
    confirm: confirm
  };
})();

// ===========================================================================
// 4. SHELL UI (Responsive & Sidebar Navigation)
// ===========================================================================
var ShellUI = (function () {
  'use strict';

  function toggleMobileNav() {
    var sb = document.getElementById('app-sidebar');
    var bd = document.getElementById('sidebar-backdrop');
    if (sb) sb.classList.toggle('mobile-open');
    if (bd) bd.classList.toggle('mobile-open');
  }

  function closeMobileNav() {
    var sb = document.getElementById('app-sidebar');
    var bd = document.getElementById('sidebar-backdrop');
    if (sb) sb.classList.remove('mobile-open');
    if (bd) bd.classList.remove('mobile-open');
  }

  function syncHeaderDatum() {
    if (window.innerWidth <= 768) {
      document.documentElement.style.removeProperty('--header-datum-h');
      return;
    }
    var brand = document.querySelector('#app-sidebar .brand-box');
    if (brand && brand.offsetHeight > 0) {
      document.documentElement.style.setProperty('--header-datum-h', brand.offsetHeight + 'px');
    }
  }

  /**
   * Mengunci seluruh input type="date" agar pengguna selalu memilih dari kalender (dilarang ketik manual).
   */
  function bindCalendarInputs(rootEl) {
    var scope = rootEl || document;
    var inputs = scope.querySelectorAll('input[type="date"]');
    Array.prototype.forEach.call(inputs, function (inp) {
      if (inp.getAttribute('data-cal-bound') === '1') return;
      inp.setAttribute('data-cal-bound', '1');
      if (!inp.getAttribute('title')) {
        inp.setAttribute('title', 'Pilih tanggal melalui ikon kalender (ketik manual dinonaktifkan)');
      }
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Tab' || e.key === 'Escape') return;
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') {
          e.preventDefault();
          if (typeof inp.showPicker === 'function') {
            try { inp.showPicker(); } catch (ignore) {}
          }
          return;
        }
        e.preventDefault();
      });
      inp.addEventListener('paste', function (e) {
        e.preventDefault();
      });
      inp.addEventListener('click', function () {
        if (typeof inp.showPicker === 'function') {
          try { inp.showPicker(); } catch (ignore) {}
        }
      });
    });
  }

  function bindRowKeyboard(tr, handler) {
    if (!tr || typeof handler !== 'function') return;
    tr.setAttribute('tabindex', '0');
    tr.setAttribute('role', 'button');
    tr.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        if (e.target && /^(button|input|select|a)$/i.test(e.target.tagName)) return;
        e.preventDefault();
        handler(e);
      }
    });
  }

  function skeletonRows(colCount, rowCount) {
    var cols = colCount || 4;
    var rows = rowCount || 4;
    var html = '';
    for (var r = 0; r < rows; r++) {
      html += '<tr>';
      for (var c = 0; c < cols; c++) {
        var w = c === 0 ? '68%' : (c === cols - 1 ? '44px' : '55%');
        html += '<td><span class="skeleton-bar" style="width:' + w + ';"></span></td>';
      }
      html += '</tr>';
    }
    return html;
  }

  return {
    toggleMobileNav: toggleMobileNav,
    closeMobileNav: closeMobileNav,
    syncHeaderDatum: syncHeaderDatum,
    bindCalendarInputs: bindCalendarInputs,
    bindRowKeyboard: bindRowKeyboard,
    skeletonRows: skeletonRows
  };
})();

// ===========================================================================
// 5. GLOBAL LOADING CONTROLLER & RPC BRIDGE (google.script.run Wrapper)
// ===========================================================================
var GlobalLoader = (function () {
  'use strict';
  var _activeCount = 0;
  var _pillTimer = null;

  var LABEL_MAP = {
    'ringkasan_': 'Memuat Ringkasan...',
    'akn_': 'Memuat Komposisi AKN...',
    'dir_syncSikap': 'Sync data SIKAP...',
    'dir_': 'Memuat Direktori Awak...',
    'kom_saveSertifikat': 'Menyimpan sertifikat...',
    'kom_': 'Memuat Kompetensi...',
    'sijil_assignAwak': 'Menempatkan awak kapal...',
    'sijil_uploadSuratTugas': 'Mengunggah Surat Tugas...',
    'sijil_': 'Memuat Papan Sijil...',
    'keg_': 'Memuat Log Kegiatan...',
    'lap_': 'Memuat Executive Report...',
    'admin_': 'Memuat User & Audit Log...',
    'auth_': 'Memeriksa sesi...'
  };

  function _resolveLabel(funcName) {
    var fn = String(funcName || '');
    for (var prefix in LABEL_MAP) {
      if (Object.prototype.hasOwnProperty.call(LABEL_MAP, prefix) && fn.indexOf(prefix) === 0) {
        return LABEL_MAP[prefix];
      }
    }
    return 'Memuat data...';
  }

  function start(labelOrFunc) {
    _activeCount++;
    var bar = document.getElementById('global-top-loader');
    var pill = document.getElementById('global-loading-pill');
    var txt = document.getElementById('global-loading-text');

    if (bar) bar.classList.remove('hidden');
    if (txt) {
      var isCustom = typeof labelOrFunc === 'string' && labelOrFunc.indexOf(' ') !== -1;
      txt.textContent = isCustom ? labelOrFunc : _resolveLabel(labelOrFunc);
    }

    // Putar ikon pada tombol Refresh/Sync yang aktif
    var refreshBtns = document.querySelectorAll('button[id$="-refresh"], #btn-sync-sikap');
    Array.prototype.forEach.call(refreshBtns, function (btn) {
      btn.classList.add('is-loading-spin');
    });

    if (!_pillTimer && pill) {
      _pillTimer = setTimeout(function () {
        if (_activeCount > 0 && pill) {
          pill.classList.remove('hidden');
        }
      }, 120);
    }
  }

  function done() {
    _activeCount = Math.max(0, _activeCount - 1);
    if (_activeCount === 0) {
      if (_pillTimer) {
        clearTimeout(_pillTimer);
        _pillTimer = null;
      }
      var bar = document.getElementById('global-top-loader');
      var pill = document.getElementById('global-loading-pill');
      if (bar) bar.classList.add('hidden');
      if (pill) pill.classList.add('hidden');

      var spinBtns = document.querySelectorAll('.is-loading-spin');
      Array.prototype.forEach.call(spinBtns, function (btn) {
        btn.classList.remove('is-loading-spin');
      });
    }
  }

  return {
    start: start,
    done: done
  };
})();

function _resolveViewIdFromRpc(funcName) {
  var map = {
    'ringkasan_': 'view-ringkasan',
    'akn_': 'view-komposisi',
    'dir_': 'view-direktori',
    'kom_': 'view-kompetensi',
    'sijil_': 'view-sijil',
    'keg_': 'view-kegiatan',
    'lap_': 'view-laporan',
    'admin_': 'view-admin'
  };
  var fn = String(funcName || '');
  for (var prefix in map) {
    if (Object.prototype.hasOwnProperty.call(map, prefix) && fn.indexOf(prefix) === 0) {
      return map[prefix];
    }
  }
  return '';
}

function _markViewSynced(funcName) {
  var viewId = _resolveViewIdFromRpc(funcName);
  var targetView = viewId
    ? document.getElementById(viewId)
    : document.querySelector('#outlet-content > .app-view:not(.hidden)');
  if (!targetView) return;
  var actions = targetView.querySelector('.page-actions');
  if (!actions) return;
  var el = actions.querySelector('.page-sync-time');
  if (!el) {
    el = document.createElement('span');
    el.className = 'page-sync-time';
    actions.insertBefore(el, actions.firstChild);
  }
  var now = new Date();
  var h = now.getHours();
  var m = now.getMinutes();
  el.textContent = 'Updated ' + (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
}

function rpc(funcName, params) {
  var args = Array.prototype.slice.call(arguments, 1);
  var skipLoader = (funcName === 'auth_checkRegistrationStatus');
  return new Promise(function (resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.warn('[RPC Mock]', funcName, args);
      return reject(new Error('google.script.run tidak tersedia di environment ini.'));
    }

    if (!skipLoader) GlobalLoader.start(funcName);

    var runner = google.script.run
      .withSuccessHandler(function (response) {
        if (!skipLoader) GlobalLoader.done();
        if (!response) {
          return reject(new Error('Empty response from server.'));
        }
        if (response.success === false) {
          var err = response.error || 'Terjadi error pada server.';
          if (err.indexOf('UNAUTHORIZED') !== -1 && funcName.indexOf('auth_') !== 0) {
            AuthApp.promptReauth();
          }
          return reject(new Error(err));
        }
        if (funcName.indexOf('auth_') !== 0) {
          _markViewSynced(funcName);
        }
        resolve(response.data);
      })
      .withFailureHandler(function (err) {
        if (!skipLoader) GlobalLoader.done();
        var msg = err && err.message ? err.message : String(err);
        if (msg.indexOf('UNAUTHORIZED') !== -1 && funcName.indexOf('auth_') !== 0) {
          AuthApp.promptReauth();
        }
        reject(new Error(msg));
      });

    if (typeof runner[funcName] !== 'function') {
      if (!skipLoader) GlobalLoader.done();
      return reject(new Error('Fungsi RPC server "' + funcName + '" tidak ditemukan.'));
    }

    runner[funcName].apply(runner, args);
  });
}

// ===========================================================================
// 6. AUTH APP & SESSION CONTROLLER
// ===========================================================================
var AuthApp = (function () {
  'use strict';

  var STORAGE_TOKEN = 'nakhoda_token';
  var STORAGE_USER = 'nakhoda_user';
  var _currentUser = null;
  var _memoryToken = null;
  var _pendingOtpToken = null;
  var _regEmail = null;
  var _pollingInterval = null;

  function getToken() {
    if (_memoryToken) return _memoryToken;
    try {
      return localStorage.getItem(STORAGE_TOKEN) || sessionStorage.getItem(STORAGE_TOKEN);
    } catch (e) {
      return _memoryToken;
    }
  }

  function setSession(token, user, remember) {
    _memoryToken = token;
    _currentUser = user;
    try {
      if (remember) {
        localStorage.setItem(STORAGE_TOKEN, token);
        localStorage.setItem(STORAGE_USER, JSON.stringify(user));
      } else {
        sessionStorage.setItem(STORAGE_TOKEN, token);
        sessionStorage.setItem(STORAGE_USER, JSON.stringify(user));
      }
    } catch (e) {}
  }

  function clearSession() {
    _memoryToken = null;
    _currentUser = null;
    try {
      localStorage.removeItem(STORAGE_TOKEN);
      localStorage.removeItem(STORAGE_USER);
      sessionStorage.removeItem(STORAGE_TOKEN);
      sessionStorage.removeItem(STORAGE_USER);
    } catch (e) {}
    if (_pollingInterval) {
      clearInterval(_pollingInterval);
      _pollingInterval = null;
    }
  }

  function getUser() {
    if (_currentUser) return _currentUser;
    try {
      var raw = localStorage.getItem(STORAGE_USER) || sessionStorage.getItem(STORAGE_USER);
      if (raw) _currentUser = JSON.parse(raw);
    } catch (e) {}
    return _currentUser;
  }

  function showAuthScreen() {
    var authRoot = document.getElementById('auth-root');
    var appShell = document.getElementById('app-shell');
    if (authRoot) authRoot.classList.remove('hidden');
    if (appShell) appShell.classList.add('hidden');
  }

  function showAppShell() {
    var authRoot = document.getElementById('auth-root');
    var appShell = document.getElementById('app-shell');
    if (authRoot) authRoot.classList.add('hidden');
    if (appShell) appShell.classList.remove('hidden');
    _updateShellProfile();
    ShellUI.syncHeaderDatum();
    ShellUI.bindCalendarInputs(document);
    if (!ShellUI._datumBound) {
      ShellUI._datumBound = true;
      window.addEventListener('resize', ShellUI.syncHeaderDatum);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(ShellUI.syncHeaderDatum);
      }
    }
  }

  function _updateShellProfile() {
    var u = getUser();
    if (!u) return;
    var nameEl = document.getElementById('shell-user-name');
    var roleEl = document.getElementById('shell-user-role');
    var avatarEl = document.getElementById('shell-user-avatar');

    if (nameEl) {
      nameEl.textContent = u.nama || u.email || 'Pengguna';
      nameEl.title = u.nama || u.email || 'Pengguna';
    }
    if (roleEl) {
      var rTitle = 'Staf Pengawakan';
      if (u.role === 'SUPERADMIN') rTitle = 'Super Administrator';
      else if (u.role === 'DIREKTUR') rTitle = 'Direktur POA';
      else if (u.role === 'KADIV') rTitle = 'Ketua Timja Pengawakan';
      roleEl.textContent = rTitle;
      roleEl.title = rTitle;
    }
    if (avatarEl) {
      avatarEl.textContent = Format.initials(u.nama || u.email);
      avatarEl.style.backgroundColor = Format.avatarBg(u.nama || u.email);
      avatarEl.style.color = '#0F1214';
    }

    var adminGroup = document.getElementById('nav-group-admin');
    var adminNav = document.getElementById('nav-list-admin');
    var isPrivileged = (u.role === 'SUPERADMIN' || u.role === 'KADIV' || u.role === 'DIREKTUR');
    if (adminGroup) adminGroup.style.display = isPrivileged ? 'block' : 'none';
    if (adminNav) adminNav.style.display = isPrivileged ? 'flex' : 'none';
  }

  function init() {
    var token = getToken();
    if (!token) {
      showAuthScreen();
      _initAuthForms();
      return;
    }

    rpc('auth_getSessionInfo', token)
      .then(function (session) {
        if (!session || !session.userId) {
          clearSession();
          showAuthScreen();
          _initAuthForms();
          return;
        }
        setSession(token, session, true);
        showAppShell();
        _initAppEvents();
        Router.init();
      })
      .catch(function () {
        clearSession();
        showAuthScreen();
        _initAuthForms();
      });
  }

  function logout(notifyServer) {
    var token = getToken();
    if (notifyServer !== false && token) {
      rpc('auth_logout', token).catch(function () {});
    }
    clearSession();
    window.location.hash = '';
    showAuthScreen();
    _initAuthForms();
    Toast.info('Anda telah keluar dari sistem.');
  }

  function _showAlert(msg, isError) {
    var alertEl = document.getElementById('auth-alert');
    if (!alertEl) return;
    if (!msg) {
      alertEl.classList.add('hidden');
      alertEl.textContent = '';
      return;
    }
    alertEl.textContent = msg;
    alertEl.classList.remove('hidden');
    if (isError) {
      alertEl.style.backgroundColor = 'var(--pill-negative-bg)';
      alertEl.style.color = 'var(--pill-negative-ink)';
      alertEl.style.border = '1px solid #FFC9C9';
    } else {
      alertEl.style.backgroundColor = 'var(--pill-positive-bg)';
      alertEl.style.color = 'var(--pill-positive-ink)';
      alertEl.style.border = '1px solid #B2F2BB';
    }
  }

  function _replayAuthPanelEnter(el) {
    if (!el) return;
    el.classList.remove('auth-view-enter');
    void el.offsetWidth;
    el.classList.add('auth-view-enter');
  }

  function _setCtaButtonState(btn, disabled, labelText) {
    if (!btn) return;
    btn.disabled = Boolean(disabled);
    var lbl = btn.querySelector('.btn-label');
    if (lbl) {
      lbl.textContent = labelText;
    } else {
      btn.textContent = labelText;
    }
  }

  function setPrintMode(mode) {
    var allowed = (mode === 'mono' || mode === 'halftone' || mode === 'duotone') ? mode : 'duotone';
    var stage = document.getElementById('auth-stage');
    if (stage) {
      stage.setAttribute('data-print-mode', allowed);
      var btns = stage.querySelectorAll('.auth-mode-btn');
      Array.prototype.forEach.call(btns, function (b) {
        b.classList.toggle('active', b.getAttribute('data-mode') === allowed);
      });
    }
    try {
      localStorage.setItem('nakhoda_auth_print_mode', allowed);
    } catch (e) {}
  }

  function _bindAuthStageInteractions() {
    var stage = document.getElementById('auth-stage');
    if (!stage || stage.getAttribute('data-bound') === '1') return;
    stage.setAttribute('data-bound', '1');

    try {
      var savedMode = localStorage.getItem('nakhoda_auth_print_mode');
      if (savedMode) setPrintMode(savedMode);
    } catch (e) {}

    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      return;
    }

    var plate = stage.querySelector('.auth-vector-plate');
    if (plate) {
      plate.addEventListener('mousemove', function (e) {
        var rect = plate.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        var px = (((e.clientX - rect.left) / rect.width) * 100).toFixed(2) + '%';
        var py = (((e.clientY - rect.top) / rect.height) * 100).toFixed(2) + '%';
        stage.style.setProperty('--cx', px);
        stage.style.setProperty('--cy', py);
        stage.classList.add('is-pointer-active');
      });

      plate.addEventListener('mouseleave', function () {
        stage.classList.remove('is-pointer-active');
      });
    }
  }

  function showLogin() {
    _showAlert('');
    var fLogin = document.getElementById('form-login');
    var fReg1 = document.getElementById('form-register-step1');
    var fReg2 = document.getElementById('form-register-step2');
    var vPending = document.getElementById('view-pending');

    if (fLogin) {
      fLogin.classList.remove('hidden');
      _replayAuthPanelEnter(fLogin);
    }
    if (fReg1) fReg1.classList.add('hidden');
    if (fReg2) fReg2.classList.add('hidden');
    if (vPending) vPending.classList.add('hidden');
  }

  function showRegister() {
    _showAlert('');
    var fLogin = document.getElementById('form-login');
    var fReg1 = document.getElementById('form-register-step1');
    var fReg2 = document.getElementById('form-register-step2');
    var vPending = document.getElementById('view-pending');

    if (fLogin) fLogin.classList.add('hidden');
    if (fReg1) {
      fReg1.classList.remove('hidden');
      _replayAuthPanelEnter(fReg1);
    }
    if (fReg2) fReg2.classList.add('hidden');
    if (vPending) vPending.classList.add('hidden');
  }

  function showRegisterStep1() {
    _showAlert('');
    var fReg1 = document.getElementById('form-register-step1');
    var fReg2 = document.getElementById('form-register-step2');
    if (fReg1) {
      fReg1.classList.remove('hidden');
      _replayAuthPanelEnter(fReg1);
    }
    if (fReg2) fReg2.classList.add('hidden');
  }

  function submitLogin() {
    _showAlert('');
    var identInput = document.getElementById('login-ident');
    var passInput = document.getElementById('login-password');
    var btnSubmit = document.getElementById('btn-submit-login');

    var ident = identInput ? identInput.value.trim() : '';
    var pass = passInput ? passInput.value : '';

    if (!ident || !pass) {
      _showAlert('Email atau NIP dan password wajib diisi.', true);
      return;
    }

    _setCtaButtonState(btnSubmit, true, 'Memverifikasi...');

    rpc('auth_login', { identifier: ident, password: pass })
      .then(function (result) {
        _setCtaButtonState(btnSubmit, false, 'Login');

        if (!result || !result.user) {
          _showAlert('Respons masuk tidak valid dari server.', true);
          return;
        }

        if (result.user.status === 'PENDING') {
          _showApprovalScreen(result.user);
          return;
        }

        setSession(result.token, result.user, true);
        Toast.success('Selamat datang, ' + (result.user.nama || 'Rekan') + '.');
        showAppShell();
        _initAppEvents();
        Router.init();
        try {
          if (!localStorage.getItem('nakhoda_tour_done') && typeof NakhodaTour !== 'undefined') {
            setTimeout(function () { NakhodaTour.start(0); }, 450);
          }
        } catch (e) {}
      })
      .catch(function (err) {
        _setCtaButtonState(btnSubmit, false, 'Login');
        _showAlert(err.message || 'Login gagal. Periksa kembali email/NIP dan password.', true);
      });
  }

  function submitRegisterStep1() {
    _showAlert('');
    var namaEl = document.getElementById('reg-nama');
    var nipEl = document.getElementById('reg-nip');
    var emailEl = document.getElementById('reg-email');
    var roleEl = document.getElementById('reg-role');
    var passEl = document.getElementById('reg-password');
    var btnOtp = document.getElementById('btn-request-otp');

    var nama = namaEl ? namaEl.value.trim() : '';
    var nip = nipEl ? nipEl.value.trim() : '';
    var email = emailEl ? emailEl.value.trim().toLowerCase() : '';
    var role = roleEl ? roleEl.value : 'STAF';
    var pass = passEl ? passEl.value : '';

    if (!nama || !nip || !email || !pass) {
      _showAlert('Seluruh isian data wajib dilengkapi.', true);
      return;
    }

    _setCtaButtonState(btnOtp, true, 'Mengirim Kode OTP...');

    rpc('auth_requestOtp', {
      nama: nama,
      nip: nip,
      email: email,
      password: pass,
      divisiId: 'DIV-AWAK',
      roleDilamar: role
    })
      .then(function () {
        _setCtaButtonState(btnOtp, false, 'Kirim Kode OTP');
        _regEmail = email;
        var sentEl = document.getElementById('otp-sent-email');
        if (sentEl) sentEl.textContent = email;

        var fReg1 = document.getElementById('form-register-step1');
        var fReg2 = document.getElementById('form-register-step2');
        if (fReg1) fReg1.classList.add('hidden');
        if (fReg2) {
          fReg2.classList.remove('hidden');
          _replayAuthPanelEnter(fReg2);
        }

        _showAlert('Kode verifikasi 6-digit telah dikirimkan ke email ' + email, false);
      })
      .catch(function (err) {
        _setCtaButtonState(btnOtp, false, 'Kirim Kode OTP');
        _showAlert(err.message || 'Gagal mengirim kode verifikasi OTP.', true);
      });
  }

  function submitRegisterStep2() {
    _showAlert('');
    var otpInput = document.getElementById('reg-otp');
    var btnRegSubmit = document.getElementById('btn-submit-register');
    var code = otpInput ? otpInput.value.trim() : '';

    if (!code || code.length !== 6) {
      _showAlert('Masukkan 6-digit angka kode verifikasi OTP.', true);
      return;
    }

    _setCtaButtonState(btnRegSubmit, true, 'Memverifikasi...');

    rpc('auth_verifyOtp', { email: _regEmail, code: code })
      .then(function (otpResult) {
        _pendingOtpToken = otpResult.pendingToken;
        _setCtaButtonState(btnRegSubmit, true, 'Mendaftarkan Akun...');

        var payload = {
          nama: document.getElementById('reg-nama').value.trim(),
          nip: document.getElementById('reg-nip').value.trim(),
          email: _regEmail,
          password: document.getElementById('reg-password').value,
          divisiId: 'DIV-AWAK',
          roleDilamar: document.getElementById('reg-role').value,
          pendingToken: _pendingOtpToken
        };

        return rpc('auth_register', payload);
      })
      .then(function (regResult) {
        _setCtaButtonState(btnRegSubmit, false, 'Verifikasi & Daftarkan Akun');
        Toast.success('Pendaftaran akun berhasil dikirim.');
        _showApprovalScreen(regResult);
      })
      .catch(function (err) {
        _setCtaButtonState(btnRegSubmit, false, 'Verifikasi & Daftarkan Akun');
        _showAlert(err.message || 'Verifikasi kode OTP gagal.', true);
      });
  }

  function _showApprovalScreen(userData) {
    _showAlert('');
    var fLogin = document.getElementById('form-login');
    var fReg1 = document.getElementById('form-register-step1');
    var fReg2 = document.getElementById('form-register-step2');
    var vPending = document.getElementById('view-pending');

    if (fLogin) fLogin.classList.add('hidden');
    if (fReg1) fReg1.classList.add('hidden');
    if (fReg2) fReg2.classList.add('hidden');
    if (vPending) {
      vPending.classList.remove('hidden');
      _replayAuthPanelEnter(vPending);
      var nameEl = document.getElementById('pending-user-name');
      if (nameEl) nameEl.textContent = userData.nama || userData.email || 'Pengguna';

      if (_pollingInterval) clearInterval(_pollingInterval);
      _pollingInterval = setInterval(function () {
        rpc('auth_checkRegistrationStatus', { email: userData.email, userId: userData.userId })
          .then(function (st) {
            if (st && st.status === 'APPROVED') {
              clearInterval(_pollingInterval);
              Toast.success('Akun Anda telah disetujui. Silakan masuk.');
              showLogin();
            } else if (st && st.status === 'REJECTED') {
              clearInterval(_pollingInterval);
              Toast.error('Pendaftaran ditolak: ' + (st.alasanReject || 'Tidak memenuhi kualifikasi'));
            }
          })
          .catch(function () {});
      }, 8000);
    }
  }

  function _initAuthForms() {
    _bindAuthStageInteractions();
    showLogin();
  }

  function promptReauth() {
    var modal = document.getElementById('modal-session-expired');
    if (!modal || modal.classList.contains('active')) return;
    var u = getUser() || {};
    var identInp = document.getElementById('reauth-ident');
    var pwdInp = document.getElementById('reauth-password');
    if (identInp && !identInp.value) identInp.value = u.email || u.nip || '';
    if (pwdInp) pwdInp.value = '';
    Modal.open('modal-session-expired');
  }

  function _initAppEvents() {
    var btnLogout = document.getElementById('btn-logout');
    if (btnLogout) {
      btnLogout.onclick = function () {
        Modal.confirm({
          title: 'Keluar dari Nakhoda',
          message: 'Apakah Anda yakin ingin keluar dari sesi saat ini?',
          confirmLabel: 'Logout',
          danger: true,
          onConfirm: function () { logout(true); }
        });
      };
    }

    var reauthForm = document.getElementById('form-session-reauth');
    if (reauthForm && !reauthForm._bound) {
      reauthForm._bound = true;
      reauthForm.onsubmit = function (e) {
        e.preventDefault();
        var ident = (document.getElementById('reauth-ident') || {}).value || '';
        var pwd = (document.getElementById('reauth-password') || {}).value || '';
        var btn = document.getElementById('btn-reauth-submit');
        if (btn) { btn.disabled = true; btn.textContent = 'Memeriksa...'; }
        rpc('auth_login', { ident: ident.trim(), password: pwd })
          .then(function (res) {
            if (btn) { btn.disabled = false; btn.textContent = 'Masuk kembali'; }
            setSession(res.token, res.user, true);
            Modal.close('modal-session-expired');
            Toast.success('Sesi diperbarui. Anda dapat menyimpan ulang data.');
          })
          .catch(function (err) {
            if (btn) { btn.disabled = false; btn.textContent = 'Masuk kembali'; }
            Toast.error((err && err.message) ? err.message : 'Gagal verifikasi ulang sesi.');
          });
      };
    }
  }

  return {
    init: init,
    getToken: getToken,
    getUser: getUser,
    logout: logout,
    promptReauth: promptReauth,
    setPrintMode: setPrintMode,
    showLogin: showLogin,
    showRegister: showRegister,
    showRegisterStep1: showRegisterStep1,
    submitLogin: submitLogin,
    submitRegisterStep1: submitRegisterStep1,
    submitRegisterStep2: submitRegisterStep2
  };
})();

// ===========================================================================
// 7. CLIENT-SIDE HASH ROUTER (Tanpa Kloning DOM)
// ===========================================================================
var Router = (function () {
  'use strict';

  var _routes = {};
  var _currentRoute = null;
  var _pendingState = null;
  var _initialized = false;

  function register(route, handler) {
    _routes[route] = handler;
  }

  function navigate(route, stateObj) {
    _pendingState = stateObj || null;
    var targetHash = '#/' + route;
    if (window.location.hash === targetHash) {
      _handleHashChange();
    } else {
      window.location.hash = targetHash;
    }
  }

  function consumeState() {
    var st = _pendingState;
    _pendingState = null;
    return st;
  }

  function _handleHashChange() {
    if (!AuthApp.getToken()) return;

    var rawHash = window.location.hash || '#/ringkasan';
    var cleanRoute = rawHash.replace(/^#\/?/, '').split('?')[0] || 'ringkasan';

    // Route Guard: cegah akses langsung URL hash ke Admin bagi role non-pimpinan (STAF)
    if (cleanRoute === 'admin-users' || cleanRoute === 'admin-audit') {
      var u = AuthApp.getUser() || {};
      var role = String(u.role || '').toUpperCase();
      if (role !== 'SUPERADMIN' && role !== 'KADIV' && role !== 'DIREKTUR') {
        Toast.error('Akses ditolak: menu administrasi hanya untuk Katimja / Administrator.');
        window.location.hash = '#/ringkasan';
        return;
      }
    }

    // Highlight nav item di sidebar
    var navItems = document.querySelectorAll('#app-sidebar .nav-item');
    Array.prototype.forEach.call(navItems, function (btn) {
      var btnRoute = btn.getAttribute('data-route');
      if (btnRoute === cleanRoute) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    // Perbarui label rute di header mobile
    var routeLabels = {
      'ringkasan': 'Ringkasan',
      'komposisi': 'Komposisi AKN',
      'direktori': 'Direktori Awak',
      'kompetensi': 'Kompetensi & BST',
      'sijil': 'Papan Sijil Kapal',
      'kegiatan': 'Log Kegiatan',
      'laporan': 'Executive Report',
      'admin-users': 'User & Access',
      'admin-audit': 'Audit Log'
    };
    var lblEl = document.getElementById('mobile-route-label');
    if (lblEl) lblEl.textContent = routeLabels[cleanRoute] || 'Nakhoda';

    // Tutup mobile nav jika terbuka
    ShellUI.closeMobileNav();

    // Sembunyikan seluruh view yang ada di dalam #outlet-content
    var allViews = document.querySelectorAll('#outlet-content > .app-view, #outlet-content > .view-panel');
    Array.prototype.forEach.call(allViews, function (v) {
      v.classList.add('hidden');
    });

    // Temukan kontainer tampilan yang sesuai
    var targetViewId = 'view-' + cleanRoute;
    if (cleanRoute === 'admin-users' || cleanRoute === 'admin-audit') {
      targetViewId = 'view-admin';
    }

    var targetView = document.getElementById(targetViewId);
    if (targetView) {
      targetView.classList.remove('hidden');
    }

    _currentRoute = cleanRoute;

    var handler = _routes[cleanRoute];
    if (typeof handler === 'function') {
      handler();
    }
  }

  function init() {
    if (_initialized) {
      _handleHashChange();
      return;
    }
    _initialized = true;

    // Daftarkan seluruh rute operasional
    register('ringkasan', function () {
      if (typeof RingkasanView !== 'undefined' && RingkasanView.init) {
        RingkasanView.init();
      }
    });

    register('komposisi', function () {
      if (typeof AknView !== 'undefined' && AknView.init) {
        AknView.init();
      }
    });

    register('direktori', function () {
      if (typeof DirektoriView !== 'undefined' && DirektoriView.init) {
        DirektoriView.init();
      }
    });

    register('kompetensi', function () {
      if (typeof KompetensiView !== 'undefined' && KompetensiView.init) {
        KompetensiView.init();
      }
    });

    register('sijil', function () {
      if (typeof SijilView !== 'undefined' && SijilView.init) {
        SijilView.init();
      }
    });

    register('kegiatan', function () {
      if (typeof KegiatanView !== 'undefined' && KegiatanView.init) {
        KegiatanView.init();
      }
    });

    register('laporan', function () {
      if (typeof LaporanView !== 'undefined' && LaporanView.init) {
        LaporanView.init();
      }
    });

    register('admin-users', function () {
      if (typeof AdminView !== 'undefined' && AdminView.init) {
        AdminView.init('users');
      }
    });

    register('admin-audit', function () {
      if (typeof AdminView !== 'undefined' && AdminView.init) {
        AdminView.init('audit');
      }
    });

    // Pasang click listener di tombol navigasi sidebar
    var navItems = document.querySelectorAll('#app-sidebar .nav-item');
    Array.prototype.forEach.call(navItems, function (btn) {
      btn.onclick = function () {
        var r = btn.getAttribute('data-route');
        if (r) navigate(r);
      };
    });

    window.addEventListener('hashchange', _handleHashChange);
    // Pintasan keyboard '/' untuk fokus pencarian di rute aktif
    document.addEventListener('keydown', function (e) {
      if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
      var activeEl = document.activeElement;
      if (activeEl && /^(input|textarea|select)$/i.test(activeEl.tagName)) return;
      if (document.querySelector('.modal-overlay.active')) return;
      var searchMap = {
        'direktori': 'dir-search-input',
        'kompetensi': 'kom-matriks-search',
        'sijil': 'sijil-search-input',
        'kegiatan': 'keg-search-input',
        'admin-users': 'admin-user-search',
        'admin-audit': 'admin-audit-search'
      };
      var id = searchMap[_currentRoute];
      var inp = id ? document.getElementById(id) : null;
      if (inp && inp.offsetParent !== null) {
        e.preventDefault();
        inp.focus();
      }
    });
    _handleHashChange();
  }

  return {
    init: init,
    register: register,
    navigate: navigate,
    consumeState: consumeState,
    getCurrentRoute: function () { return _currentRoute; }
  };
})();

// ===========================================================================
// INITIALIZATION ON DOM READY
// ===========================================================================
document.addEventListener('DOMContentLoaded', function () {
  AuthApp.init();
});
</script>
