<script>
/**
 * html/Script_Kompetensi.html
 * Controller Klien Sub-Modul D: Register Sertifikasi STCW-F & Mesin Status Kedaluwarsa (Achromatic Ledger).
 * Nakhoda — Timja Pengawakan Dit. POA KKP RI
 */
var KompetensiView = (function () {
  'use strict';

  var _activeTab = 'antrean';
  var _stagedCertFile = null;
  var _eventsBound = false;
  var _dashboardData = null;
  var _awakOptions = [];
  var _certOptions = [];
  var _selectedAwak = null;
  var _selectedCert = null;
  var _isCustomCert = false;

  function init() {
    _bindEvents();
    if (_activeTab === 'antrean') {
      loadDashboard();
    } else {
      loadMatriks();
    }
  }

  function _bindEvents() {
    if (_eventsBound) return;
    _eventsBound = true;

    var btnRefresh = document.getElementById('btn-kom-refresh');
    var tabAntrean = document.getElementById('tab-kom-antrean');
    var tabMatriks = document.getElementById('tab-kom-matriks');
    var btnOpenNew = document.getElementById('btn-kom-open-catat-new');
    var filterJab = document.getElementById('kom-matriks-filter-jabatan');
    var searchMatriks = document.getElementById('kom-matriks-search');
    var btnSearchMatriks = document.getElementById('btn-kom-matriks-search');
    var dropzone = document.getElementById('kom-save-dropzone');
    var fileInput = document.getElementById('kom-save-file');
    var btnRemoveFile = document.getElementById('btn-kom-remove-file');
    var tglTerbitInp = document.getElementById('kom-save-tgl-terbit');
    var formSave = document.getElementById('form-kom-save');

    if (btnRefresh) {
      btnRefresh.onclick = function () {
        if (_activeTab === 'antrean') loadDashboard();
        else loadMatriks();
      };
    }

    if (btnOpenNew) {
      btnOpenNew.onclick = function () {
        openModalCatat('', '', '', '');
      };
    }

    if (tabAntrean && tabMatriks) {
      tabAntrean.onclick = function () {
        _activeTab = 'antrean';
        tabAntrean.classList.add('active');
        tabMatriks.classList.remove('active');
        document.getElementById('pane-kom-antrean').classList.remove('hidden');
        document.getElementById('pane-kom-matriks').classList.add('hidden');
        loadDashboard();
      };

      tabMatriks.onclick = function () {
        _activeTab = 'matriks';
        tabMatriks.classList.add('active');
        tabAntrean.classList.remove('active');
        document.getElementById('pane-kom-matriks').classList.remove('hidden');
        document.getElementById('pane-kom-antrean').classList.add('hidden');
        loadMatriks();
      };
    }

    if (filterJab) filterJab.onchange = function () { loadMatriks(); };
    if (btnSearchMatriks) btnSearchMatriks.onclick = function () { loadMatriks(); };
    if (searchMatriks) {
      searchMatriks.onkeydown = function (e) {
        if (e.key === 'Enter') loadMatriks();
      };
    }

    if (dropzone && fileInput) {
      dropzone.onclick = function (e) {
        if (e.target.id === 'btn-kom-remove-file') return;
        fileInput.click();
      };
    }
    if (btnRemoveFile) {
      btnRemoveFile.onclick = function (e) {
        e.stopPropagation();
        _clearKomFile();
      };
    }
    if (fileInput) {
      fileInput.onchange = function (e) {
        var file = e.target.files[0];
        if (!file) {
          _clearKomFile();
          return;
        }
        if (file.size > 15 * 1024 * 1024) {
          Toast.error('Ukuran berkas melebihi batas 15 MB.');
          _clearKomFile();
          return;
        }
        var promptEl = document.getElementById('kom-save-file-prompt');
        var selEl = document.getElementById('kom-save-file-selected');
        var nameEl = document.getElementById('kom-save-file-name');
        var sizeEl = document.getElementById('kom-save-file-size');
        if (promptEl) promptEl.classList.add('hidden');
        if (selEl) selEl.classList.remove('hidden');
        if (nameEl) nameEl.textContent = file.name;
        if (sizeEl) sizeEl.textContent = (file.size / 1024).toFixed(1) + ' KB';

        var reader = new FileReader();
        reader.onload = function (evt) {
          _stagedCertFile = {
            fileName: file.name,
            mimeType: file.type || 'application/pdf',
            dataBase64: evt.target.result
          };
        };
        reader.readAsDataURL(file);
      };
    }

    if (tglTerbitInp) {
      tglTerbitInp.onchange = function () {
        _autoCalcExpiry();
      };
    }

    if (formSave) {
      formSave.onsubmit = function (e) {
        e.preventDefault();
        _submitSaveSertifikat();
      };
    }

    _bindModalComboboxes();
  }

  function loadDashboard() {
    var token = AuthApp.getToken();
    if (!token) return;

    rpc('kom_getDashboard', token)
      .then(function (res) {
        _dashboardData = res;

        // 1. Update KPI Strip
        var mTot = document.getElementById('metric-cert-total');
        var mBer = document.getElementById('metric-cert-berlaku');
        var mSeg = document.getElementById('metric-cert-segera');
        var mExp = document.getElementById('metric-cert-expired');
        var mBerSub = document.getElementById('metric-cert-berlaku-sub');
        var countBadge = document.getElementById('kom-antrean-count-badge');
        var findingEl = document.getElementById('kom-finding-sub');

        if (mTot) mTot.textContent = Format.number(res.metrics.totalTercatat);
        if (mBer) mBer.textContent = Format.number(res.metrics.berlaku);
        if (mSeg) mSeg.textContent = Format.number(res.metrics.segeraHabis);
        if (mExp) mExp.textContent = Format.number(res.metrics.kedaluwarsa);

        if (mBerSub) {
          mBerSub.innerHTML = '<span class="mono">' + (res.metrics.kelaikanPersen || 100) + '% kelaikan STCW-F armada</span>';
        }
        if (countBadge) {
          countBadge.textContent = Format.number((res.metrics.segeraHabis || 0) + (res.metrics.kedaluwarsa || 0)) + ' sertifikat';
        }

        if (findingEl) {
          var urgent = (res.metrics.segeraHabis || 0) + (res.metrics.kedaluwarsa || 0);
          findingEl.textContent = urgent > 0
            ? ('Ditemukan ' + urgent + ' sertifikat kepelautan yang memerlukan tindakan (' + res.metrics.kedaluwarsa + ' kedaluwarsa, ' + res.metrics.segeraHabis + ' habis <= 90 hari). ' + res.metrics.awakLengkap + ' awak memenuhi kurikulum lengkap.')
            : 'Seluruh sertifikat kepelautan personil aktif dan berlaku sesuai standar.';
        }

        // 2. Render Antrean Tindak Lanjut Table
        _renderAntreanTable(res.antrean || []);
      })
      .catch(function (err) {
        Toast.error('Gagal memuat dasbor kompetensi: ' + err.message);
      });
  }

  function _renderAntreanTable(antrean) {
    var tbody = document.getElementById('kom-antrean-tbody');
    if (!tbody) return;

    if (!antrean || antrean.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:32px 0; color:var(--muted);">Tidak ada sertifikat dalam antrean tindak lanjut. Seluruh dokumen berlaku aman.</td></tr>';
      return;
    }

    var html = '';
    antrean.forEach(function (it) {
      var bg = Format.avatarBg(it.namaAwak);
      var inis = Format.initials(it.namaAwak);
      var sisaHtml = (it.sisaHari < 0)
        ? '<span class="delta-down mono">Lewat ' + Math.abs(it.sisaHari) + ' hari</span>'
        : '<span class="delta-warn mono">' + it.sisaHari + ' hari lagi</span>';

      html +=
        '<tr>' +
          '<td>' + Format.statusBadge(it.status) + '</td>' +
          '<td>' +
            '<div style="display:flex; align-items:center; gap:10px;">' +
              '<div class="avatar-sm" style="background-color:' + bg + ';">' + inis + '</div>' +
              '<div>' +
                '<div class="cell-primary">' + Format.escape(it.namaAwak) + '</div>' +
                '<div class="cell-sub">' + Format.escape(it.jabatan) + '</div>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td>' +
            '<div class="cell-primary">' + Format.escape(it.namaPelatihan) + '</div>' +
            '<div class="cell-sub mono">No: ' + Format.escape(it.nomorSertifikat) + '</div>' +
          '</td>' +
          '<td class="mono tnum">' + Format.date(it.berlakuSampai) + '</td>' +
          '<td class="text-right">' + sisaHtml + '</td>' +
          '<td class="text-center">' +
            '<button type="button" class="btn btn-secondary-sm btn-reval" ' +
              'data-peg="' + it.pegawaiId + '" ' +
              'data-nama="' + Format.escape(it.namaAwak) + '" ' +
              'data-kd="' + it.kodePelatihan + '" ' +
              'data-pel="' + Format.escape(it.namaPelatihan) + '">Revalidasi</button>' +
          '</td>' +
        '</tr>';
    });

    tbody.innerHTML = html;

    tbody.querySelectorAll('.btn-reval').forEach(function (btn) {
      btn.onclick = function () {
        var pegId = btn.getAttribute('data-peg');
        var nama = btn.getAttribute('data-nama');
        var kd = btn.getAttribute('data-kd');
        var pel = btn.getAttribute('data-pel');
        openModalCatat(pegId, nama, kd, pel);
      };
    });
  }

  function loadMatriks() {
    var token = AuthApp.getToken();
    if (!token) return;

    var filterJab = (document.getElementById('kom-matriks-filter-jabatan') || {}).value || '';
    var search = (document.getElementById('kom-matriks-search') || {}).value || '';

    rpc('kom_listAwakKompetensi', {
      token: token,
      kelompokJabatan: filterJab,
      search: search,
      limit: 60,
      offset: 0
    })
      .then(function (res) {
        var totalInfo = document.getElementById('kom-matriks-total-info');
        if (totalInfo) totalInfo.textContent = Format.number(res.total) + ' personil';

        var tbody = document.getElementById('kom-matriks-tbody');
        if (!tbody) return;

        var items = res.items || [];
        if (items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:32px 0; color:var(--muted);">Tidak ada personil yang sesuai dengan filter kelompok jabatan.</td></tr>';
          return;
        }

        var html = '';
        items.forEach(function (a) {
          var k = a.kelaikan || { persen: 100, terpenuhi: 0, totalWajib: 0, isLaik: true };
          var bg = Format.avatarBg(a.nama);
          var inis = Format.initials(a.nama);

          html +=
            '<tr>' +
              '<td>' +
                '<div style="display:flex; align-items:center; gap:10px;">' +
                  '<div class="avatar-sm" style="background-color:' + bg + ';">' + inis + '</div>' +
                  '<div>' +
                    '<div class="cell-primary">' + Format.escape(a.nama) + '</div>' +
                    '<div class="cell-sub mono">NIP: ' + Format.escape(a.nipDisplay) + '</div>' +
                  '</div>' +
                '</div>' +
              '</td>' +
              '<td>' +
                '<div class="cell-primary">' + Format.escape(a.kelompokJabatan) + '</div>' +
                '<div class="cell-sub">' + Format.kelompokBadge(a.rumpun) + ' · ' + Format.escape(String(a.kelasKapal).replace('_', ' ')) + '</div>' +
              '</td>' +
              '<td>' +
                '<div style="display:flex; align-items:center; gap:8px;">' +
                  '<div class="track-bar" style="flex:1;">' +
                    '<div class="track-fill" style="width:' + k.persen + '%;"></div>' +
                  '</div>' +
                  '<span class="mono tnum" style="font-size:11px; width:65px; text-align:right;">' +
                    k.terpenuhi + ' / ' + k.totalWajib + ' (' + k.persen + '%)' +
                  '</span>' +
                '</div>' +
              '</td>' +
              '<td class="text-center">' +
                (k.isLaik ? '<span class="pill pill-positive"><span class="pill-dot"></span>Lengkap</span>' : '<span class="pill pill-warning"><span class="pill-dot"></span>Belum lengkap</span>') +
              '</td>' +
              '<td class="text-center">' +
                '<button type="button" class="btn btn-secondary-sm btn-matriks-detail" data-id="' + a.pegawaiId + '">Matriks</button>' +
              '</td>' +
            '</tr>';
        });

        tbody.innerHTML = html;

        tbody.querySelectorAll('.btn-matriks-detail').forEach(function (btn) {
          btn.onclick = function () {
            var id = btn.getAttribute('data-id');
            openAwakMatriksSheet(id);
          };
        });
      })
      .catch(function (err) {
        Toast.error('Gagal memuat matriks kompetensi: ' + err.message);
      });
  }

  function openAwakMatriksSheet(pegawaiId) {
    var token = AuthApp.getToken();
    if (!token) return;

    Sheet.open('sheet-kom-panel', 'sheet-kom-overlay');

    var nameEl = document.getElementById('sheet-kom-nama');
    if (nameEl) nameEl.textContent = 'Memuat matriks personil...';

    rpc('kom_getAwakMatriks', token, pegawaiId)
      .then(function (res) {
        _renderSheetAwakMatriks(res);
      })
      .catch(function (err) {
        Toast.error('Gagal memuat matriks sertifikat: ' + err.message);
      });
  }

  function _renderSheetAwakMatriks(d) {
    if (!d) return;

    var nameEl = document.getElementById('sheet-kom-nama');
    var jabEl = document.getElementById('sheet-kom-jabatan');
    var nipEl = document.getElementById('sheet-kom-nip');
    var klsEl = document.getElementById('sheet-kom-kelas');
    var pctText = document.getElementById('sheet-kom-persen-text');
    var pctBar = document.getElementById('sheet-kom-persen-bar');
    var listEl = document.getElementById('sheet-kom-items-list');

    if (nameEl) nameEl.textContent = d.nama || '-';
    if (jabEl) jabEl.textContent = d.jabatanLengkap || d.kelompokJabatan || '-';
    if (nipEl) nipEl.textContent = d.nipDisplay || '-';
    if (klsEl) klsEl.textContent = String(d.kelasKapal || 'Kelas II').replace('_', ' ');

    var k = d.kelaikan || { persen: 100, terpenuhi: 0, totalWajib: 0 };
    if (pctText) pctText.textContent = k.persen + '% (' + k.terpenuhi + ' / ' + k.totalWajib + ' terpenuhi)';
    if (pctBar) pctBar.style.width = k.persen + '%';

    if (listEl) {
      var items = d.matriks || [];
      if (items.length === 0) {
        listEl.innerHTML = '<div style="padding:18px; text-align:center; color:var(--muted); font-size:12px;">Tidak ada standar wajib terkonfigurasi untuk jabatan ini.</div>';
      } else {
        listEl.innerHTML = items.map(function (m) {
          var borderLeft = m.hasCert
            ? (m.status === 'BERLAKU' ? '3px solid var(--positive)' : (m.status === 'SEGERA_HABIS' ? '3px solid var(--warning)' : '3px solid var(--negative)'))
            : '3px solid var(--border)';

          return (
            '<div style="padding:10px 12px; border:1px solid var(--border); border-left:' + borderLeft + '; border-radius:var(--radius-control); background-color:var(--surface);">' +
              '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">' +
                '<div>' +
                  '<div style="font-size:13px; font-weight:500; color:var(--text);">' + Format.escape(m.namaPelatihan) + '</div>' +
                  '<div class="mono" style="font-size:11px; color:var(--muted); margin-top:2px;">' + Format.escape(m.kodePelatihan) + (m.wajib ? ' · Wajib STCW-F' : ' · Kompetensi Tambahan') + '</div>' +
                '</div>' +
                '<div>' + Format.statusBadge(m.status) + '</div>' +
              '</div>' +
              '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:11px; color:var(--muted);">' +
                '<span class="mono">' + (m.hasCert ? ('No: ' + Format.escape(m.nomorSertifikat) + (m.berlakuSampai ? ' · s.d ' + Format.date(m.berlakuSampai) : ' · Permanen')) : 'Belum memiliki sertifikat') + '</span>' +
                '<button type="button" class="btn btn-secondary-sm btn-sheet-catat-cert" ' +
                  'data-peg="' + d.pegawaiId + '" ' +
                  'data-nama="' + Format.escape(d.nama) + '" ' +
                  'data-kd="' + m.kodePelatihan + '" ' +
                  'data-pel="' + Format.escape(m.namaPelatihan) + '">' + (m.hasCert ? 'Perbarui' : 'Catat') + '</button>' +
              '</div>' +
            '</div>'
          );
        }).join('');

        listEl.querySelectorAll('.btn-sheet-catat-cert').forEach(function (btn) {
          btn.onclick = function () {
            var peg = btn.getAttribute('data-peg');
            var nama = btn.getAttribute('data-nama');
            var kd = btn.getAttribute('data-kd');
            var pel = btn.getAttribute('data-pel');
            Sheet.close('sheet-kom-panel', 'sheet-kom-overlay');
            openModalCatat(peg, nama, kd, pel);
          };
        });
      }
    }
  }

  // ── COMBOBOX PERSONIL & KATALOG SERTIFIKAT (SIKAP + STANDAR STCW-F) ──
  function _bindModalComboboxes() {
    var crewSearchInp = document.getElementById('kom-save-crew-search-input');
    var crewDropdown = document.getElementById('kom-save-crew-dropdown');
    var btnChangeCrew = document.getElementById('btn-kom-change-crew');

    var certSearchInp = document.getElementById('kom-save-cert-search-input');
    var certDropdown = document.getElementById('kom-save-cert-dropdown');
    var btnChangeCert = document.getElementById('btn-kom-change-cert');
    var btnToggleCustom = document.getElementById('btn-kom-toggle-custom');
    var btnBackCatalog = document.getElementById('btn-kom-back-catalog');

    if (crewSearchInp) {
      crewSearchInp.oninput = function () {
        _renderCrewDropdown(crewSearchInp.value);
      };
      crewSearchInp.onfocus = function () {
        _renderCrewDropdown(crewSearchInp.value);
      };
    }
    if (btnChangeCrew) {
      btnChangeCrew.onclick = function () {
        _clearSelectedCrew();
      };
    }

    if (certSearchInp) {
      certSearchInp.oninput = function () {
        _renderCertDropdown(certSearchInp.value);
      };
      certSearchInp.onfocus = function () {
        _renderCertDropdown(certSearchInp.value);
      };
    }
    if (btnChangeCert) {
      btnChangeCert.onclick = function () {
        _clearSelectedCert();
      };
    }
    if (btnToggleCustom) {
      btnToggleCustom.onclick = function () {
        var prefillText = certSearchInp ? certSearchInp.value.trim() : '';
        _setCustomCertMode(true, prefillText);
      };
    }
    if (btnBackCatalog) {
      btnBackCatalog.onclick = function () {
        _setCustomCertMode(false, '');
      };
    }

    document.addEventListener('click', function (e) {
      var crewWrap = document.getElementById('kom-save-crew-search-wrap');
      if (crewWrap && !crewWrap.contains(e.target) && crewDropdown) {
        crewDropdown.classList.add('hidden');
      }
      var certWrap = document.getElementById('kom-save-cert-search-wrap');
      if (certWrap && !certWrap.contains(e.target) && certDropdown) {
        certDropdown.classList.add('hidden');
      }
    });
  }

  function _clearKomFile() {
    _stagedCertFile = null;
    var fInp = document.getElementById('kom-save-file');
    var promptEl = document.getElementById('kom-save-file-prompt');
    var selEl = document.getElementById('kom-save-file-selected');
    if (fInp) fInp.value = '';
    if (promptEl) promptEl.classList.remove('hidden');
    if (selEl) selEl.classList.add('hidden');
  }

  function _renderCrewDropdown(query) {
    var dropdown = document.getElementById('kom-save-crew-dropdown');
    if (!dropdown) return;

    var q = String(query || '').toLowerCase().trim();
    var filtered = _awakOptions;
    if (q) {
      filtered = _awakOptions.filter(function (a) {
        var s = (a.nama + ' ' + (a.nipDisplay || '') + ' ' + (a.kelompokJabatan || '') + ' ' + (a.rumpun || '')).toLowerCase();
        return s.indexOf(q) !== -1;
      });
    }

    if (filtered.length === 0) {
      dropdown.innerHTML = '<div style="padding:12px; font-size:12px; color:var(--muted); text-align:center;">Tidak ada personil awak yang cocok.</div>';
      dropdown.classList.remove('hidden');
      return;
    }

    var slice = filtered.slice(0, 15);
    dropdown.innerHTML = slice.map(function (a) {
      var bg = Format.avatarBg(a.nama);
      var inis = Format.initials(a.nama);
      return (
        '<div class="combobox-item" data-peg-id="' + a.pegawaiId + '">' +
          '<div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1;">' +
            '<div class="avatar-sm" style="background-color:' + bg + '; border-radius:3px; flex-shrink:0;">' + inis + '</div>' +
            '<div style="min-width:0; flex:1;">' +
              '<div style="font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + Format.escape(a.nama) + '</div>' +
              '<div style="font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' +
                (a.nipDisplay ? 'NIP ' + a.nipDisplay + ' · ' : '') + Format.escape(a.kelompokJabatan || 'Awak') + ' (' + (a.rumpun || 'DEK') + ')' +
              '</div>' +
            '</div>' +
          '</div>' +
          (a.kapalId ? '<span class="pill pill-neutral" style="font-size:10px; padding:1px 6px;">' + Format.escape(a.kapalId) + '</span>' : '') +
        '</div>'
      );
    }).join('');

    dropdown.classList.remove('hidden');

    dropdown.querySelectorAll('.combobox-item[data-peg-id]').forEach(function (el) {
      el.onclick = function () {
        var pId = el.getAttribute('data-peg-id');
        var found = _awakOptions.find(function (x) { return x.pegawaiId === pId; });
        if (found) _selectCrew(found);
      };
    });
  }

  function _selectCrew(awak) {
    _selectedAwak = awak;
    var inpId = document.getElementById('kom-save-pegawai-id');
    var selPeg = document.getElementById('kom-save-select-personil');
    var searchWrap = document.getElementById('kom-save-crew-search-wrap');
    var card = document.getElementById('kom-save-crew-selected-card');
    var dropdown = document.getElementById('kom-save-crew-dropdown');

    if (inpId) inpId.value = awak.pegawaiId || '';
    if (selPeg) selPeg.value = awak.pegawaiId || '';
    if (searchWrap) searchWrap.classList.add('hidden');
    if (dropdown) dropdown.classList.add('hidden');

    if (card) {
      var avEl = document.getElementById('kom-save-crew-avatar');
      var nameEl = document.getElementById('kom-save-crew-name');
      var metaEl = document.getElementById('kom-save-crew-meta');
      if (avEl) {
        avEl.textContent = Format.initials(awak.nama);
        avEl.style.backgroundColor = Format.avatarBg(awak.nama);
      }
      if (nameEl) nameEl.textContent = awak.nama;
      if (metaEl) {
        metaEl.textContent = (awak.nipDisplay ? 'NIP ' + awak.nipDisplay + ' · ' : '') +
                             (awak.kelompokJabatan || 'Personil Armada') +
                             (awak.pegawaiId ? ' (' + awak.pegawaiId + ')' : '');
      }
      card.classList.remove('hidden');
    }
  }

  function _clearSelectedCrew() {
    _selectedAwak = null;
    var inpId = document.getElementById('kom-save-pegawai-id');
    var selPeg = document.getElementById('kom-save-select-personil');
    var searchWrap = document.getElementById('kom-save-crew-search-wrap');
    var searchInp = document.getElementById('kom-save-crew-search-input');
    var card = document.getElementById('kom-save-crew-selected-card');
    var dropdown = document.getElementById('kom-save-crew-dropdown');

    if (inpId) inpId.value = '';
    if (selPeg) selPeg.value = '';
    if (card) card.classList.add('hidden');
    if (searchWrap) searchWrap.classList.remove('hidden');
    if (dropdown) dropdown.classList.add('hidden');
    if (searchInp) {
      searchInp.value = '';
      searchInp.focus();
    }
  }

  function _renderCertDropdown(query) {
    var dropdown = document.getElementById('kom-save-cert-dropdown');
    if (!dropdown) return;

    var q = String(query || '').toLowerCase().trim();
    var targetJab = _selectedAwak ? (_selectedAwak.jabatanStd || _selectedAwak.kelompokJabatan || '') : '';

    var list = _certOptions.slice();
    if (q) {
      list = list.filter(function (c) {
        var s = (c.namaPelatihan + ' ' + c.kodePelatihan + ' ' + (c.kategori || '') + ' ' + (c.source || '')).toLowerCase();
        return s.indexOf(q) !== -1;
      });
    }

    // Prioritaskan sertifikat yang relevan dengan jabatan awak terpilih
    if (targetJab) {
      list.sort(function (a, b) {
        var aHas = a.jabatanMap && (targetJab in a.jabatanMap);
        var bHas = b.jabatanMap && (targetJab in b.jabatanMap);
        if (aHas && !bHas) return -1;
        if (!aHas && bHas) return 1;
        var aWajib = aHas && a.jabatanMap[targetJab] === true;
        var bWajib = bHas && b.jabatanMap[targetJab] === true;
        if (aWajib && !bWajib) return -1;
        if (!aWajib && bWajib) return 1;
        return 0;
      });
    }

    var slice = list.slice(0, 20);
    var html = '';

    if (slice.length === 0) {
      html += '<div style="padding:10px 12px; font-size:12px; color:var(--muted);">Tidak ditemukan dalam katalog SIKAP.</div>';
    } else {
      html += slice.map(function (c) {
        var isWajib = targetJab && c.jabatanMap && c.jabatanMap[targetJab] === true;
        var badge = '';
        if (isWajib) {
          badge = '<span class="pill pill-warning" style="font-size:10px; padding:1px 6px;">Wajib jabatan</span>';
        } else if (c.source === 'SIKAP') {
          badge = '<span class="pill pill-positive" style="font-size:10px; padding:1px 6px;">Data SIKAP</span>';
        } else {
          badge = '<span class="pill pill-neutral" style="font-size:10px; padding:1px 6px;">Standar STCW-F</span>';
        }

        return (
          '<div class="combobox-item" data-cert-kode="' + Format.escape(c.kodePelatihan) + '">' +
            '<div style="min-width:0; flex:1;">' +
              '<div style="font-size:12px; font-weight:600; color:var(--text); line-height:1.3;">' + Format.escape(c.namaPelatihan) + '</div>' +
              '<div class="mono" style="font-size:10.5px; color:var(--muted); margin-top:2px;">' + Format.escape(c.kodePelatihan) + (c.masaBerlakuBulan ? (' · Berlaku ' + (c.masaBerlakuBulan / 12) + ' thn') : ' · Permanen') + '</div>' +
            '</div>' +
            '<div style="flex-shrink:0;">' + badge + '</div>' +
          '</div>'
        );
      }).join('');
    }

    // Opsi khusus di luar daftar SIKAP (sticky di bagian bawah dropdown)
    html +=
      '<div class="combobox-item combobox-item-sticky" data-cert-custom="true">' +
        '<div style="font-size:12px; font-weight:600; color:var(--accent);">+ Sertifikat lainnya (Input manual di luar daftar SIKAP)</div>' +
      '</div>';

    dropdown.innerHTML = html;
    dropdown.classList.remove('hidden');

    dropdown.querySelectorAll('.combobox-item[data-cert-kode]').forEach(function (el) {
      el.onclick = function () {
        var kd = el.getAttribute('data-cert-kode');
        var found = _certOptions.find(function (x) { return x.kodePelatihan === kd; });
        if (found) _selectCert(found);
      };
    });

    var customTrigger = dropdown.querySelector('.combobox-item[data-cert-custom="true"]');
    if (customTrigger) {
      customTrigger.onclick = function () {
        var inp = document.getElementById('kom-save-cert-search-input');
        _setCustomCertMode(true, inp ? inp.value.trim() : '');
      };
    }
  }

  function _selectCert(cert) {
    _selectedCert = cert;
    _isCustomCert = false;

    var inpKode = document.getElementById('kom-save-kode-pelatihan');
    var inpNama = document.getElementById('kom-save-nama-pelatihan');
    var inpIsCustom = document.getElementById('kom-save-is-custom');
    var searchWrap = document.getElementById('kom-save-cert-search-wrap');
    var customWrap = document.getElementById('kom-save-custom-cert-wrap');
    var card = document.getElementById('kom-save-cert-selected-card');
    var dropdown = document.getElementById('kom-save-cert-dropdown');
    var btnToggle = document.getElementById('btn-kom-toggle-custom');

    if (inpKode) inpKode.value = cert.kodePelatihan || '';
    if (inpNama) inpNama.value = cert.namaPelatihan || '';
    if (inpIsCustom) inpIsCustom.value = 'false';

    if (searchWrap) searchWrap.classList.add('hidden');
    if (customWrap) customWrap.classList.add('hidden');
    if (dropdown) dropdown.classList.add('hidden');
    if (btnToggle) btnToggle.classList.add('hidden');

    if (card) {
      var badgeEl = document.getElementById('kom-save-cert-code-badge');
      var nameEl = document.getElementById('kom-save-cert-name');
      var metaEl = document.getElementById('kom-save-cert-meta');
      if (badgeEl) badgeEl.textContent = cert.kodePelatihan || 'CERT';
      if (nameEl) nameEl.textContent = cert.namaPelatihan || cert.kodePelatihan;
      if (metaEl) {
        var srcLabel = cert.source === 'SIKAP' ? 'Data Kepegawaian SIKAP' : 'Standar STCW-F KKP';
        var expLabel = cert.masaBerlakuBulan ? ('Masa berlaku ' + cert.masaBerlakuBulan + ' bulan') : 'Berlaku permanen / sesuai sertifikat';
        metaEl.textContent = srcLabel + ' · ' + expLabel;
      }
      card.classList.remove('hidden');
    }

    _autoCalcExpiry();
  }

  function _clearSelectedCert() {
    _selectedCert = null;
    _isCustomCert = false;

    var inpKode = document.getElementById('kom-save-kode-pelatihan');
    var inpNama = document.getElementById('kom-save-nama-pelatihan');
    var inpIsCustom = document.getElementById('kom-save-is-custom');
    var searchWrap = document.getElementById('kom-save-cert-search-wrap');
    var searchInp = document.getElementById('kom-save-cert-search-input');
    var customWrap = document.getElementById('kom-save-custom-cert-wrap');
    var card = document.getElementById('kom-save-cert-selected-card');
    var dropdown = document.getElementById('kom-save-cert-dropdown');
    var btnToggle = document.getElementById('btn-kom-toggle-custom');

    if (inpKode) inpKode.value = '';
    if (inpNama) inpNama.value = '';
    if (inpIsCustom) inpIsCustom.value = 'false';
    if (card) card.classList.add('hidden');
    if (customWrap) customWrap.classList.add('hidden');
    if (searchWrap) searchWrap.classList.remove('hidden');
    if (dropdown) dropdown.classList.add('hidden');
    if (btnToggle) btnToggle.classList.remove('hidden');

    if (searchInp) {
      searchInp.value = '';
      searchInp.focus();
    }
  }

  function _setCustomCertMode(active, prefillNama) {
    _isCustomCert = !!active;
    var inpIsCustom = document.getElementById('kom-save-is-custom');
    var searchWrap = document.getElementById('kom-save-cert-search-wrap');
    var dropdown = document.getElementById('kom-save-cert-dropdown');
    var card = document.getElementById('kom-save-cert-selected-card');
    var customWrap = document.getElementById('kom-save-custom-cert-wrap');
    var customNama = document.getElementById('kom-save-custom-nama');
    var customKode = document.getElementById('kom-save-custom-kode');
    var btnToggle = document.getElementById('btn-kom-toggle-custom');

    if (inpIsCustom) inpIsCustom.value = active ? 'true' : 'false';

    if (active) {
      _selectedCert = null;
      if (searchWrap) searchWrap.classList.add('hidden');
      if (dropdown) dropdown.classList.add('hidden');
      if (card) card.classList.add('hidden');
      if (btnToggle) btnToggle.classList.add('hidden');
      if (customWrap) customWrap.classList.remove('hidden');
      if (customKode) customKode.value = '';
      if (customNama) {
        customNama.value = prefillNama || '';
        customNama.focus();
      }
    } else {
      if (customWrap) customWrap.classList.add('hidden');
      if (card) card.classList.add('hidden');
      if (searchWrap) searchWrap.classList.remove('hidden');
      if (btnToggle) btnToggle.classList.remove('hidden');
    }
  }

  function _autoCalcExpiry() {
    var tglTerbit = (document.getElementById('kom-save-tgl-terbit') || {}).value;
    var expInp = document.getElementById('kom-save-berlaku-sampai');
    if (!tglTerbit || !expInp || expInp.value) return;
    if (_selectedCert && _selectedCert.masaBerlakuBulan > 0) {
      var dt = new Date(tglTerbit);
      if (!isNaN(dt.getTime())) {
        dt.setMonth(dt.getMonth() + _selectedCert.masaBerlakuBulan);
        expInp.value = dt.toISOString().substring(0, 10);
      }
    }
  }

  function openModalCatat(pegawaiId, namaAwak, kodePelatihan, namaPelatihan) {
    document.getElementById('kom-save-nomor').value = '';
    document.getElementById('kom-save-lembaga').value = 'BP3IP / BPPP Tegal KKP';
    document.getElementById('kom-save-tgl-terbit').value = '';
    document.getElementById('kom-save-berlaku-sampai').value = '';
    _clearKomFile();
    _setCustomCertMode(false, '');

    if (pegawaiId && namaAwak) {
      _selectCrew({
        pegawaiId: pegawaiId,
        nama: namaAwak,
        nipDisplay: '',
        kelompokJabatan: ''
      });
    } else {
      _clearSelectedCrew();
    }

    if (kodePelatihan && namaPelatihan) {
      _selectCert({
        kodePelatihan: kodePelatihan,
        namaPelatihan: namaPelatihan,
        source: 'STANDAR',
        masaBerlakuBulan: 60
      });
    } else {
      _clearSelectedCert();
    }

    Modal.open('modal-kom-save');

    // Muat daftar personil & katalog sertifikat resmi dari SIKAP + Standar STCW-F
    var token = AuthApp.getToken();
    var crewSearch = document.getElementById('kom-save-crew-search-input');
    var certSearch = document.getElementById('kom-save-cert-search-input');
    if (crewSearch && !pegawaiId) crewSearch.placeholder = 'Memuat data personil armada...';
    if (certSearch && !kodePelatihan) certSearch.placeholder = 'Memuat daftar sertifikat dari SIKAP...';

    rpc('kom_getFormOptions', token)
      .then(function (res) {
        var d = (res && res.awakOptions) ? res : (res && res.data ? res.data : {});
        _awakOptions = d.awakOptions || [];
        _certOptions = d.certOptions || [];

        if (crewSearch) crewSearch.placeholder = 'Cari nama, NIP, atau jabatan awak (' + _awakOptions.length + ' personil)...';
        if (certSearch) certSearch.placeholder = 'Cari nama atau kode sertifikat dari data SIKAP (' + _certOptions.length + ' jenis)...';

        // Perkaya tampilan jika sudah terpilih sebelumnya
        if (pegawaiId) {
          var foundAwak = _awakOptions.find(function (x) { return x.pegawaiId === pegawaiId; });
          if (foundAwak) _selectCrew(foundAwak);
        }
        if (kodePelatihan) {
          var foundCert = _certOptions.find(function (x) { return x.kodePelatihan === kodePelatihan; });
          if (foundCert) _selectCert(foundCert);
        }
      })
      .catch(function () {
        // Fallback jika environment mock lama
        if (_certOptions.length === 0) {
          _certOptions = [
            { kodePelatihan: 'TRN-NKH-01', namaPelatihan: 'Sertifikat Keahlian Pelaut Nautika (ANKAPIN / ANT)', source: 'SIKAP', masaBerlakuBulan: 60, jabatanMap: {} },
            { kodePelatihan: 'TRN-NKH-02', namaPelatihan: 'Basic Safety Training Fisheries (BST / BST-F)', source: 'SIKAP', masaBerlakuBulan: 60, jabatanMap: {} },
            { kodePelatihan: 'TRN-NKH-03', namaPelatihan: 'Advanced Fire Fighting (AFF)', source: 'SIKAP', masaBerlakuBulan: 60, jabatanMap: {} },
            { kodePelatihan: 'TRN-NKH-04', namaPelatihan: 'Survival Craft and Rescue Boats (SCRB)', source: 'SIKAP', masaBerlakuBulan: 60, jabatanMap: {} },
            { kodePelatihan: 'TRN-NKH-05', namaPelatihan: 'Medical First Aid (MFA) / Medical Care', source: 'SIKAP', masaBerlakuBulan: 60, jabatanMap: {} },
            { kodePelatihan: 'TRN-NKH-06', namaPelatihan: 'Radar Simulator & ARPA', source: 'SIKAP', masaBerlakuBulan: 60, jabatanMap: {} },
            { kodePelatihan: 'TRN-NKH-07', namaPelatihan: 'Electronic Chart Display (ECDIS)', source: 'SIKAP', masaBerlakuBulan: 60, jabatanMap: {} },
            { kodePelatihan: 'TRN-NKH-08', namaPelatihan: 'Sertifikat Operator Radio GMDSS (ORU / GOC)', source: 'SIKAP', masaBerlakuBulan: 60, jabatanMap: {} },
            { kodePelatihan: 'TRN-KKM-01', namaPelatihan: 'Sertifikat Keahlian Pelaut Teknika (ATKAPIN / ATT)', source: 'SIKAP', masaBerlakuBulan: 60, jabatanMap: {} }
          ];
        }
        rpc('dir_list', { token: token, limit: 500 })
          .then(function (rDir) {
            _awakOptions = rDir.items || [];
            if (crewSearch) crewSearch.placeholder = 'Cari nama, NIP, atau jabatan awak (' + _awakOptions.length + ' personil)...';
            if (certSearch) certSearch.placeholder = 'Cari nama atau kode sertifikat dari data SIKAP (' + _certOptions.length + ' jenis)...';
          })
          .catch(function () {});
      });
  }

  function _submitSaveSertifikat() {
    var token = AuthApp.getToken();
    var pId = document.getElementById('kom-save-pegawai-id').value;
    var kd = '';
    var namaPel = '';

    if (_isCustomCert) {
      namaPel = (document.getElementById('kom-save-custom-nama') || {}).value.trim();
      kd = (document.getElementById('kom-save-custom-kode') || {}).value.trim();
      if (!namaPel) {
        Toast.error('Tuliskan nama sertifikat atau pelatihan.');
        return;
      }
      if (!kd) kd = '__LAINNYA__';
    } else {
      kd = document.getElementById('kom-save-kode-pelatihan').value;
      namaPel = document.getElementById('kom-save-nama-pelatihan').value;
      if (!kd) {
        Toast.error('Pilih sertifikat dari katalog SIKAP atau klik "+ Di luar daftar SIKAP".');
        return;
      }
    }

    var noSert = document.getElementById('kom-save-nomor').value.trim();
    var lembaga = document.getElementById('kom-save-lembaga').value.trim();
    var tglTerbit = document.getElementById('kom-save-tgl-terbit').value;
    var tglExp = document.getElementById('kom-save-berlaku-sampai').value;

    if (!pId) {
      Toast.error('Pilih personil awak kapal terlebih dahulu.');
      return;
    }
    if (!noSert) {
      Toast.error('Nomor registrasi sertifikat wajib diisi.');
      return;
    }
    if (!tglTerbit) {
      Toast.error('Tanggal terbit wajib diisi.');
      return;
    }

    var btnSubmit = document.getElementById('btn-submit-save-sertifikat');
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Menyimpan...';
    }

    rpc('kom_saveSertifikat', {
      token: token,
      pegawaiId: pId,
      kodePelatihan: kd,
      namaPelatihan: namaPel,
      isCustom: _isCustomCert,
      nomorSertifikat: noSert,
      penerbitLembaga: lembaga,
      tanggalTerbit: tglTerbit,
      berlakuSampai: tglExp,
      fileData: _stagedCertFile
    })
      .then(function (res) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Simpan sertifikat';
        }
        Modal.close('modal-kom-save');
        Toast.success(res.message || 'Sertifikat berhasil direkam.');
        if (_activeTab === 'antrean') loadDashboard();
        else loadMatriks();
      })
      .catch(function (err) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Simpan sertifikat';
        }
        Toast.error('Gagal merekam sertifikat: ' + err.message);
      });
  }

  return {
    init: init,
    loadDashboard: loadDashboard,
    loadMatriks: loadMatriks,
    openModalCatat: openModalCatat
  };
})();
</script>
